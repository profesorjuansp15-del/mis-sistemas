  el.innerHTML=
    '<div class="grid grid-4" style="margin-bottom:18px;">'+
      kpi('accent-green','Mejoran',cnt.MEJORA,'Más áreas aprobadas que al inicio')+
      kpi('accent-red','Empeoran',cnt.EMPEORA,'Menos áreas aprobadas que al inicio')+
      kpi('accent-gold','Estables',cnt.ESTABLE,'Sin cambio en el año')+
      kpi('accent-navy','Año completo',completos,'Con notas en los '+D.pers.length+' períodos')+
    '</div>'+
    '<div class="card"><div class="card-head"><div><h3>Comparativa anual por estudiante</h3>'+
      '<div class="hint">Áreas desaprobadas en cada '+(DB.config.evaluacion.modo==='trimestral'?'trimestre':'bimestre')+' y evolución del rendimiento. La línea sube cuando aumentan las áreas aprobadas. Los períodos son los configurados en Configuración (los ocultos no se muestran).</div></div></div>'+
      '<div class="cfg-nomtools" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));">'+
        '<div><label class="cfg-lbl" for="cmpQ">Buscar</label><input class="cfg-in" id="cmpQ" placeholder="Apellidos o nombres" value="'+esc(_cmpFiltros.q)+'" oninput="_cmpFiltros.q=this.value;_cmpFiltros.pag=0;cmpPintar()"></div>'+
        '<div><label class="cfg-lbl" for="cmpG">Grado</label><select class="cfg-in" id="cmpG" onchange="_cmpFiltros.grado=this.value;_cmpFiltros.pag=0;cmpPintar()">'+gOpt+'</select></div>'+
        '<div><label class="cfg-lbl" for="cmpS">Sección</label><select class="cfg-in" id="cmpS" onchange="_cmpFiltros.seccion=this.value;_cmpFiltros.pag=0;cmpPintar()">'+sOpt+'</select></div>'+
        '<div><label class="cfg-lbl" for="cmpT">Tendencia</label><select class="cfg-in" id="cmpT" onchange="_cmpFiltros.tend=this.value;_cmpFiltros.pag=0;cmpPintar()">'+tOpt+'</select></div>'+
        '<div><label class="cfg-lbl" for="cmpD">Con áreas desaprobadas en</label><select class="cfg-in" id="cmpD" onchange="_cmpFiltros.desap=this.value;_cmpFiltros.pag=0;cmpPintar()">'+dOpt+'</select></div>'+
        '<div><label class="cfg-lbl" for="cmpO">Ordenar por total de áreas</label><select class="cfg-in" id="cmpO" onchange="cmpOrdenar(this.value)"><option value=""'+(_cmpFiltros.orden===''?' selected':'')+'>Orden alfabético</option><option value="asc"'+(_cmpFiltros.orden==='asc'?' selected':'')+'>De menor a mayor</option><option value="desc"'+(_cmpFiltros.orden==='desc'?' selected':'')+'>De mayor a menor</option></select></div>'+
        '<div><label class="cfg-lbl" for="cmpM">Mínimo de áreas</label><select class="cfg-in" id="cmpM" onchange="_cmpFiltros.min=this.value;_cmpFiltros.pag=0;cmpPintar()">'+mOpt+'</select></div>'+
        '<div class="btn-row" style="flex-wrap:nowrap;"><button type="button" class="btn" onclick="cmpImprimir()">Imprimir</button><button type="button" class="btn secondary" onclick="cmpExportar()">Exportar Excel</button></div></div>'+
      '<div id="cmpResumen"></div>'+
      '<div class="small-muted" id="cmpCount" style="margin-bottom:8px;"></div>'+
      '<div id="cmpTabla"></div></div>';
  cmpPintar();
}
function cmpResumen(rows){
  const D=_cmpDatos;
  return D.pers.map(function(p,i){
    let ev=0,con=0,tot=0,tres=0; const porArea={};
    rows.forEach(function(r){
      const x=r.pts[i]; if(!x||!x.ev) return;
      ev++; if(x.nDes>0) con++; tot+=x.nDes; if(x.nDes>=3) tres++;
      x.des.forEach(function(a){ porArea[a]=(porArea[a]||0)+1; });
    });
    const top=Object.keys(porArea).sort(function(a,b){return porArea[b]-porArea[a];}).slice(0,3).map(function(a){return sitAbrev(a)+' ('+porArea[a]+')';}).join(', ');
    return {per:p,ev:ev,con:con,pct:ev?Math.round(con*100/ev):0,tot:tot,tres:tres,prom:ev?(tot/ev).toFixed(2):'0.00',top:top||'—'};
  });
}
function cmpPintar(){
  const D=_cmpDatos, rows=cmpFiltradas(), tot=rows.length;
  const maxPag=Math.max(0,Math.ceil(tot/CMP_PAG)-1);
  if(_cmpFiltros.pag>maxPag) _cmpFiltros.pag=maxPag;
  const ini=_cmpFiltros.pag*CMP_PAG, vis=rows.slice(ini,ini+CMP_PAG);
  $('#cmpCount').textContent='Mostrando '+(tot?ini+1:0)+'–'+(ini+vis.length)+' de '+tot+' estudiantes';
  const res=cmpResumen(rows);
  $('#cmpResumen').innerHTML=tot?'<div class="cfg-scroll" style="max-height:none;margin-bottom:14px;"><table class="cfg-nom"><thead><tr><th class="l">Resumen del filtro actual ('+tot+' estudiantes)</th><th>Evaluados</th><th>Con áreas desaprobadas</th><th>%</th><th>Total áreas desaprobadas</th><th>Promedio por estudiante</th><th>Con 3 o más áreas</th><th class="l">Áreas más desaprobadas</th></tr></thead><tbody>'+
    res.map(function(x){return '<tr><td class="cfg-nm">'+esc(x.per)+'</td><td class="cfg-n">'+x.ev+'</td><td class="cfg-n">'+x.con+'</td><td class="cfg-n">'+x.pct+'%</td><td class="cfg-n"><strong>'+x.tot+'</strong></td><td class="cfg-n">'+x.prom+'</td><td class="cfg-n">'+x.tres+'</td><td style="font-size:12px;">'+esc(x.top)+'</td></tr>';}).join('')+
    '</tbody></table></div>':'';
  if(!D.pers.length){ $('#cmpTabla').innerHTML='<div class="empty-state">No hay períodos visibles. Configúralos en la pestaña Configuración.</div>'; return; }
  if(!tot){ $('#cmpTabla').innerHTML='<div class="empty-state">No hay estudiantes para mostrar.</div>'; return; }
  const th=D.pers.map(function(p){return '<th style="text-align:center;min-width:150px;">'+esc(p)+'</th>';}).join('');
  const body=vis.map(function(r,i){
    const celdas=r.pts.map(function(p,k){
      if(r.trasl) return '<td class="cmp-c"><span class="cmp-na">—</span></td>';
      if(!p.ev) return '<td class="cmp-c"><span class="cmp-na">Sin notas</span></td>';
      let flecha='';
      const prev=r.pts.slice(0,k).filter(function(x){return x.ev;}).pop();
      if(prev){ const d=(p.aprob*1000-p.nC)-(prev.aprob*1000-prev.nC); flecha=d>0?' <span class="cmp-ar up">▲</span>':(d<0?' <span class="cmp-ar down">▼</span>':' <span class="cmp-ar eq">=</span>'); }
      return '<td class="cmp-c"><span class="cmp-n '+(p.nDes?'bad':'ok')+'">'+p.nDes+'</span>'+flecha+
        '<div class="cmp-areas">'+(p.nDes?esc(p.des.map(sitAbrev).join(', ')):'Sin áreas desaprobadas')+'</div></td>';
    }).join('');
    return '<tr><td class="cfg-n">'+(ini+i+1)+'</td>'+
      '<td><div class="cfg-nm">'+esc(r.e.apellidos+', '+r.e.nombres)+'</div></td>'+
      '<td class="cfg-sec">'+cfgGYS(r.e)+'</td>'+celdas+
      '<td class="cmp-c"><span class="cmp-n '+(r.total?'bad':'ok')+'">'+(r.trasl?'—':r.total)+'</span></td>'+
      '<td style="text-align:center;">'+(r.trasl?'':cmpSparkline(r,D.pers.length))+'<div>'+(r.trasl?'<span class="cmp-badge cmp-na">Trasladado</span>':cmpTendBadge(r.tend))+'</div></td>'+
      '<td class="cmp-msg'+(r.completo?' fin':'')+'">'+esc(r.mensaje)+'</td></tr>';
  }).join('');
  const pag=maxPag>0?'<div class="btn-row" style="margin-top:12px;justify-content:center;">'+
    '<button class="btn secondary sm" '+(_cmpFiltros.pag<=0?'disabled':'')+' onclick="_cmpFiltros.pag--;cmpPintar()">Anterior</button>'+
    '<span class="small-muted" style="align-self:center;">Página '+(_cmpFiltros.pag+1)+' de '+(maxPag+1)+'</span>'+
    '<button class="btn secondary sm" '+(_cmpFiltros.pag>=maxPag?'disabled':'')+' onclick="_cmpFiltros.pag++;cmpPintar()">Siguiente</button></div>':'';
  $('#cmpTabla').innerHTML='<div class="cfg-scroll"><table class="cfg-nom"><thead><tr><th>N.º</th><th class="l">Estudiante</th><th>Grado y secc.</th>'+th+'<th style="cursor:pointer;" onclick="cmpCiclarOrden()" title="Clic para ordenar de menor a mayor / mayor a menor">Total áreas desaprob. '+(_cmpFiltros.orden==='asc'?'▲':(_cmpFiltros.orden==='desc'?'▼':'↕'))+'</th><th style="min-width:130px;">Evolución</th><th class="l" style="min-width:300px;">Mensaje</th></tr></thead><tbody>'+body+'</tbody><tfoot><tr class="cmp-tot"><td colspan="3">TOTAL ('+tot+' estudiantes)</td>'+res.map(function(x){return '<td class="cmp-c">'+x.tot+' áreas<div class="cmp-areas">'+x.con+' estudiante(s)</div></td>';}).join('')+'<td class="cmp-c">'+rows.reduce(function(a,r){return a+r.total;},0)+'</td><td></td><td></td></tr></tfoot></table></div>'+pag;
}
function cmpExportar(){
  const D=_cmpDatos, rows=cmpFiltradas();
  const aoa=[['Estudiante','Grado','Sección'].concat(D.pers.map(function(p){return p+' - N.º áreas desaprobadas';}),D.pers.map(function(p){return p+' - Áreas desaprobadas';}),['Total áreas desaprobadas','Tendencia','Mensaje'])];
  rows.forEach(function(r){
    aoa.push([r.e.apellidos+', '+r.e.nombres,r.e.grado,r.e.seccion].concat(
      r.pts.map(function(p){return p.ev?p.nDes:'';}),
      r.pts.map(function(p){return p.ev?p.des.map(sitAbrev).join(', '):'';}),
      [r.total,{MEJORA:'Mejora',EMPEORA:'Empeora',ESTABLE:'Estable',NA:'Sin datos'}[r.tend],r.mensaje]));
  });
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),'Comparativa anual');
  XLSX.writeFile(wb,'Comparativa_anual_'+todayISO()+'.xlsx');
}



function cmpFiltroTxt(){
  const f=_cmpFiltros, D=_cmpDatos, t=[];
  if(f.grado) t.push(f.grado+'.º grado'); if(f.seccion) t.push('Sección '+f.seccion);
  if(f.desap!==''){ t.push('Con '+(Number(f.min)>=4?'4 o más':f.min+' o más')+' área(s) desaprobada(s) en '+(f.desap==='any'?'cualquier período':D.pers[Number(f.desap)])); }
  if(f.tend) t.push('Tendencia: '+({MEJORA:'Mejora',EMPEORA:'Empeora',ESTABLE:'Estable',NA:'Sin datos'}[f.tend]));
  if(f.q) t.push('Búsqueda: '+f.q);
  return t.length?t.join(' · '):'Todos los estudiantes';
}
function cmpImprimir(){
  const D=_cmpDatos, rows=cmpFiltradas();
  if(!rows.length){ toast('No hay estudiantes para imprimir con este filtro.','err'); return; }
  const res=cmpResumen(rows), ie=(DB.instituciones[0]&&DB.instituciones[0].nombre)||'', fecha=new Date().toLocaleDateString('es-PE',{year:'numeric',month:'long',day:'numeric'});
  const tn={MEJORA:'Mejora',EMPEORA:'Empeora',ESTABLE:'Estable',NA:'—'};
  const th=D.pers.map(function(p){return '<th>'+esc(p)+'</th>';}).join('');
  const body=rows.map(function(r,i){
    return '<tr><td>'+(i+1)+'</td><td class="l">'+esc(r.e.apellidos+', '+r.e.nombres)+'</td><td>'+cfgGYS(r.e)+'</td>'+
      r.pts.map(function(p){return '<td>'+(r.trasl?'—':(p.ev?'<b class="'+(p.nDes?'bad':'ok')+'">'+p.nDes+'</b>'+(p.nDes?'<br><small>'+esc(p.des.map(sitAbrev).join(', '))+'</small>':''):'<small>s/n</small>')) +'</td>';}).join('')+
      '<td><b>'+(r.trasl?'—':r.total)+'</b></td><td>'+(r.trasl?'Trasladado':tn[r.tend])+'</td></tr>';
  }).join('');
  const totRow='<tr class="tot"><td colspan="3">TOTAL ('+rows.length+' estudiantes)</td>'+res.map(function(x){return '<td>'+x.tot+' áreas<br><small>'+x.con+' estud.</small></td>';}).join('')+'<td>'+rows.reduce(function(a,r){return a+r.total;},0)+'</td><td></td></tr>';
  const resH='<table class="res"><thead><tr><th class="l">Período</th><th>Evaluados</th><th>Con áreas desaprobadas</th><th>%</th><th>Total áreas desaprobadas</th><th>Promedio</th><th>Con 3 o más</th><th class="l">Áreas más desaprobadas</th></tr></thead><tbody>'+
    res.map(function(x){return '<tr><td class="l">'+esc(x.per)+'</td><td>'+x.ev+'</td><td>'+x.con+'</td><td>'+x.pct+'%</td><td><b>'+x.tot+'</b></td><td>'+x.prom+'</td><td>'+x.tres+'</td><td class="l">'+esc(x.top)+'</td></tr>';}).join('')+'</tbody></table>';
  const html='<!doctype html><html><head><meta charset="utf-8"><title>Comparativa anual</title><style>'+
    '@page{size:A4 landscape;margin:10mm}body{font-family:Arial,Helvetica,sans-serif;color:#142033;font-size:10px}'+
    'h1{font-size:15px;margin:0 0 2px}.sub{color:#5b6677;font-size:10px;margin-bottom:8px}'+
    'table{border-collapse:collapse;width:100%;margin-bottom:10px}th,td{border:1px solid #b9c3d1;padding:3px 5px;text-align:center}'+
    'th{background:#132641;color:#fff;font-size:9px}td.l,th.l{text-align:left}thead{display:table-header-group}tr{page-break-inside:avoid}'+
    'b.bad{color:#b4231c}b.ok{color:#16875a}small{color:#5b6677;font-size:8px}.tot td{background:#e8eef6;font-weight:bold}.res th{background:#2d6a4f}'+
    '</style></head><body><h1>Comparativa anual de áreas desaprobadas</h1><div class="sub">'+esc(ie)+' · Nivel Secundaria · '+esc(cmpFiltroTxt())+' · Emitido: '+esc(fecha)+'</div>'+
    resH+'<table><thead><tr><th>N.º</th><th class="l">Estudiante</th><th>Gr./Sec.</th>'+th+'<th>Total</th><th>Tendencia</th></tr></thead><tbody>'+body+totRow+'</tbody></table></body></html>';
  const old=document.getElementById('cmpPrintFrame'); if(old) old.remove();
  const fr=document.createElement('iframe'); fr.id='cmpPrintFrame';
  fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
  fr.onload=function(){ setTimeout(function(){ try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){ console.error(e); } },300); };
  fr.srcdoc=html; document.body.appendChild(fr);
}

function aplicarSidebar(colapsado){
  const app=document.querySelector('.app'); if(!app) return;
  app.classList.toggle('sb-collapsed',!!colapsado);
  const lbl=document.querySelector('.sb-toggle-btn .lbl'); if(lbl) lbl.textContent=colapsado?'Mostrar menú':'Ocultar menú';
  try{ localStorage.setItem(SB_KEY,colapsado?'1':'0'); }catch(e){}
  setTimeout(function(){ window.dispatchEvent(new Event('resize')); },260);
}
