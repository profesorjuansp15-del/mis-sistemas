      }
    }, 0);
  };

  reader.onerror = function(err){
    console.error('[SIAGIE simple] FileReader.onerror:', err);
    showError('Error al leer el archivo. Verifica que sea un Excel (.xlsx) exportado desde SIAGIE.');
  };

  reader.readAsArrayBuffer(file);
}

/* --- Carga múltiple (importación directa sin preview) --- */
function siagieCargarMulti(event){
  const files = Array.from(event.target.files);
  if(!files.length) return;
  siagieLimpiar();

  const progWrap  = $('#siagieProgress');
  const progLabel = $('#siagieProgressLabel');
  const progPct   = $('#siagieProgressPct');
  const progFill  = $('#siagieProgressFill');
  const progSub   = $('#siagieProgressSub');

  /* Actualiza la barra visual de forma garantizada */
  function setProgress(pct, label, sub){
    var p = Math.min(100, Math.max(0, Math.round(pct)));
    console.log('[SIAGIE] setProgress:', p + '%', label || '');
    progFill.style.width  = p + '%';
    progPct.textContent   = p + ' %';
    if(label !== undefined) progLabel.textContent = label;
    if(sub   !== undefined) progSub.textContent   = sub || '';
    // Cambiar color al llegar al 100 %
    if(p === 100){
      progFill.style.background = 'linear-gradient(90deg,var(--teal),#1c6f61)';
    }
  }

  progWrap.style.display = 'block';
  setProgress(0, 'Iniciando importación…', '');
  console.log('[SIAGIE] Inicio importación múltiple — archivos:', files.length);

  let totalOk=0, totalNoEnc=0, totalCreados=0, totalErrores=0, idx=0;

  function siguiente(){
    /* ── Todos los archivos procesados ── */
    if(idx >= files.length){
      console.log('[SIAGIE] Todos los archivos procesados. Guardando DB…');
      try{
        saveDB();
        console.log('[SIAGIE] saveDB() completado.');
      }catch(saveErr){
        console.error('[SIAGIE] Error en saveDB():', saveErr);
      }

      /* Forzar 100 % ANTES de cualquier operación de render */
      setProgress(100, 'Importación completada', '');
      console.log('[SIAGIE] Barra al 100 %. Actualizando interfaz…');

      /* Dejar que el navegador pinte el 100 % antes de continuar */
      setTimeout(function(){
        try{ renderSidebarBadge(); }catch(e){ console.error('[SIAGIE] renderSidebarBadge error:', e); }

        var creadosTxt = totalCreados > 0
          ? ' · <strong>' + totalCreados + '</strong> estudiante(s) creado(s) automáticamente'
          : '';
        var errTxt = totalErrores > 0
          ? ' · <span style="color:var(--red-strong);">' + totalErrores + ' error(es)</span>'
          : '';

        /* Mostrar resumen en el panel de progreso */
        progLabel.innerHTML =
          '&#10003; <strong>' + files.length + ' archivo(s)</strong> procesado(s) — ' +
          '<strong>' + totalOk + '</strong> estudiante(s) con notas' +
          creadosTxt + errTxt;
        progSub.textContent = 'Importación completada correctamente. Redirigiendo al Consolidado…';

        toast('SIAGIE: ' + totalOk + ' estudiante(s) importado(s) desde ' + files.length + ' archivo(s).');
        console.log('[SIAGIE] Navegando al consolidado…');

        try{
          renderConsolidado();
          navigateTo('consolidado');
        }catch(navErr){
          console.error('[SIAGIE] Error al navegar:', navErr);
        }
      }, 80); /* 80 ms para que el navegador renderice el 100 % */
      return;
    }

    /* ── Procesar archivo actual ── */
    const file = files[idx];
    /* Progreso: cada archivo ocupa desde (idx/total)*100 hasta ((idx+1)/total)*100
       Mostramos el inicio del tramo actual */
    var pctInicio = Math.round((idx / files.length) * 100);
    setProgress(
      pctInicio,
      'Procesando archivo ' + (idx + 1) + ' de ' + files.length,
      file.name
    );
    console.log('[SIAGIE] Procesando archivo', idx + 1, '/', files.length, '—', file.name);

    const reader = new FileReader();

    reader.onload = function(e){
      console.log('[SIAGIE] FileReader.onload — archivo:', file.name);
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        console.log('[SIAGIE] XLSX.read OK — hojas:', wb.SheetNames.join(', '));
        const resultado = siagieParseWB(wb);
        console.log('[SIAGIE] siagieParseWB OK — estudiantes:', resultado.length);
        const {ok, noEnc, creados} = siagieAplicarResultado(resultado);
        console.log('[SIAGIE] siagieAplicarResultado — ok:', ok, 'noEnc:', noEnc, 'creados:', creados);
        totalOk      += ok;
        totalNoEnc   += noEnc;
        totalCreados += (creados || 0);
      }catch(err){
        totalErrores++;
        console.error('[SIAGIE] Error procesando ' + file.name + ':', err);
      }

      /* Progreso: tramo completado para este archivo.
         Si hay más archivos pendientes limitamos a 95 % para reservar el tramo final
         al guardado. Si es el último archivo, el 100 % lo emite la función siguiente(). */
      var pctFin = Math.round(((idx + 1) / files.length) * 95);
      setProgress(pctFin, 'Procesando archivo ' + (idx + 1) + ' de ' + files.length, file.name);

      idx++;
      /* Pequeña pausa para que el navegador pinte el progreso intermedio */
      setTimeout(siguiente, 0);
    };

    reader.onerror = function(err){
      totalErrores++;
      console.error('[SIAGIE] FileReader.onerror — archivo:', file.name, err);
      idx++;
      setTimeout(siguiente, 0);
    };

    reader.readAsArrayBuffer(file);
  }

  /* Arrancar con un tick de delay para que el navegador pinte el estado inicial */
  setTimeout(siguiente, 0);
}

/* --- Helper global de barra de progreso SIAGIE (usado por siagieAplicar) --- */

  var lblEl = $('#siagieProgressLabel');

  if(wrap && wrap.style.display === 'none') wrap.style.display = 'block';

    fill.style.width = p + '%';

      ? 'linear-gradient(90deg,var(--teal),#1c6f61)'

/* ============================================================
   MÓDULO: SITUACIÓN DEL ESTUDIANTE
   Reglas reproducidas del libro "SISTEMA DE SITUACION...xlsm":
   - Un área queda desaprobada cuando C aparece en más de la mitad
     de sus competencias (2/2, 2/3, 3/4 o 1/1).
   - 1.º, 3.º y 4.º: 0 áreas desaprobadas = promovido; 1 a 3 =
     recuperación; 4 o más = permanece en el grado.
   - 2.º y 5.º: sin C = promovido; con C y hasta 3 áreas
     desaprobadas = recuperación; 4 o más = permanece.
   ============================================================ */
let _situacionFiltros={grado:'',seccion:'',estado:'',q:''};

const SIT_ABREV={'Desarrollo Personal, Ciudadanía y Cívica':'DPCC','Ciencias Sociales':'CCSS','Educación para el Trabajo':'EPT','Educación Física':'EF','Comunicación':'COM','Arte y Cultura':'ART','Inglés':'ING','Matemática':'MAT','Ciencia y Tecnología':'CYT','Educación Religiosa':'ER'};
function sitAbrev(n){ return SIT_ABREV[n]||n; }
/* Fuente única de reglas: RVM 094-2020-MINEDU modificada por RVM 048-2024-MINEDU (sección 5.1.3) */
function calcularSituacionEstudiante(estudiante, vmap){
  if(estudiante.traslado==='SI'){
    return {estudiante,grado:Number(estudiante.grado),estado:'TRASLADADO',codigo:'TRASLADADO',codigoExcel:'TRAS',motivo:'Estudiante trasladado.',totalC:0,nAD:0,nA:0,nB:0,nC:0,evaluadas:0,totalCompetencias:0,areasDesaprobadas:[],areasConC:[],areasARecuperar:[],cobertura:0};
  }
  const vigentes=vmap||getVigentesMap(), grado=Number(estudiante.grado), g25=(grado===2||grado===5);
  let evaluadas=0, totalCompetencias=0, nAD=0,nA=0,nB=0,nC=0;
  const areasDesaprobadas=[], areasConC=[];
  let areasOK=0, areasEval=0, areasAAD=0;
  consAreasOrdenadas().forEach(function(area){
    if(area.nombre.indexOf('Temas Transversales')===0) return;
    const comps=area.competencias||[]; if(!comps.length) return;
    let tot=0,c=0,aa=0;
    comps.forEach(function(comp){
      totalCompetencias++;
      const reg=vigentes.get(estudiante.id+'|'+area.id+'|'+comp.id), n=reg?String(reg.calificacion||'').trim().toUpperCase():'';
      if(!n) return;
      tot++; evaluadas++;
      if(n==='C'){c++;nC++;} else if(n==='B'){nB++;} else if(n==='A'){nA++;aa++;} else if(n==='AD'){nAD++;aa++;}
    });
    if(!tot) return;
    areasEval++;
    if(c>0) areasConC.push(area.nombre);
    if((tot-c)*2>=tot) areasOK++;
    if(aa*2>=tot) areasAAD++;
    if(g25?(c*2>=tot):(c*2>tot)) areasDesaprobadas.push(area.nombre);
  });
  let estado='SIN EVALUAR', codigo='SIN_EVALUAR', motivo='No registra calificaciones vigentes.';
  if(evaluadas>0 && ([1,2,3,4,5].includes(grado))){
    if(areasDesaprobadas.length>=4){
      estado='PERMANECE EN EL GRADO';codigo='PERMANECE';
      motivo=g25?'Tiene C en la mitad o más de las competencias de 4 o más áreas.':'Tiene C en más de la mitad de las competencias de 4 o más áreas.';
    } else if(g25 ? (nC===0 && areasAAD>=3) : (areasOK===areasEval)){
      estado='PROMOVIDO';codigo='PROMOVIDO';
      motivo=g25?'A o AD en la mitad o más de las competencias de 3 áreas y B en las demás.':'B o más en la mitad o más de las competencias de todas las áreas.';
    } else {
      estado='REQUIERE RECUPERACIÓN';codigo='RECUPERACION';
      motivo=g25?(nC>0?'Tiene competencias en C: no cumple promoción ni permanencia.':'No alcanza A o AD en 3 áreas: no cumple promoción ni permanencia.'):'Tiene áreas con menos de la mitad de competencias en B o más (menos de 4 áreas con C).';
    }
  }
  const codigoExcel={PROMOVIDO:'PROM',RECUPERACION:'REC',PERMANECE:'PER',SIN_EVALUAR:'—'}[codigo]||'—';
  const areasARecuperar=(g25&&codigo==='RECUPERACION')?areasConC.filter(function(n){return areasDesaprobadas.indexOf(n)<0;}):[];
  return {estudiante,grado,estado,codigo,codigoExcel,motivo,totalC:nC,nAD,nA,nB,nC,evaluadas,totalCompetencias,areasDesaprobadas,areasConC,areasARecuperar,areasEvaluadas:areasEval,
    cobertura:totalCompetencias?Math.round(evaluadas*100/totalCompetencias):0};
}

function obtenerSituaciones(){
  return DB.estudiantes.map(calcularSituacionEstudiante).sort((a,b)=>
    a.grado-b.grado||String(a.estudiante.seccion||'').localeCompare(String(b.estudiante.seccion||''))||
    String(a.estudiante.apellidos||'').localeCompare(String(b.estudiante.apellidos||'')));
}
function situacionesFiltradas(ignorarEstado){
  const f=_situacionFiltros;
  return obtenerSituaciones().filter(r=>{
    const e=r.estudiante;
    const texto=(e.apellidos+' '+e.nombres+' '+(e.dni||'')).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const q=(f.q||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    return (!f.grado||String(e.grado)===f.grado)&&(!f.seccion||e.seccion===f.seccion)&&((ignorarEstado===true)||!f.estado||r.codigo===f.estado)&&(!q||texto.includes(q));
  });
}
function etiquetaSituacion(codigo){
  return {PROMOVIDO:'PROMOVIDO',RECUPERACION:'REQUIERE RECUPERACIÓN',PERMANECE:'PERMANECE EN EL GRADO',SIN_EVALUAR:'SIN EVALUAR',TRASLADADO:'TRASLADADO'}[codigo]||codigo;
}

        <div class="btn-row" style="gap:8px;"><button class="btn secondary" onclick="sitImprimir()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>Imprimir</button><button class="btn gold" onclick="sitDescargarPDF()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15l3 3 3-3"/></svg>Descargar PDF</button>

function sitBuildPDF(){

  const HX={AD:[29,120,193],A:[124,194,67],B:[245,166,35],C:[229,57,53]};

    if(gi++>0) doc.addPage();

    const body=list.map(function(r,i){
      const e=r.estudiante, ev=r.evaluadas;

        r.codigoExcel];
    });
    doc.autoTable({
      head:[['N.º','APELLIDOS Y NOMBRES','GRADO Y SECC.','AD','A','B','C','ÁREAS DESAP. (N.º)','ÁREAS DESAPROBADAS','ÁREA A RECUPERAR','SITUACIÓN']],
      body:body, startY:21, theme:'grid', margin:{top:21,left:ML,right:ML,bottom:14}, tableWidth:PW-2*ML, rowPageBreak:'avoid',
      styles:{fontSize:7.5,cellPadding:{top:1.8,bottom:1.8,left:1.5,right:1.5},valign:'middle',halign:'center',lineColor:[221,225,232],lineWidth:0.15,textColor:[26,34,51],overflow:'linebreak'},
      headStyles:{fillColor:[19,38,65],textColor:255,fontSize:7,fontStyle:'bold',lineColor:[60,80,110]},
      alternateRowStyles:{fillColor:[248,249,252]},
      columnStyles:{0:{cellWidth:8,textColor:[123,134,152]},1:{cellWidth:66,halign:'left',fontStyle:'bold'},2:{cellWidth:18},3:{cellWidth:17},4:{cellWidth:17},5:{cellWidth:17},6:{cellWidth:17},7:{cellWidth:20},8:{cellWidth:'auto',halign:'left',textColor:[164,34,44],fontStyle:'bold'},9:{cellWidth:34,halign:'left',fontStyle:'bold'},10:{cellWidth:19,fontStyle:'bold'}},
      didParseCell:function(d){
        const ci=d.column.index, r=list[d.row.index];
        if(d.section==='head'){
          if(ci===3){d.cell.styles.fillColor=HX.AD;} if(ci===4){d.cell.styles.fillColor=HX.A;d.cell.styles.textColor=[23,59,11];}
          if(ci===5){d.cell.styles.fillColor=HX.B;d.cell.styles.textColor=[59,37,0];} if(ci===6){d.cell.styles.fillColor=HX.C;}

          if(ci===8){d.cell.styles.fillColor=[217,45,32];} if(ci===9){d.cell.styles.fillColor=[245,197,24];d.cell.styles.textColor=[59,49,0];}
          if(ci===10){d.cell.styles.fillColor=[134,201,66];d.cell.styles.textColor=[23,59,11];}
          if(ci===1||ci===8||ci===9) d.cell.styles.halign='left';

  const n=doc.getNumberOfPages();

    doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(6.8); doc.setTextColor(150,158,170);
    doc.text('PROM = Promovido · REC = Requiere recuperación · PER = Permanece en el grado · Porcentajes sobre competencias con nota · RVM 094-2020-MINEDU mod. RVM 048-2024-MINEDU',ML,PH-6);
    doc.text('Hoja '+i+' de '+n,PW-ML,PH-6,{align:'right'});
  }
  return doc;
}

/* ============================================================
   PESTAÑA: SITUACIÓN FINAL
   Cuadro resumen por grado y sexo (H/M) + gráficos + lista filtrable.
   Situaciones: Promovido, Requiere recuperación, Permanece en el grado,
   Trasladado (se marca en la ficha del estudiante o desde esta pestaña) y Sin evaluar.
   ============================================================ */
let sfF={ie:'',grado:'',seccion:'',estado:''};
let _sfCharts={};
const SF_DEF=[
  {k:'PROMOVIDO',t:'Promovido',ab:'PROM',col:'#1f77c4',bg:[223,243,230],fg:[23,105,58]},
  {k:'RECUPERACION',t:'Requiere recuperación',ab:'REC',col:'#e53935',bg:[253,239,208],fg:[138,90,0]},
  {k:'PERMANECE',t:'Permanece en el grado',ab:'PER',col:'#f57c00',bg:[251,217,214],fg:[164,34,44]},
  {k:'TRASLADADO',t:'Trasladado',ab:'TRAS',col:'#f2c200',bg:[255,244,190],fg:[110,90,0]},
  {k:'SIN_EVALUAR',t:'Sin evaluar',ab:'S/E',col:'#9aa5b5',bg:[237,240,245],fg:[101,112,134]}
];
function sfDestroy(){ Object.keys(_sfCharts).forEach(function(k){ try{_sfCharts[k].destroy();}catch(e){} }); _sfCharts={}; }
function sfAmbitoTxt(){
  const s=sfF, ie=s.ie?institucionNombre(s.ie):(DB.instituciones.length>1?'Todas las instituciones':(DB.instituciones[0]?DB.instituciones[0].nombre:'Toda la IE'));
  return ie+' · '+(s.grado?s.grado+'.º grado':'Todos los grados')+(s.seccion?' "'+s.seccion+'"':(s.grado?' · todas las secciones':''));
}
function sfAlcance(){
  return DB.estudiantes.filter(function(e){
    if(sfF.ie && e.institucionId!==sfF.ie) return false;
    if(sfF.grado && String(e.grado)!==String(sfF.grado)) return false;
    if(sfF.seccion && String(e.seccion||'').toUpperCase()!==sfF.seccion) return false;
    return true;
  });
}
function sfCompute(){
  const est=sfAlcance(), m={MAT:{},PROMOVIDO:{},RECUPERACION:{},PERMANECE:{},TRASLADADO:{},SIN_EVALUAR:{}};
  Object.keys(m).forEach(function(k){ GRADOS.forEach(function(g){ m[k][g]={H:0,M:0}; }); });
  const filas=est.map(function(e){
    const r=calcularSituacionEstudiante(e), sx=(String(e.sexo||'M').toUpperCase().startsWith('F'))?'M':'H', g=Number(e.grado);
    if(m.MAT[g]){ m.MAT[g][sx]++; if(m[r.codigo]) m[r.codigo][g][sx]++; }
    return {e:e,r:r,sx:sx};
  });
  const tot=function(k,s){ return GRADOS.reduce(function(a,g){return a+(s?m[k][g][s]:m[k][g].H+m[k][g].M);},0); };
  return {est:est,m:m,filas:filas,tot:tot};
}

function sfBuildPDF(){

  if(!window.jspdf||!window.jspdf.jsPDF){ toast('No se cargó la librería PDF. Verifica tu conexión a internet.','err'); return null; }

    doc.setDrawColor(19,38,65); doc.setLineWidth(0.6); doc.line(M,18,PW-M,18);
  };
  enc();
  const filas=[['Matriculado','MAT'],['Promovido (aprobado)','PROMOVIDO'],['Requiere recuperación','RECUPERACION'],['Permanece en el grado','PERMANECE'],['Trasladado','TRASLADADO'],['Sin evaluar','SIN_EVALUAR']];
  const head1=[{content:'SITUACIÓN FINAL',rowSpan:2,styles:{halign:'left',valign:'middle'}},{content:'TOTAL',rowSpan:2,styles:{valign:'middle'}},{content:'SUB TOTAL',colSpan:2}].concat(G.map(function(g){return {content:nom[g-1],colSpan:2};}));
  const head2=[]; for(let i=0;i<1+G.length;i++){ head2.push('H'); head2.push('M'); }
  const body=filas.map(function(f){ const k=f[1], r=[f[0],D.tot(k),D.tot(k,'H'),D.tot(k,'M')]; G.forEach(function(g){ r.push(D.m[k][g].H,D.m[k][g].M); }); return r; });
  const sm=function(s,g){ return ['PROMOVIDO','RECUPERACION','PERMANECE','TRASLADADO','SIN_EVALUAR'].reduce(function(a,k){return a+(g?D.m[k][g][s]:D.tot(k,s));},0); };
  (function(){ const r=['Total sumado',sm('H')+sm('M'),sm('H'),sm('M')]; G.forEach(function(g){ r.push(sm('H',g),sm('M',g)); }); body.push(r); })();
  doc.autoTable({head:[head1,head2],body:body,startY:21,theme:'grid',margin:{left:M,right:M,top:21,bottom:12},tableWidth:W,
    styles:{fontSize:8.5,cellPadding:1.6,halign:'center',valign:'middle',lineColor:[170,180,195],lineWidth:0.2,textColor:[20,25,40],fillColor:[221,235,247]},
    headStyles:{fillColor:[84,130,53],textColor:255,fontStyle:'bold',fontSize:8.5},
    columnStyles:{0:{halign:'left',fontStyle:'bold',cellWidth:44,fillColor:[255,255,255]},1:{fontStyle:'bold',fillColor:[255,255,255]}},
    didParseCell:function(d){ if(d.section==='head'&&d.row.index===1){ d.cell.styles.fillColor=[255,242,204]; d.cell.styles.textColor=[20,25,40]; } if(d.section==='body'&&d.row.index===body.length-1){ d.cell.styles.fontStyle='bold'; d.cell.styles.fillColor=[208,222,238]; } }});
  let y=doc.lastAutoTable.finalY+4;
  const im=sfImg('hm');
  if(im){ const hh=Math.min(PH-y-14,W*im.h/im.w), ww=hh*im.w/im.h; doc.addImage(im.data,'PNG',M+(W-ww)/2,y,ww,hh); }
  doc.addPage(); enc();
  const a=sfImg('gr'), b=sfImg('tot'), hw=(W-4)/2, hh2=Math.min(80,Math.max(a?hw*a.h/a.w:0,b?hw*b.h/b.w:0));
  if(a){ const h1=Math.min(hh2,hw*a.h/a.w), w1=h1*a.w/a.h; doc.addImage(a.data,'PNG',M+(hw-w1)/2,22,w1,h1); }
  if(b){ const h1=Math.min(hh2,hw*b.h/b.w), w1=h1*b.w/b.h; doc.addImage(b.data,'PNG',M+hw+4+(hw-w1)/2,22,w1,h1); }
  const c=sfImg('h'), d2=sfImg('m'), y2=22+hh2+6;
  const hh3=Math.min(PH-y2-14,Math.max(c?hw*c.h/c.w:0,d2?hw*d2.h/d2.w:0));
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(19,38,65);
  if(c){ const h1=Math.min(hh3-5,hw*c.h/c.w), w1=h1*c.w/c.h; doc.text('Hombres',M+hw/2,y2+3,{align:'center'}); doc.addImage(c.data,'PNG',M+(hw-w1)/2,y2+5,w1,h1); }
  if(d2){ const h1=Math.min(hh3-5,hw*d2.h/d2.w), w1=h1*d2.w/d2.h; doc.text('Mujeres',M+hw+4+hw/2,y2+3,{align:'center'}); doc.addImage(d2.data,'PNG',M+hw+4+(hw-w1)/2,y2+5,w1,h1); }
  /* lista por grado y sección */
  const lista=D.filas.filter(function(f){return !sfF.estado||f.r.codigo===sfF.estado;}).sort(function(a,b){return a.e.grado-b.e.grado||String(a.e.seccion).localeCompare(String(b.e.seccion))||a.e.apellidos.localeCompare(b.e.apellidos);});
  const grp=new Map(); lista.forEach(function(f){ const k=f.e.grado+String(f.e.seccion||'').toUpperCase(); if(!grp.has(k)) grp.set(k,[]); grp.get(k).push(f); });
  let cur='';

      body:arr.map(function(f,i){ return [i+1,(f.e.apellidos+', '+f.e.nombres).toUpperCase(),f.sx,f.r.nC,f.r.areasDesaprobadas.map(sitAbrev).join(', ')||'—',f.r.codigoExcel]; }),
      startY:26,theme:'grid',margin:{top:26,left:M,right:M,bottom:14},tableWidth:W,rowPageBreak:'avoid',
      styles:{fontSize:8,cellPadding:1.6,halign:'center',valign:'middle',lineColor:[221,225,232],lineWidth:0.15,textColor:[26,34,51]},
      headStyles:{fillColor:[19,38,65],textColor:255,fontSize:7.5,fontStyle:'bold'},alternateRowStyles:{fillColor:[248,249,252]},
      columnStyles:{0:{cellWidth:10},1:{halign:'left',fontStyle:'bold',cellWidth:90},2:{cellWidth:14},3:{cellWidth:14,fontStyle:'bold',textColor:[164,34,44]},4:{halign:'left',textColor:[164,34,44],cellWidth:'auto'},5:{cellWidth:32,fontStyle:'bold'}},
      didParseCell:function(d){ if(d.section==='head'&&d.column.index===1) d.cell.styles.halign='left'; if(d.section==='body'&&d.column.index===5){ const f=arr[d.row.index], df=SF_DEF.find(function(x){return x.k===f.r.codigo;}); if(df){ d.cell.styles.fillColor=df.bg; d.cell.styles.textColor=df.fg; d.cell.text=[df.ab+' · '+df.t]; } } },
      didDrawPage:pie});
  });
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(6.8); doc.setTextColor(150,158,170); doc.text('H = hombres · M = mujeres · RVM 094-2020-MINEDU modificada por RVM 048-2024-MINEDU',M,PH-6); doc.text('Hoja '+i+' de '+n,PW-M,PH-6,{align:'right'}); }
  return doc;
}
function sfDescargarPDF(){ const doc=sfBuildPDF(); if(!doc) return; doc.save('Situacion_final_'+todayISO()+'.pdf'); toast('PDF descargado.'); }
function sfImprimir(){
  const doc=sfBuildPDF(); if(!doc) return;
  const url=URL.createObjectURL(doc.output('blob'));
  const old=document.getElementById('sfPrintFrame'); if(old) old.remove();
  const fr=document.createElement('iframe'); fr.id='sfPrintFrame';
  fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
  fr.onload=function(){ setTimeout(function(){ try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){ window.open(url,'_blank'); } },400); };
  fr.src=url; document.body.appendChild(fr);
}

function descargarPlantillaEstudiantes(){
  const ws = XLSX.utils.aoa_to_sheet([

  ]);

function importarEstudiantesExcel(event){
  const file=event.target.files[0]; event.target.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      if(json.length<2){ toast('El archivo está vacío o sin datos.','err'); return; }

      const hdr=json[0].map(h=>String(h).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));

      // Nuevo formato: APELLIDOS Y NOMBRES | GYS | SEXO (F/M)
      const iNomComp=hdr.findIndex(h=>h.includes('apellidos') && h.includes('nombres'));
      const iGYS=hdr.findIndex(h=>h==='gys');
      const iSex=hdr.findIndex(h=>h.includes('sexo')||h==='f/m'||h==='m/f');

      // Formato antiguo (compatibilidad): columnas separadas
      const iAp=hdr.findIndex(h=>h.includes('apellido')&&!h.includes('nombre'));
      const iNm=hdr.findIndex(h=>h.includes('nombre')&&!h.includes('apellido'));
      const iGr=hdr.findIndex(h=>h.includes('grado'));
      const iSec=hdr.findIndex(h=>h.includes('secci')||h==='sec');

      const nuevoFormato = iNomComp >= 0 && iGYS >= 0;
      const viejoFormato = iAp >= 0 && iNm >= 0;

      if(!nuevoFormato && !viejoFormato){
        toast('Estructura no reconocida. Descarga la plantilla oficial.','err'); return;
      }

      let nuevos=0, duplicados=0, errores=0;
      for(let r=1;r<json.length;r++){
        const row=json[r];
        let ap='', nm='', grado=1, seccion='A', sexo='M';

        if(nuevoFormato){
          // "APELLIDOS Y NOMBRES" viene como "APELLIDOS, Nombres" o "APELLIDOS NOMBRES"
          const nomCompleto=String(row[iNomComp]||'').trim();
          if(!nomCompleto) continue;
          const partes=nomCompleto.split(',');
          ap=(partes[0]||'').trim();
          nm=(partes[1]||'').trim();
          if(!ap){ errores++; continue; }
          // GYS: ej. "3A" → grado=3, seccion='A'
          const gys=String(row[iGYS]||'').trim().toUpperCase();
          const m=gys.match(/^(\d+)([A-Z]?)$/);
          if(m){ grado=parseInt(m[1])||1; seccion=m[2]||'A'; }
          sexo=iSex>=0?(String(row[iSex]||'M').trim().toUpperCase().startsWith('F')?'F':'M'):'M';
        } else {
          ap=String(row[iAp]||'').trim();
          nm=String(row[iNm]||'').trim();
          if(!ap&&!nm) continue;
          if(!ap||!nm){ errores++; continue; }
          grado=iGr>=0?parseInt(row[iGr])||1:1;
          seccion=iSec>=0?String(row[iSec]||'A').trim().toUpperCase().slice(0,1):'A';
          sexo=iSex>=0?(String(row[iSex]||'M').trim().toUpperCase().startsWith('F')?'F':'M'):'M';
        }

        const ya=DB.estudiantes.find(ex=>
          ex.apellidos.toLowerCase()===ap.toLowerCase()&&
          ex.nombres.toLowerCase()===nm.toLowerCase()&&
          ex.grado===grado&&ex.seccion===seccion
        );
        if(ya){ duplicados++; continue; }
        DB.estudiantes.push({
          id:uid('est'),
          apellidos:ap, nombres:nm,
          dni:'', sexo,
          fechaNacimiento:'',
          grado:GRADOS.includes(grado)?grado:1,
          seccion:SECCION_LETRAS.includes(seccion)?seccion:'A',
          institucionId:''
        });
        nuevos++;
      }
      saveDB(); renderSidebarBadge();
      if(currentView==='estudiantes') renderEstudiantes();
      toast(`${nuevos} estudiantes importados${duplicados?` · ${duplicados} duplicados omitidos`:''}${errores?` · ${errores} filas con errores`:''}.`, nuevos>0?'ok':'err');
    }catch(ex){ console.error(ex); toast('Error al leer el archivo.','err'); }
  };
  reader.readAsArrayBuffer(file);
}

function consTint(hex,t){

  const m=function(v){return Math.round(v+(255-v)*t);};

}

/* Estudiantes según filtros. gsOverride: '' = todos los grupos, 'xx' = grupo concreto, undefined = usar el filtro de pantalla */
function consEstudiantesFiltrados(gsOverride, ignorarMinC){
  if(gsOverride===undefined && _consFiltroGS && consGrupos().indexOf(_consFiltroGS)<0) _consFiltroGS='';
  const gs=(gsOverride===undefined)?_consFiltroGS:gsOverride;
  let est=[...DB.estudiantes].sort(function(a,b){return a.grado-b.grado||a.seccion.localeCompare(b.seccion)||a.apellidos.localeCompare(b.apellidos);});
  if(gs) est=est.filter(function(e){return (e.grado+(e.seccion||'').toUpperCase())===gs;});
  if(!ignorarMinC && _consMinC>0) est=est.filter(function(e){return consNC(e.id)>=_consMinC;});
  if(_consOrden){
    const d=_consOrden==='desc'?-1:1;
    est.sort(function(a,b){return a.grado-b.grado||a.seccion.localeCompare(b.seccion)||d*(consNC(a.id)-consNC(b.id))||a.apellidos.localeCompare(b.apellidos);});
  }
  const cnt={};
  est.forEach(function(e){ const g=e.grado+(e.seccion||'').toUpperCase(); cnt[g]=(cnt[g]||0)+1; e._nroConsolidado=cnt[g]; });
  return est;
}
/* Situación final (RVM 094-2020-MINEDU modificada por RVM 048-2024-MINEDU, Sec. 5.1.3, secundaria): PROM / REC / PER.
   1.°,3.°,4.°: PROM = B o más en la mitad o más de competencias de cada área; PER = C en MÁS de la mitad en 4+ áreas.
   2.°,5.°: PROM = A/AD en la mitad o más en 3 áreas y B (sin C) en las demás; PER = C en la mitad o más en 4+ áreas. Resto = REC. */
const CONS_SIT={PROM:{t:'PROM',n:'Promovido',bg:'#dff3e6',fg:'#17693a',f:[223,243,230],c:[23,105,58]},REC:{t:'REC',n:'Recuperación',bg:'#fdefd0',fg:'#8a5a00',f:[253,239,208],c:[138,90,0]},PER:{t:'PER',n:'Permanece en el grado',bg:'#fbd9d6',fg:'#a4222c',f:[251,217,214],c:[164,34,44]}};
function consSitFinal(e){
  const vig=getVigentesMap(), g=Number(e.grado);
  let nAreas=0, areasOK=0, areasC4=0, areasAAD=0, hayC=false;
  consAreasOrdenadas().forEach(function(a){
    if(a.nombre.indexOf('Temas Transversales')===0) return;
    let tot=0,b=0,aa=0,c=0;
    a.competencias.forEach(function(k){ const v=vig.get(e.id+'|'+a.id+'|'+k.id); if(!v||!v.calificacion) return; tot++; const n=v.calificacion; if(n==='C'){c++;hayC=true;} else {b++; if(n==='A'||n==='AD') aa++;} });
    if(!tot) return;
    nAreas++;
    if(b*2>=tot) areasOK++;
    if((g===2||g===5)?(c*2>=tot):(c*2>tot)) areasC4++;
    if(aa*2>=tot) areasAAD++;
  });
  if(!nAreas) return null;
  if(areasC4>=4) return CONS_SIT.PER;
  if(g===2||g===5){ if(!hayC && areasAAD>=3) return CONS_SIT.PROM; }
  else if(areasOK===nAreas) return CONS_SIT.PROM;
  return CONS_SIT.REC;
}
/* Áreas desaprobadas: 1.°,3.°,4.° = C en más de la mitad de sus competencias (B o más en menos de la mitad); 2.°,5.° = C en la mitad o más */
function consAreasDesaprobadas(e){
  const vig=getVigentesMap(), g=Number(e.grado), out=[];
  consAreasOrdenadas().forEach(function(a){
    if(a.nombre.indexOf('Temas Transversales')===0) return;
    let tot=0,c=0;
    a.competencias.forEach(function(k){ const v=vig.get(e.id+'|'+a.id+'|'+k.id); if(!v||!v.calificacion) return; tot++; if(v.calificacion==='C') c++; });
    if(tot && ((g===2||g===5)?(c*2>=tot):(c*2>tot))) out.push(a.nombre);
  });
  return out;
}
function consAgrupar(est){
  const m=new Map();
  est.forEach(function(e){ const g=e.grado+(e.seccion||'').toUpperCase(); if(!m.has(g)) m.set(g,[]); m.get(g).push(e); });
  return Array.from(m.entries());
}
function consAreasOrdenadas(){
  const a=areasOrdenadas();
  return a.filter(function(x){return x.nombre.indexOf('Temas Transversales')!==0;}).concat(a.filter(function(x){return x.nombre.indexOf('Temas Transversales')===0;}));
}
function cambiarFiltroConsolidado(v){ _consFiltroGS=v; renderConsolidado(); }
function consSetOrden(o){ _consOrden=(_consOrden===o)?'':o; renderConsolidado(); }
function consSetMinC(n){ _consMinC=(_consMinC===n)?0:n; renderConsolidado(); }

    });
  });
  if(!estudiantes.length) filas='<tr><td colspan="'+ncols+'" style="padding:28px;text-align:center;color:var(--muted);">No hay estudiantes con los filtros seleccionados.</td></tr>';

  const baseGS=consEstudiantesFiltrados(undefined,true);

/* ---------- Consolidado: PDF (vectorial). gsOpt: '' o undefined = vista actual; 'xx' = un solo grado y sección ---------- */
function descargarConsolidadoPDF(gsOpt,imprimir){
  if(!DB.estudiantes.length){ toast('No hay estudiantes para exportar.','err'); return; }
  if(!window.jspdf || !window.jspdf.jsPDF){ toast('No se cargó la librería PDF. Verifica tu conexión a internet.','err'); return; }
  const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  if(typeof doc.autoTable!=='function'){ toast('No se cargó el complemento de tablas PDF. Verifica tu conexión a internet.','err'); return; }

  const est=(typeof gsOpt==='string' && gsOpt)? consEstudiantesFiltrados(gsOpt) : (gsOpt===''? consEstudiantesFiltrados('') : consEstudiantesFiltrados());
  if(!est.length){ toast('No hay estudiantes con esos filtros.','err'); return; }
  const grupos=consAgrupar(est);
  const todas=consAreasOrdenadas(), vigMap=getVigentesMap();
  const flat=[]; todas.forEach(function(a){a.competencias.forEach(function(c){flat.push({a:a,c:c});});});
  const rgb=function(hx){ return [parseInt(hx.slice(1,3),16),parseInt(hx.slice(3,5),16),parseInt(hx.slice(5,7),16)]; };
  const inst=DB.instituciones.length?DB.instituciones[0].nombre:'';
  const fecha=new Date().toLocaleDateString('es-PE',{year:'numeric',month:'long',day:'numeric'});
  const NOTA={AD:{f:[230,246,242],t:[28,111,97]},A:{f:[234,241,255],t:[36,82,168]},B:{f:[253,243,226],t:[122,79,15]},C:{f:[253,236,235],t:[164,34,44]}};
  const ML=8, USABLE=297-2*ML, WN=6, WNAME=50, WG=8, WT=9, WS=11;
  const CWm=(USABLE-WN-WNAME-WG-WT-WS)/flat.length;

  let cur={gs:'',n:0,c:0};
  const encabezado=function(){
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(19,38,65);
    doc.text('Consolidado de calificaciones por competencia',ML,10);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(107,114,128);
    doc.text((inst?inst+' · ':'')+'Nivel Secundaria · '+consGSPlano(cur.gs)+(_consMinC?' · Filtro: '+_consMinC+' C a más':''),ML,15);
    doc.text('Emitido: '+fecha+'  ·  '+cur.n+' estudiante(s)  ·  '+cur.c+' con nivel C',297-ML,10,{align:'right'});
    doc.setDrawColor(19,38,65); doc.setLineWidth(0.6); doc.line(ML,17.5,297-ML,17.5);
  };

  grupos.forEach(function(gr,gi){
    if(gi>0) doc.addPage();
    cur={gs:gr[0],n:gr[1].length,c:gr[1].filter(function(e){return consNC(e.id)>0;}).length};
    const head1=[
      {content:'N°',rowSpan:2,styles:{halign:'center',valign:'middle'}},
      {content:'APELLIDOS Y NOMBRES',rowSpan:2,styles:{halign:'left',valign:'middle'}},
      {content:'GYS',rowSpan:2,styles:{halign:'center',valign:'middle'}},
      {content:'TOTAL C',rowSpan:2,styles:{halign:'center',valign:'middle'}}
    ];
    const head2=[];
    todas.forEach(function(a){
      const col=consAreaColor(a.nombre), tint=consTint(col.bg,0.72);
      head1.push({content:a.competencias.length>1?consAreaLabel(a.nombre):consAreaAbrev(a.nombre),colSpan:a.competencias.length,styles:{halign:'center',valign:'middle',fillColor:rgb(col.bg),textColor:rgb(col.fg),fontStyle:'bold',fontSize:5.2,cellPadding:0.7}});
      a.competencias.forEach(function(){ head2.push({content:'',styles:{fillColor:tint,minCellHeight:38,cellPadding:0}}); });
    });
    head1.push({content:'SIT.\nFINAL',rowSpan:2,styles:{halign:'center',valign:'middle',fontSize:5.6}});
    const body=gr[1].map(function(e){
      const fila=[e._nroConsolidado,(e.apellidos+', '+e.nombres).toUpperCase(),e.grado+(e.seccion||'').toUpperCase(),consNC(e.id)];
      flat.forEach(function(x){ const v=vigMap.get(e.id+'|'+x.a.id+'|'+x.c.id); fila.push(v?v.calificacion:''); });
      const sf=consSitFinal(e); fila.push(sf?sf.t:'–');
      return fila;
    });
    const colStyles={0:{cellWidth:WN,textColor:[123,134,152]},1:{halign:'left',cellWidth:WNAME,fontStyle:'bold'},2:{cellWidth:WG,fontStyle:'bold'},3:{cellWidth:WT,fontStyle:'bold'}};
    for(let i=0;i<flat.length;i++) colStyles[4+i]={cellWidth:CWm};
    colStyles[4+flat.length]={cellWidth:WS,fontStyle:'bold'};
    doc.autoTable({
      head:[head1,head2], body:body, startY:20, theme:'grid',
      margin:{top:20,left:ML,right:ML,bottom:10}, tableWidth:USABLE,
      styles:{fontSize:6.3,cellPadding:0.8,halign:'center',valign:'middle',lineColor:[221,225,232],lineWidth:0.1,textColor:[26,34,51]},
      headStyles:{fillColor:[19,38,65],textColor:255,fontSize:6.5,fontStyle:'bold',lineColor:[60,80,110]},
      columnStyles:colStyles,
      didParseCell:function(d){
        if(d.section!=='body') return;
        const e=gr[1][d.row.index];
        if(d.column.index===1 && consNC(e.id)>0){ d.cell.styles.textColor=[164,34,44]; d.cell.styles.fillColor=[253,241,240]; }
        if(d.column.index===3){ const n=consNC(e.id); if(n>0){ const s=situacionPorC(n); d.cell.styles.fillColor=s.rgbF; d.cell.styles.textColor=s.rgbT; } else { d.cell.styles.textColor=[190,196,206]; } }
        if(d.column.index===4+flat.length){ const sf=consSitFinal(e); if(sf){ d.cell.styles.fillColor=sf.f; d.cell.styles.textColor=sf.c; } else d.cell.styles.textColor=[190,196,206]; }
        else if(d.column.index>=4){
          const n=d.cell.raw;
          if(n==='C'){ d.cell.styles.fillColor=[253,224,222]; d.cell.styles.textColor=[192,20,32]; d.cell.styles.fontStyle='bold'; }
          else if(n){ d.cell.styles.fillColor=[255,255,255]; d.cell.styles.textColor=[0,0,0]; d.cell.styles.fontStyle='normal'; }
          else { d.cell.text=['–']; d.cell.styles.textColor=[190,196,206]; }
        }
      },
      didDrawCell:function(d){
        if(d.section==='head' && d.row.index===1 && d.column.index>=4){
          const x=flat[d.column.index-4]; if(!x) return;
          doc.setFont('helvetica','bold'); doc.setFontSize(5.3); doc.setTextColor(26,34,51);
          const lines=doc.splitTextToSize(x.c.nombre,d.cell.height-3), lh=2.25, totalW=lines.length*lh;
          const x0=d.cell.x+(d.cell.width-totalW)/2+lh*0.78;
          lines.forEach(function(ln,j){ doc.text(ln,x0+j*lh,d.cell.y+d.cell.height-1.6,{angle:90}); });
        }
      },
      didDrawPage:encabezado
    });
  });

  const total=doc.getNumberOfPages();
  for(let i=1;i<=total;i++){
    doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(150,158,170);
    doc.text('AD = Logro destacado · A = Logro esperado · B = En proceso · C = En inicio · Nombre en rojo: estudiante con al menos una competencia en C · PROM = Promovido, REC = Recuperación, PER = Permanece',ML,206);
    doc.text('Hoja '+i+' de '+total,297-ML,206,{align:'right'});
  }
  const nombre=(typeof gsOpt==='string'&&gsOpt)?gsOpt:(_consFiltroGS||'todos');
  if(imprimir){
    const url=URL.createObjectURL(doc.output('blob'));
    const old=document.getElementById('consPrintFrame'); if(old) old.remove();
    const fr=document.createElement('iframe'); fr.id='consPrintFrame';
    fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
    fr.onload=function(){ setTimeout(function(){ try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){ window.open(url,'_blank'); } },400); };
    fr.src=url; document.body.appendChild(fr);
    return;
  }
  doc.save('Consolidado_'+nombre+(_consMinC?('_'+_consMinC+'C-a-mas'):'')+'_'+todayISO()+'.pdf');
  toast('PDF del Consolidado descargado.');
}

    ]},
    { abrev:'ED FIS', areaNombre:'Educación Física', ncols:3, competencias:[
        'Se desenvuelve de manera autónoma a través de su motricidad',
        'Asume una vida saludable',
        'Interactúa a través de sus habilidades sociomotrices'
    ]},
    { abrev:'COM', areaNombre:'Comunicación', ncols:3, competencias:[
        'Se comunica oralmente en su lengua materna',
        'Lee diversos tipos de textos escritos',
        'Escribe diversos tipos de textos'
    ]},
    { abrev:'ART', areaNombre:'Arte y Cultura', ncols:2, competencias:[
        'Aprecia de manera crítica manifestaciones artístico-culturales',
        'Crea proyectos desde los lenguajes artísticos'
    ]},
    { abrev:'ING', areaNombre:'Inglés', ncols:3, competencias:[
        'Se comunica oralmente en inglés como lengua extranjera',
        'Lee diversos tipos de textos en inglés',
        'Escribe diversos tipos de textos en inglés'
    ]},
    { abrev:'MAT', areaNombre:'Matemática', ncols:4, competencias:[
        'Resuelve problemas de cantidad',
        'Resuelve problemas de regularidad, equivalencia y cambio',
        'Resuelve problemas de forma, movimiento y localización',
        'Resuelve problemas de gestión de datos e incertidumbre'
    ]},
    { abrev:'CYT', areaNombre:'Ciencia y Tecnología', ncols:3, competencias:[
        'Indaga mediante métodos científicos',
        'Explica el mundo físico',
        'Diseña y construye soluciones tecnológicas'
    ]},
    { abrev:'REL', areaNombre:'Educación Religiosa', ncols:2, competencias:[
        'Construye su identidad como persona humana, amada por Dios',
        'Asume la experiencia del encuentro personal y comunitario con Dios'
    ]},
    { abrev:'TIC', areaNombre:'Temas Transversales TIC', ncols:1, competencias:[
        'Se desenvuelve en entornos virtuales generados por las TIC'
    ]},
    { abrev:'GEST.', areaNombre:'Temas Transversales Autonomia', ncols:1, competencias:[
        'Gestiona su aprendizaje de manera autónoma'
    ]},
  ];

  // ── Construir índice de lookup: areaNombre → { id, compNombre → compId }
  //    Búsqueda por igualdad exacta de strings (trim + lowercase) sobre DB.areas.
  //    Esto garantiza que DPCC → 'Desarrollo Personal…' encuentre sus calificaciones
  //    sin depender de comparaciones parciales que fallaban silenciosamente.
  const dbAreaIdx = {};
  DB.areas.forEach(a => {
    const key = a.nombre.trim().toLowerCase();
    const compIdx = {};
    a.competencias.forEach(c => { compIdx[c.nombre.trim().toLowerCase()] = c.id; });
    dbAreaIdx[key] = { id: a.id, compIdx };
  });

  // Construir filas de encabezado
  // Orden: N° → APELLIDOS Y NOMBRES → GYS → resto de columnas (áreas/competencias)
  const fila1 = ['N°', 'APELLIDOS Y NOMBRES', 'GYS'];
  const fila2 = ['', 'APELLIDOS Y NOMBRES', ''];
  ESTRUCTURA.forEach(a => {
    fila1.push(a.abrev);
    for(let i=1;i<a.ncols;i++) fila1.push('');
    a.competencias.forEach(c => fila2.push(c));
  });

  const filas = [fila1, fila2];
  const vigMapExp = getVigentesMap();

  // Agrupar estudiantes por grado/sección, preservando el orden ya ordenado
  const gruposGS = new Map(); // gradoSeccion -> [estudiantes...]
  [...DB.estudiantes]
    .sort((a,b)=>a.grado-b.grado||a.seccion.localeCompare(b.seccion)||a.apellidos.localeCompare(b.apellidos))
    .forEach(est=>{
      const gradoSeccion=String(est.grado)+(est.seccion||'').toUpperCase();
      if(!gruposGS.has(gradoSeccion)) gruposGS.set(gradoSeccion, []);
      gruposGS.get(gradoSeccion).push(est);
    });

  // Por cada grado/sección, generar SIEMPRE 40 filas numeradas (1..40).
  // Las filas sin estudiante quedan vacías (excepto el N°).
  gruposGS.forEach((estudiantesGrupo, gradoSeccion)=>{
    for(let n=1; n<=40; n++){
      const est = estudiantesGrupo[n-1];
      if(est){
        const nombreCompleto=(est.apellidos+', '+est.nombres).toUpperCase();
        const fila=[n, nombreCompleto, gradoSeccion];
        ESTRUCTURA.forEach(a=>{
          const aIdx = dbAreaIdx[a.areaNombre.trim().toLowerCase()];
          a.competencias.forEach(cNombre=>{
            let nota = '';
            if(aIdx){
              const compId = aIdx.compIdx[cNombre.trim().toLowerCase()];
              if(compId){
                const v = vigMapExp.get(est.id+'|'+aIdx.id+'|'+compId);
                if(v) nota = v.calificacion;
              }
            }
            fila.push(nota);
          });
        });
        filas.push(fila);
      } else {
        const fila=[n, '', ''];
        ESTRUCTURA.forEach(a=>{ a.competencias.forEach(()=> fila.push('')); });
        filas.push(fila);
      }
    }
  });

  const ws = XLSX.utils.aoa_to_sheet(filas);

  // ── Anchos de columna (plantilla oficial) ──
  const colWidths = [
    {wch:6},     // A — N°
    {wch:40.8},  // B — APELLIDOS
    {wch:4.1},   // C — GYS
    {wch:5.8},{wch:5.8},                           // D-E DPCC
    {wch:5.8},{wch:5.8},{wch:5.8},                 // F-H CCSS
    {wch:5.8},                                     // I ETRA
    {wch:5.8},{wch:5.8},{wch:5.8},                 // J-L ED FIS
    {wch:5.8},{wch:5.8},{wch:5.8},                 // M-O COM
    {wch:5.8},{wch:5.8},                           // P-Q ART
    {wch:5.8},{wch:5.8},{wch:5.8},                 // R-T ING
    {wch:5.8},{wch:5.8},{wch:5.8},{wch:5.8},       // U-X MAT
    {wch:5.8},{wch:5.8},{wch:5.8},                 // Y-AA CYT
    {wch:5.8},{wch:5.8},                           // AB-AC REL
    {wch:5.8},                                     // AD TIC
    {wch:5.8},                                     // AE GEST.
  ];
  ws['!cols'] = colWidths;

  // ── Alto de fila 2 (competencias) ──
  ws['!rows'] = [{hpt:undefined}, {hpt:77.4}];

  // ── Merges de fila 1 (áreas) ──
  const merges = [];
  let col = 3; // empieza en columna D (índice 3), tras N°, APELLIDOS y GYS
  ESTRUCTURA.forEach(a=>{
    if(a.ncols>1) merges.push({s:{r:0,c:col}, e:{r:0,c:col+a.ncols-1}});
    col+=a.ncols;
  });
  ws['!merges'] = merges;

  // ── Helper para aplicar estilos a una celda ──
  function styleCell(addr, opts){
    if(!ws[addr]) ws[addr]={t:'s',v:''};
    ws[addr].s = {
      fill: opts.bg ? {patternType:'solid', fgColor:{rgb:opts.bg}} : {patternType:'none'},
      font: {bold:!!opts.bold, color:{rgb:opts.fg||'FF000000'}, sz:opts.sz||8, name:'Calibri'},
      alignment: {horizontal:opts.ha||'center', vertical:opts.va||'center', wrapText:!!opts.wrap},
      border: opts.border ? {
        top:{style:'thin',color:{rgb:'FF000000'}},
        bottom:{style:'thin',color:{rgb:'FF000000'}},
        left:{style:'thin',color:{rgb:'FF000000'}},
        right:{style:'thin',color:{rgb:'FF000000'}}
      } : {}
    };
  }

  // Función para convertir índice de columna a letra(s)
  function colLetter(idx){
    let s=''; idx++;
    while(idx>0){ let r=(idx-1)%26; s=String.fromCharCode(65+r)+s; idx=Math.floor((idx-1)/26); }
    return s;
  }

  // ── Estilo de celda A1 (N°) ──
  styleCell('A1',{bold:true, fg:'FF000000', sz:12, ha:'center', va:'center', wrap:false});
  // ── Estilo de celda B1 (APELLIDOS Y NOMBRES) ──
  styleCell('B1',{bold:true, fg:'FF000000', sz:12, ha:'center', va:'center', wrap:false});
  // ── Estilo de celda C1 (GYS) ──
  styleCell('C1',{bold:true, bg:AREA_STYLES['GYS'].bg, fg:AREA_STYLES['GYS'].fg, sz:7, ha:'center', va:'center', wrap:true});

  // ── Estilos fila 1 — áreas ──
  let colIdx=3;
  ESTRUCTURA.forEach(a=>{
    const s=AREA_STYLES[a.abrev]||{bg:'FF4472C4',fg:'FFFFFFFF'};
    styleCell(colLetter(colIdx)+'1',{bold:true, bg:s.bg, fg:s.fg, sz:7, ha:'center', va:'center', wrap:true});
    // celdas vacías del merge — mismo estilo
    for(let i=1;i<a.ncols;i++){
      styleCell(colLetter(colIdx+i)+'1',{bold:true, bg:s.bg, fg:s.fg, sz:7, ha:'center', va:'center', wrap:true});
    }
    colIdx+=a.ncols;
  });

  // ── Estilo A2, B2 y C2 ──
  styleCell('A2',{bold:true, fg:'FF000000', sz:12, ha:'center', va:'center', wrap:false});
  styleCell('B2',{bold:true, fg:'FF000000', sz:12, ha:'center', va:'center', wrap:false});
  styleCell('C2',{bold:true, fg:'FF000000', sz:12, ha:'center', va:'center', wrap:false});

  // ── Estilos fila 2 — competencias ──
  colIdx=3;
  ESTRUCTURA.forEach(a=>{
    a.competencias.forEach(()=>{
      styleCell(colLetter(colIdx)+'2',{bold:false, fg:'FF000000', sz:8, ha:'center', va:'center', wrap:true});
      colIdx++;
    });
  });

  // ── Estilos filas de datos (centrado) ──
  const totalCols=3+ESTRUCTURA.reduce((s,a)=>s+a.ncols,0);
  for(let r=2;r<filas.length;r++){
    for(let c=0;c<totalCols;c++){
      const addr=colLetter(c)+(r+1);
      if(!ws[addr]) ws[addr]={t:'s',v:''};
      if(!ws[addr].s) ws[addr].s={};
      ws[addr].s.alignment={horizontal: c===1?'left':'center', vertical:'center'};
      ws[addr].s.font={sz:8, name:'Calibri'};
    }
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Consolidado');
  XLSX.writeFile(wb, _prefijoCons()+'Consolidado_'+todayISO()+'.xlsx');
  toast('Plantilla descargada.');
}

/* --- Importar consolidado desde Excel --- */
function importarConsolidado(event){
  const file=event.target.files[0]; event.target.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      if(json.length<3){ toast('El archivo debe tener al menos 2 filas de cabecera y datos.','err'); return; }

      const filArea=json[0]; const filComp=json[1];
      const hdrBase=filArea.map(function(h){return String(h).trim().toLowerCase();});
      const iNomComp=hdrBase.findIndex(function(h){return h.includes('apellido')||h.includes('nombre');});
      const iGradoSec=hdrBase.findIndex(function(h){return h.includes('grado')&&h.includes('secci');});

      if(iNomComp<0){ toast('Estructura invalida. La fila 1 debe tener APELLIDOS Y NOMBRES. Usa la plantilla oficial.','err'); return; }

      // Normalizar texto: sin tildes, minusculas
      function norm(s){
        var r=String(s||'').trim().toLowerCase().normalize('NFD');
        var o='';
        for(var i=0;i<r.length;i++){
          var code=r.charCodeAt(i);
          if(code<0x0300||code>0x036f) o+=r[i];
        }
        return o;
      }

      // Alias de compatibilidad para nombres de área renombrados
      // (claves en formato normalizado igual que produce norm())
      var AREA_ALIAS={
        'TEMAS TRANSVERSALES (TIC)': 'TEMAS TRANSVERSALES TIC',
        'QUECHUA':                   'TEMAS TRANSVERSALES AUTONOMIA',
        'TIC':                       'TEMAS TRANSVERSALES TIC',
        'GEST.':                     'TEMAS TRANSVERSALES AUTONOMIA',
      };
      function resolverAreaNorm(raw){
        var n=norm(raw);
        return AREA_ALIAS[n]||n;
      }

      // Mapear columnas a areaId+competenciaId — matching exacto normalizado
      var BASE=2;
      var colMap=[];
      for(var c=BASE;c<filComp.length;c++){
        var areaNom=String(filArea[c]||'').trim();
        var compNom=String(filComp[c]||'').trim();
        if(!compNom) continue;
        var areaNomNorm=resolverAreaNorm(areaNom);
        var area=DB.areas.find(function(a){return norm(a.nombre)===areaNomNorm;});
        if(!area) continue;
        var comp=area.competencias.find(function(cc){return norm(cc.nombre)===norm(compNom);});
        if(!comp) continue;
        colMap.push({col:c,areaId:area.id,competenciaId:comp.id});
      }

      if(!colMap.length){ toast('No se detectaron columnas de competencias. Usa la plantilla oficial.','err'); return; }

      var NOTAS_V=new Set(['AD','A','B','C']);
      var hoy=todayISO();
      var procesados=0, errores=0, sinEncontrar=0, nuevosCreados=0;
      var conCNuevos=new Set();

      for(var r=2;r<json.length;r++){
        var row=json[r];
        var nombreRaw=String(row[iNomComp]||'').trim();
        if(!nombreRaw) continue;
        var partes=nombreRaw.split(',');
        var ap=(partes[0]||'').trim();
        var nm=(partes[1]||'').trim().replace(/^\s+/,'');
        if(!ap){ errores++; continue; }

        var grado=1, sec='A';
        if(iGradoSec>=0){
          var gs=String(row[iGradoSec]||'').trim().toUpperCase();
          var m=gs.match(/^(\d+)([A-Z]?)$/);
          if(m){ grado=parseInt(m[1])||1; sec=m[2]||'A'; }
        }

        // Buscar estudiante existente (3 niveles de coincidencia)
        var est=null;
        if(grado&&sec) est=DB.estudiantes.find(function(x){return x.apellidos.toLowerCase()===ap.toLowerCase()&&(nm?x.nombres.toLowerCase()===nm.toLowerCase():true)&&x.grado===grado&&x.seccion===sec;});
        if(!est&&ap&&nm) est=DB.estudiantes.find(function(x){return x.apellidos.toLowerCase()===ap.toLowerCase()&&x.nombres.toLowerCase()===nm.toLowerCase();});
        if(!est) est=DB.estudiantes.find(function(x){return x.apellidos.toLowerCase().startsWith(ap.split(' ')[0].toLowerCase())&&(nm?x.nombres.toLowerCase().startsWith(nm.split(' ')[0].toLowerCase()):true);});

        // Si no existe, crear el estudiante automáticamente a partir del Excel
        if(!est){
          if(!ap){ sinEncontrar++; continue; }
          var gradoValido=GRADOS.includes(grado)?grado:1;
          var secValida=SECCION_LETRAS.includes(sec)?sec:'A';
          est={
            id:uid('est'),
            apellidos:ap,
            nombres:nm||'',
            dni:'',
            sexo:'M',
            fechaNacimiento:'',
            grado:gradoValido,
            seccion:secValida,
            institucionId:''
          };
          DB.estudiantes.push(est);
          nuevosCreados++;
        }

        var alguna=false;
        var estRef=est;
        colMap.forEach(function(entry){
          var nota=String(row[entry.col]||'').trim().toUpperCase();
          if(!NOTAS_V.has(nota)) return;
          var idx=DB.calificaciones.findIndex(function(c){return c.estudianteId===estRef.id&&c.areaId===entry.areaId&&c.competenciaId===entry.competenciaId&&(c.periodo||'')===periodoDestino('Consolidado');});
          if(idx>=0) DB.calificaciones.splice(idx,1);
          DB.calificaciones.push({id:uid('cal'),estudianteId:estRef.id,areaId:entry.areaId,competenciaId:entry.competenciaId,calificacion:nota,periodo:periodoDestino('Consolidado'),fecha:hoy,docenteId:''});
          if(nota==='C') conCNuevos.add(estRef.id);
          alguna=true;
        });
        if(alguna) procesados++; else errores++;
      }

      saveDB();
      renderSidebarBadge();
      // Actualizar la vista activa Y pre-renderizar el consolidado para sincronización inmediata
      if(currentView==='dashboard') renderDashboard();
      else if(currentView==='riesgo') renderRiesgo();
      else if(currentView==='sitfinal') renderSituacionFinal();
      else if(currentView==='seguimiento') renderSeguimiento();
      else if(currentView==='calificaciones') renderCalificaciones();
      // Siempre preparar el consolidado para que al navegar a él esté listo
      // (el DOM de #viewConsolidado se actualiza aunque no sea la vista activa)
      var prevView = currentView;
      currentView = 'consolidado';
      renderConsolidado();
      currentView = prevView;

      // Modal de resumen — sin template literals anidados
      var alertaC = conCNuevos.size
        ? '<div class="help-note" style="background:var(--red-bg);border-color:#f3cfd1;color:var(--red-strong);"><strong>\u26a0 '+conCNuevos.size+' estudiante(s) con nivel C.</strong> Riesgo academico y fichas actualizados automaticamente.</div>'
        : '<div class="help-note">Sin nuevos niveles C detectados.</div>';
      var alertaNuevos = nuevosCreados
        ? '<div class="help-note" style="background:var(--blue-bg);border-color:#cfe0ff;color:#264a8c;margin-top:8px;"><strong>'+nuevosCreados+' estudiante(s) nuevos</strong> registrados automaticamente desde el archivo.</div>'
        : '';
      var alertaSin = sinEncontrar
        ? '<div class="small-muted" style="margin-top:8px;">\u26a0 '+sinEncontrar+' fila(s) no pudieron importarse (sin nombre valido).</div>'
        : '';
      var bgC   = conCNuevos.size ? 'var(--red-bg)'   : 'var(--teal-bg)';
      var bdC   = conCNuevos.size ? '#f3cfd1'          : '#b2dfd7';
      var colC  = conCNuevos.size ? 'var(--red-strong)': '#1c6f61';
      var bgErr = (sinEncontrar||errores) ? 'var(--amber-bg)' : 'var(--bg)';
      var bdErr = (sinEncontrar||errores) ? '#f5d9a0'         : 'var(--border)';
      var colErr= (sinEncontrar||errores) ? 'var(--gold-ink)' : 'var(--muted)';

      var bodyHtml=
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">'+
          '<div style="background:var(--teal-bg);border:1px solid #b2dfd7;border-radius:10px;padding:14px;text-align:center;">'+
            '<div style="font-size:30px;font-weight:800;color:#1c6f61;font-family:var(--font-display);">'+procesados+'</div>'+
            '<div style="font-size:12px;font-weight:600;color:#1c6f61;">Estudiantes procesados</div>'+
          '</div>'+
          '<div style="background:'+bgC+';border:1px solid '+bdC+';border-radius:10px;padding:14px;text-align:center;">'+
            '<div style="font-size:30px;font-weight:800;color:'+colC+';font-family:var(--font-display);">'+conCNuevos.size+'</div>'+
            '<div style="font-size:12px;font-weight:600;color:'+colC+';">Con nivel C detectados</div>'+
          '</div>'+
          '<div style="background:var(--blue-bg);border:1px solid #cfe0ff;border-radius:10px;padding:14px;text-align:center;">'+
            '<div style="font-size:30px;font-weight:800;color:#2452a8;font-family:var(--font-display);">'+colMap.length+'</div>'+
            '<div style="font-size:12px;font-weight:600;color:#2452a8;">Competencias mapeadas</div>'+
          '</div>'+
          '<div style="background:'+bgErr+';border:1px solid '+bdErr+';border-radius:10px;padding:14px;text-align:center;">'+
            '<div style="font-size:30px;font-weight:800;color:'+colErr+';font-family:var(--font-display);">'+(sinEncontrar+errores)+'</div>'+
            '<div style="font-size:12px;font-weight:600;color:'+colErr+';">Filas no importadas</div>'+
          '</div>'+
        '</div>'+
        alertaC+alertaNuevos+alertaSin;

      openModal('Importacion completada', bodyHtml, '<button class="btn" onclick="closeModal();currentView=\'consolidado\';renderConsolidado();">Ver Consolidado</button>');

    }catch(ex){ console.error('importarConsolidado error:',ex); toast('Error al procesar el archivo: '+ex.message,'err'); }
  };
  reader.readAsArrayBuffer(file);
}


/* --- Prefijo grado-sección para nombres de archivo --- */
function _prefijoCons(){
  // Usar variable de importación si existe; si no, inferir de estudiantes
  var g = _consolidadoGrado, s = _consolidadoSeccion;
  if(!g || !s){
    var est = DB.estudiantes[0];
    if(est){ g = est.grado; s = est.seccion; }
  }
  return (g && s) ? (String(g) + s.toUpperCase() + '-') : '';
}

/* --- Eliminar todas las notas del Consolidado --- */
function eliminarNotasConsolidado(){
  const total=DB.calificaciones.length;
  if(!total){ toast('No hay notas registradas en el Consolidado.','err'); return; }
  openModal('Eliminar notas del Consolidado',
    `<div class="help-note" style="background:var(--red-bg);border-color:#f3cfd1;color:var(--red-strong);margin-bottom:12px;">
      <strong>Esta acción eliminará todas las notas registradas (${total} registros).</strong><br>
      No se eliminarán estudiantes, áreas, competencias ni ninguna otra configuración del sistema.
    </div>
    <p style="margin:0 0 4px;">¿Confirmas que deseas borrar todas las notas del Consolidado?</p>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn danger" onclick="confirmarEliminarNotas()">Sí, eliminar notas</button>`
  );
}
function confirmarEliminarNotas(){
  const eliminadas=DB.calificaciones.length;
  DB.calificaciones=[];
  saveDB();
  closeModal();
  renderSidebarBadge();
  if(currentView==='dashboard') renderDashboard();
  else if(currentView==='riesgo') renderRiesgo();
      else if(currentView==='sitfinal') renderSituacionFinal();
  else if(currentView==='seguimiento') renderSeguimiento();
  else if(currentView==='calificaciones') renderCalificaciones();
  else if(currentView==='consolidado') renderConsolidado();
  toast(`${eliminadas} notas eliminadas. Puedes importar un nuevo Consolidado.`);
}

/* --- Eliminar estudiantes y todas las notas del Consolidado --- */
function eliminarEstudiantesYNotas(){
  const totalEst = DB.estudiantes.length;
  const totalCal = DB.calificaciones.length;
  if(!totalEst && !totalCal){ toast('No hay estudiantes ni notas que eliminar.','err'); return; }
  openModal('Eliminar estudiantes y notas',
    `<div class="help-note" style="background:var(--red-bg);border-color:#f3cfd1;color:var(--red-strong);margin-bottom:12px;">
      <strong>Esta acción eliminará ${totalEst} estudiante(s) y ${totalCal} nota(s).</strong><br>

/* --- Exportar calificaciones actuales --- */
function exportarConsolidadoActual(){
  if(!DB.estudiantes.length){ toast('No hay estudiantes registrados.','err'); return; }
  const _areas=areasOrdenadas(); // orden oficial fijo
  const hdrArea=['N°','APELLIDOS Y NOMBRES','GRADO Y SECCIÓN',..._areas.flatMap(a=>a.competencias.map(()=>a.nombre))];
  const hdrComp=['','','',..._areas.flatMap(a=>a.competencias.map(c=>c.nombre))];
  const filas=[[...hdrArea],[...hdrComp]];
  // Merge de áreas en fila 0
  const mergesExp=[];
  let colExp=3;
  _areas.forEach(a=>{
    if(a.competencias.length>1) mergesExp.push({s:{r:0,c:colExp},e:{r:0,c:colExp+a.competencias.length-1}});
    colExp+=a.competencias.length;
  });
  const vigMapExp2 = getVigentesMap();

  // Agrupar estudiantes por grado/sección
  const gruposExp = new Map(); // gradoSeccion -> [estudiantes...]
  [...DB.estudiantes]
    .sort((a,b)=>a.grado-b.grado||a.seccion.localeCompare(b.seccion)||a.apellidos.localeCompare(b.apellidos))
    .forEach(est=>{
      const gs=String(est.grado)+(est.seccion||'').toUpperCase();
      if(!gruposExp.has(gs)) gruposExp.set(gs, []);
      gruposExp.get(gs).push(est);
    });

  // Por cada grado/sección, generar SIEMPRE 40 filas numeradas (1..40).
  // Las filas sin estudiante quedan vacías (excepto el N°).
  gruposExp.forEach((estudiantesGrupo, gradoSeccion)=>{
    for(let n=1; n<=40; n++){
      const est = estudiantesGrupo[n-1];
      if(est){
        const nombreCompleto=(est.apellidos+', '+est.nombres).toUpperCase();
        const fila=[n, nombreCompleto, gradoSeccion];
        _areas.forEach(a=>a.competencias.forEach(c=>{
          const v=vigMapExp2.get(est.id+'|'+a.id+'|'+c.id);
          fila.push(v?v.calificacion:'');
        }));
        filas.push(fila);
      } else {
        const fila=[n, '', gradoSeccion];
        _areas.forEach(a=>a.competencias.forEach(()=> fila.push('')));
        filas.push(fila);
      }
    }
  });
  const ws=XLSX.utils.aoa_to_sheet(filas);
  if(mergesExp.length) ws['!merges']=mergesExp;
  ws['!cols']=[{wch:6},{wch:40},{wch:12},..._areas.flatMap(a=>a.competencias.map(()=>({wch:5})))];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Consolidado');
  XLSX.writeFile(wb, _prefijoCons()+'Consolidado_'+todayISO()+'.xlsx');
  toast('Consolidado exportado.');
}

function cfgSubirLogo(ev){
  const f=ev.target.files[0]; ev.target.value='';
  if(!f) return;
  if(!/^image\//.test(f.type)){ toast('Selecciona un archivo de imagen.','err'); return; }
  const r=new FileReader();
  r.onload=function(){
    const img=new Image();
    img.onload=function(){
      const k=Math.min(1,400/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      DB.config.logo=c.toDataURL('image/png'); saveDB(); cfgPaintLogo(); toast('Logo cargado.');
    };
    img.onerror=function(){ toast('No se pudo leer la imagen.','err'); };
    img.src=r.result;
  };
  r.onerror=function(){ toast('No se pudo leer el archivo.','err'); };
  r.readAsDataURL(f);
}

function cfgParseNombre(raw){
  raw=String(raw||'').trim();
  if(raw.indexOf(',')>=0){ const p=raw.split(','); return {ap:p[0].trim(), nm:p.slice(1).join(',').trim()}; }
  const w=raw.split(/\s+/); return {ap:w.slice(0,2).join(' '), nm:w.slice(2).join(' ')};
}
/* Devuelve 'nuevo' | 'dup' | 'error' */
function cfgAgregarEstudiante(ap,nm,grado,sec,traslado){
  if(!ap || !GRADOS.includes(grado) || !SECCION_LETRAS.includes(sec)) return 'error';
  const ya=DB.estudiantes.find(function(e){
    return normStr(e.apellidos)===normStr(ap) && normStr(e.nombres)===normStr(nm) && e.grado===grado && String(e.seccion||'').toUpperCase()===sec;
  });
  if(ya){ if(traslado!==undefined) ya.traslado=traslado; return 'dup'; }
  DB.estudiantes.push({id:uid('est'),apellidos:ap,nombres:nm,dni:'',sexo:'M',fechaNacimiento:'',grado:grado,seccion:sec,institucionId:cfgIEId(),traslado:traslado||''});
  return 'nuevo';
}

      .forEach(function(e){ const g=cfgGYS(e); c[g]=(c[g]||0)+1; filas.push([g,c[g],(e.apellidos+', '+e.nombres).toUpperCase(),e.traslado==='SI'?'T':'M']); });
  } else {

/* ---------- Carga por JSON (Consolidado Notas) ---------- */
let cfgJson=null;
const CFG_AREA_ALIAS={
  'MATEMATICA':'Matemática','COMUNICACION':'Comunicación','CIENCIA Y TECNOLOGIA':'Ciencia y Tecnología','INGLES':'Inglés',
  'EDUCACION FISICA':'Educación Física','DPCC':'Desarrollo Personal, Ciudadanía y Cívica','CIENCIAS SOCIALES':'Ciencias Sociales',
  'RELIGION':'Educación Religiosa','ARTE':'Arte y Cultura','EPT':'Educación para el Trabajo'
};
function cfgTokens(s){ return normStr(s).replace(/[^A-Z0-9 ]/g,' ').split(' ').filter(function(w){return w.length>2;}); }
function cfgSim(a,b){ const A=cfgTokens(a),B=cfgTokens(b); if(!A.length||!B.length) return 0; const sb=new Set(B); const i=A.filter(function(w){return sb.has(w);}).length; return i/(new Set(A.concat(B)).size); }
/* Devuelve {compId: {areaId, competenciaId}} para las competencias del JSON */
function cfgMapearCompetencias(comps){
  const ord=areasOrdenadas(), res={}, porNombre={};
  ord.forEach(function(a){ porNombre[normStr(a.nombre)]=a; });
  const grupos={};
  comps.forEach(function(c){ (grupos[c.area]=grupos[c.area]||[]).push(c); });
  Object.keys(grupos).forEach(function(an){
    const lista=grupos[an], k=normStr(an);
    if(k.indexOf('TRANSV')>=0){
      lista.forEach(function(c){
        const a=porNombre[normStr(/TIC/i.test(c.name)?'Temas Transversales TIC':'Temas Transversales Autonomia')];
        if(a&&a.competencias[0]) res[c.id]={areaId:a.id,competenciaId:a.competencias[0].id};
      });
      return;
    }
    const alias=CFG_AREA_ALIAS[k], a=porNombre[normStr(alias||an)]
      || ord.find(function(x){return cfgSim(x.nombre,an)>=0.5;});
    if(!a) return;
    const usados=new Set();
    lista.forEach(function(c,i){
      let best=null,bs=0;
      a.competencias.forEach(function(sc){
        if(usados.has(sc.id)) return;
        const s=normStr(sc.nombre)===normStr(c.name)?2:cfgSim(sc.nombre,c.name);
        if(s>bs){bs=s;best=sc;}
      });
      if(!best||bs<0.4){ const sc=a.competencias[i]; if(sc&&!usados.has(sc.id)) best=sc; }
      if(best){ usados.add(best.id); res[c.id]={areaId:a.id,competenciaId:best.id}; }
    });
  });
  return res;
}
function cfgLeerJson(ev){
  const file=ev.target.files[0]; ev.target.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){

      const d=JSON.parse(e.target.result);
      if(!d||!Array.isArray(d.students)||!Array.isArray(d.competencies)||!d.metadata) throw new Error('formato');
      const per=(d.metadata.periods&&d.metadata.periods.length)?d.metadata.periods:[];
      const conteo=per.map(function(_,i){
        let n=0; d.students.forEach(function(s){ const p=s.periods&&s.periods[i]; if(p) n+=Object.keys(p).length; }); return n;
      });
      let ult=-1; conteo.forEach(function(n,i){ if(n>0) ult=i; });

      cfgModalJson();
    }catch(ex){ console.error(ex); toast('JSON no reconocido. Debe ser el archivo del Consolidado de Notas (metadata, competencies, students).','err'); }
  };
  reader.readAsText(file,'utf-8');
}

function vigentesDePeriodo(per){

    if(c.periodo!==per) return;
    const k=c.estudianteId+'|'+c.areaId+'|'+c.competenciaId, p=m.get(k);

function cmpCalcular(){
  const pers=cfgPeriodosVisibles(), maps=pers.map(vigentesDePeriodo);
  const filas=DB.estudiantes.map(function(e){
    const pts=pers.map(function(p,i){
      const s=calcularSituacionEstudiante(e,maps[i]);
      const ev=s.evaluadas>0 && s.codigo!=='TRASLADADO';
      return {per:p,ev:ev,des:s.areasDesaprobadas,nDes:s.areasDesaprobadas.length,areasEval:s.areasEvaluadas||0,
        aprob:(s.areasEvaluadas||0)-s.areasDesaprobadas.length,nC:s.nC,cod:s.codigo};
    });
    const evs=pts.filter(function(x){return x.ev;});
    let tend='NA', delta=0;
    if(evs.length>=2){
      const sc=function(x){return x.aprob*1000-x.nC;};
      delta=sc(evs[evs.length-1])-sc(evs[0]);
      tend=delta>0?'MEJORA':(delta<0?'EMPEORA':'ESTABLE');
    }
    const completo=pers.length>0 && pts.every(function(x){return x.ev;});
    const total=pts.reduce(function(a,x){return a+(x.ev?x.nDes:0);},0);
    return {e:e,pts:pts,evs:evs,total:total,tend:tend,completo:completo,trasl:e.traslado==='SI',mensaje:cmpMensaje(e,pers,pts,evs,tend,completo)};
  }).sort(function(a,b){
    return a.e.grado-b.e.grado||String(a.e.seccion||'').localeCompare(String(b.e.seccion||''))||String(a.e.apellidos||'').localeCompare(String(b.e.apellidos||''));
  });
  return {pers:pers,filas:filas};
}
function cmpMensaje(e,pers,pts,evs,tend,completo){
  if(e.traslado==='SI') return 'Estudiante trasladado.';
  if(!evs.length) return 'Sin calificaciones registradas.';
  const ult=evs[evs.length-1], prim=evs[0];
  const lista=function(x){ return x.nDes? x.nDes+' área(s) desaprobada(s) ('+x.des.map(sitAbrev).join(', ')+')' : 'ninguna área desaprobada'; };
  if(!completo){
    const faltan=pers.length-evs.length;
    return 'En curso: '+lista(ult)+' en '+ult.per+'. '+(tend==='MEJORA'?'Viene mejorando.':tend==='EMPEORA'?'Viene bajando su rendimiento.':tend==='ESTABLE'?'Se mantiene estable.':'')+' Faltan '+faltan+' período(s) por registrar.';
  }
  let t='Cierra el año con '+lista(ult)+'. ';
  const cambio=(prim.nDes!==ult.nDes)?('de '+prim.nDes+' a '+ult.nDes+' áreas desaprobadas'):('áreas desaprobadas sin cambio, competencias en C de '+prim.nC+' a '+ult.nC);
  if(tend==='MEJORA') t+='Mejoró durante el año ('+cambio+'). ';

}
function cmpSparkline(f,n){
  const W=Math.max(70,n*34), H=40, pad=8;
  const maxA=Math.max(1,Math.max.apply(null,f.pts.map(function(x){return x.areasEval;})));
  const col=f.tend==='MEJORA'?'#16875a':(f.tend==='EMPEORA'?'#c4302b':'#7a869a');
  const xs=function(i){ return n>1? pad+i*((W-2*pad)/(n-1)) : W/2; };
  const ys=function(a){ return H-pad-(a/maxA)*(H-2*pad); };
  let path='', dots='', started=false;
  f.pts.forEach(function(p,i){
    if(!p.ev) return;
    const x=xs(i).toFixed(1), y=ys(p.aprob).toFixed(1);
    path+=(started?'L':'M')+x+' '+y+' '; started=true;
    dots+='<circle cx="'+x+'" cy="'+y+'" r="3.4" fill="'+(p.nDes?'#c4302b':'#16875a')+'" stroke="#fff" stroke-width="1"><title>'+esc(p.per)+': '+p.aprob+' área(s) aprobada(s), '+p.nDes+' desaprobada(s)</title></circle>';
  });
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución">'+
    '<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#e3e8ef"/>'+
    (path?'<path d="'+path+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round"/>':'')+dots+'</svg>';
}
