/* ---------- Calificaciones: filtros, contadores y reportes ---------- */
let califFiltros={gs:'',estId:'',areaId:'',nota:'',q:''};
const CAL_COL={AD:{bg:'#e6f6f2',fg:'#1c6f61',bd:'#b2dfd7',rgbF:[230,246,242],rgbT:[28,111,97],txt:'Logro destacado'},
               A:{bg:'#eaf1ff',fg:'#2452a8',bd:'#cfe0ff',rgbF:[234,241,255],rgbT:[36,82,168],txt:'Logro esperado'},
               B:{bg:'#fdf3e2',fg:'#7a4f0f',bd:'#f5d9a0',rgbF:[253,243,226],rgbT:[122,79,15],txt:'En proceso'},
               C:{bg:'#fdeceb',fg:'#a4222c',bd:'#f3cfd1',rgbF:[253,236,235],rgbT:[164,34,44],txt:'En inicio'}};
function califNorm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function califGS(e){ return e.grado+(e.seccion||'').toUpperCase(); }

/* Filas filtradas. ignorarNota=true sirve para calcular la distribución completa */
function califFiltrar(ignorarNota){
  const f=califFiltros, estMap=getEstMap(), q=califNorm(f.q);
  return DB.calificaciones.filter(function(r){
    const e=estMap.get(r.estudianteId); if(!e) return false;
    if(periodoVista() && r.periodo!==periodoVista()) return false;
    if(f.gs && califGS(e)!==f.gs) return false;
    if(f.estId && r.estudianteId!==f.estId) return false;
    if(f.areaId && r.areaId!==f.areaId) return false;
    if(!ignorarNota && f.nota && r.calificacion!==f.nota) return false;
    if(q && califNorm(e.nombres+' '+e.apellidos).indexOf(q)<0) return false;
    return true;
  });
}
function califConteos(){
  const base=califFiltrar(true), c={AD:0,A:0,B:0,C:0};
  base.forEach(function(r){ if(c[r.calificacion]!==undefined) c[r.calificacion]++; });
  return {total:base.length,c:c};
}
function califPct(n,t){ return t? (n*100/t).toFixed(1).replace('.0','')+' %' : '0 %'; }
function califOrdenar(rows){
  const estMap=getEstMap(), areas=areasOrdenadas();
  const aIdx={}, cIdx={};
  areas.forEach(function(a,i){ aIdx[a.id]=i; a.competencias.forEach(function(c,j){ cIdx[a.id+'|'+c.id]=j; }); });
  return rows.slice().sort(function(x,y){
    const ex=estMap.get(x.estudianteId), ey=estMap.get(y.estudianteId);
    return ex.grado-ey.grado || (ex.seccion||'').localeCompare(ey.seccion||'') ||
      (ex.apellidos+ex.nombres).localeCompare(ey.apellidos+ey.nombres) ||
      (aIdx[x.areaId]||0)-(aIdx[y.areaId]||0) || (cIdx[x.areaId+'|'+x.competenciaId]||0)-(cIdx[y.areaId+'|'+y.competenciaId]||0);
  });
}
function califEstudiantesOpts(){
  const list=DB.estudiantes.filter(function(e){ return !califFiltros.gs || califGS(e)===califFiltros.gs; })
    .sort(function(a,b){ return (a.apellidos+a.nombres).localeCompare(b.apellidos+b.nombres); });
  if(califFiltros.estId && !list.some(function(e){return e.id===califFiltros.estId;})) califFiltros.estId='';
  return '<option value="">Todos los estudiantes ('+list.length+')</option>'+list.map(function(e){
    return '<option value="'+e.id+'"'+(e.id===califFiltros.estId?' selected':'')+'>'+esc((e.apellidos+', '+e.nombres).toUpperCase())+' — '+califGS(e)+'</option>';
  }).join('');
}
function califDescFiltros(){
  const f=califFiltros, out=[];
  if(f.gs) out.push('Grado y sección: '+f.gs);
  if(f.estId){ const e=getEstMap().get(f.estId); if(e) out.push('Estudiante: '+(e.apellidos+', '+e.nombres).toUpperCase()); }
  if(f.areaId) out.push('Área: '+areaNombre(f.areaId));
  if(f.nota) out.push('Nivel: '+f.nota);
  if(f.q) out.push('Búsqueda: "'+f.q+'"');
  return out.length? out.join(' · ') : 'Sin filtros (todos los registros)';
}

  paintCalifTable();

function califSetNota(n){ califFiltros.nota=(califFiltros.nota===n)?'':n; paintCalifTable(); }

function paintCalifStats(){
  const box=$('#califStats'); if(!box) return;
  const k=califConteos();
  let html='<button type="button" class="cal-stat cal-total'+(!califFiltros.nota?' on':'')+'" onclick="califSetNota(\'\')">'+
    '<span class="cs-k">Total</span><span class="cs-n">'+k.total+'</span><span class="cs-p">100 %</span><span class="cs-d">registros</span></button>';
  ['AD','A','B','C'].forEach(function(n){
    const col=CAL_COL[n];
    html+='<button type="button" class="cal-stat'+(califFiltros.nota===n?' on':'')+'" style="--cbg:'+col.bg+';--cfg:'+col.fg+';--cbd:'+col.bd+';" onclick="califSetNota(\''+n+'\')" title="Filtrar por '+n+'">'+
      '<span class="cs-k">'+n+'</span><span class="cs-n">'+k.c[n]+'</span><span class="cs-p">'+califPct(k.c[n],k.total)+'</span><span class="cs-d">'+col.txt+'</span></button>';

let _califModoPrev='';
function califPorEstudiante(rows){
  const estMap=getEstMap(), m=new Map();
  rows.forEach(function(r){ m.set(r.estudianteId,(m.get(r.estudianteId)||0)+1); });
  return Array.from(m.entries()).map(function(kv){ return {id:kv[0], e:estMap.get(kv[0]), n:kv[1]}; })
    .sort(function(a,b){ return b.n-a.n || (a.e.apellidos+a.e.nombres).localeCompare(b.e.apellidos+b.e.nombres); });
}
function paintCalifTable(){
  paintCalifStats();

      est,

        rowRenderer:function(r){
          const s=situacionPorC(r.n);
          return '<tr><td style="color:var(--muted);font-family:var(--font-mono);">•</td>'+
            '<td><div class="person-cell"><div class="avatar">'+initials(r.e.nombres,r.e.apellidos)+'</div><div><div class="nm">'+esc(r.e.apellidos)+', '+esc(r.e.nombres)+'</div><div class="sb">DNI '+esc(r.e.dni||'—')+'</div></div></div></td>'+
            '<td>'+r.e.grado+'.º "'+esc(r.e.seccion)+'"</td>'+
            '<td><span class="rc-num" style="background:'+col.bg+';color:'+col.fg+';">'+r.n+'</span></td>'+
            (nota==='C'?'<td><span class="rc-sit" style="background:'+s.bg+';color:'+s.fg+';">'+s.label+'</span><div class="rc-msg">'+esc(s.msg)+'</div></td><td><div class="btn-row"><button class="btn gold sm" onclick="openFicha(\''+r.id+'\')">Ver ficha</button></div></td>':'')+
          '</tr>'; }});
    const host=$('#tblCalificaciones');

  }

  rows.sort(function(a,b){ return b.fecha.localeCompare(a.fecha); });
  sortableTable('tblCalificaciones',
    [{key:'fecha',label:'Fecha'},{key:'estudianteId',label:'Estudiante',sortVal:function(r){var e=estMapC.get(r.estudianteId);return e?e.apellidos:'';}},{key:'areaId',label:'Área',sortVal:function(r){return areaNombre(r.areaId);}},{key:'competenciaId',label:'Competencia',sortVal:function(r){return compNombre(r.areaId,r.competenciaId);}},{key:'periodo',label:'Periodo'},{key:'calificacion',label:'Nota'},{key:'acciones',label:''}],
    rows,
    { defaultSort:'fecha', emptyText:'No hay calificaciones con los filtros actuales.',
      rowRenderer:function(r){ const e=estMapC.get(r.estudianteId); return '<tr>'+
        '<td>'+fmtDate(r.fecha)+'</td><td>'+(e?esc(e.apellidos+', '+e.nombres):'—')+'</td><td>'+esc(areaNombre(r.areaId))+'</td>'+
        '<td style="max-width:260px;">'+esc(compNombre(r.areaId,r.competenciaId))+'</td><td>'+esc(r.periodo||'—')+'</td>'+
        '<td><span class="pill '+r.calificacion+'">'+r.calificacion+'</span></td>'+
        '<td><div class="btn-row"><button class="btn danger sm" onclick="deleteEntity(\'calificaciones\',\''+r.id+'\',\'calificación\')">Eliminar</button></div></td></tr>'; }});
}

/* ---------- Calificaciones: PDF (A4 vertical, márgenes 2 cm) ---------- */
function descargarCalificacionesPDF(){
  const rows=califOrdenar(califFiltrar(false));
  if(!rows.length){ toast('No hay calificaciones para exportar con estos filtros.','err'); return; }
  if(!window.jspdf||!window.jspdf.jsPDF){ toast('No se cargó la librería PDF. Verifica tu conexión a internet.','err'); return; }
  const doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  if(typeof doc.autoTable!=='function'){ toast('No se cargó el complemento de tablas PDF. Verifica tu conexión a internet.','err'); return; }
  const M=20, W=210-2*M;               // 170 mm útiles
  const k=califConteos(), estMap=getEstMap();
  const inst=DB.instituciones.length?DB.instituciones[0].nombre:'';
  const fecha=new Date().toLocaleDateString('es-PE',{year:'numeric',month:'long',day:'numeric'});

  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(19,38,65);

  doc.setFontSize(8); doc.setTextColor(43,56,82);
  const filtTxt=doc.splitTextToSize('Filtros: '+califDescFiltros(),W-6);
  const fh=filtTxt.length*3.6+3.5;
  doc.setFillColor(243,245,249); doc.setDrawColor(221,227,235); doc.setLineWidth(0.2);
  doc.roundedRect(M,M+15,W,fh,1.2,1.2,'FD');
  doc.text(filtTxt,M+3,M+15+4.2);

  // Tarjetas de resumen AD / A / B / C
  const cy=M+15+fh+4, cw=(W-3*3)/4, ch=19;
  ['AD','A','B','C'].forEach(function(n,i){
    const c=CAL_COL[n], x=M+i*(cw+3);
    doc.setFillColor(c.rgbF[0],c.rgbF[1],c.rgbF[2]); doc.roundedRect(x,cy,cw,ch,1.5,1.5,'F');
    doc.setTextColor(c.rgbT[0],c.rgbT[1],c.rgbT[2]);
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text(n+' · '+c.txt,x+cw/2,cy+4.6,{align:'center'});
    doc.setFontSize(15); doc.text(String(k.c[n]),x+cw/2,cy+11.5,{align:'center'});
    doc.setFontSize(8.5); doc.text(califPct(k.c[n],k.total),x+cw/2,cy+16.4,{align:'center'});
  });

  const nota=califFiltros.nota;
  if(nota){
    const porEst=califPorEstudiante(rows), cc=CAL_COL[nota];
    const bodyE=porEst.map(function(r,i){
      const row=[i+1,(r.e.apellidos+', '+r.e.nombres).toUpperCase(),califGS(r.e),r.n];
      if(nota==='C'){ const s=situacionPorC(r.n); row.push(s.label+'\n'+s.msg); }
      return row;
    });
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(43,56,82);
    doc.text(porEst.length+' estudiante(s) con '+nota+' · '+rows.length+' calificación(es) '+nota+' en total',M,cy+ch+6);
    doc.autoTable({
      head:[nota==='C'?['N°','Estudiante','Grado/Sec.','Total de C','Situación']:['N°','Estudiante','Grado/Sec.','Total de '+nota]],
      body:bodyE, startY:cy+ch+9, theme:'grid', margin:{top:M,left:M,right:M,bottom:M}, tableWidth:W,
      styles:{fontSize:7.5,cellPadding:1.6,valign:'middle',lineColor:[221,225,232],lineWidth:0.1,textColor:[26,34,51],overflow:'linebreak'},
      headStyles:{fillColor:[19,38,65],textColor:255,fontSize:8,fontStyle:'bold'},
      columnStyles:nota==='C'?{0:{cellWidth:9,halign:'center'},1:{cellWidth:56},2:{cellWidth:20,halign:'center'},3:{cellWidth:20,halign:'center',fontStyle:'bold'},4:{cellWidth:'auto'}}
                             :{0:{cellWidth:9,halign:'center'},1:{cellWidth:'auto'},2:{cellWidth:28,halign:'center'},3:{cellWidth:28,halign:'center',fontStyle:'bold'}},
      didParseCell:function(d){
        if(d.section!=='body') return;
        if(d.column.index===3){ d.cell.styles.fillColor=cc.rgbF; d.cell.styles.textColor=cc.rgbT; d.cell.styles.fontSize=10; }
        if(nota==='C' && d.column.index===4){ const s=situacionPorC(porEst[d.row.index].n); d.cell.styles.textColor=s.rgbT; }
      }
    });
  } else {
    const body=rows.map(function(r,i){
      const e=estMap.get(r.estudianteId);
      return [i+1,fmtDate(r.fecha),(e.apellidos+', '+e.nombres).toUpperCase()+'\n'+califGS(e),areaNombre(r.areaId),compNombre(r.areaId,r.competenciaId),r.calificacion];
    });
    doc.autoTable({
      head:[['N°','Fecha','Estudiante','Área','Competencia','Nota']], body:body, startY:cy+ch+5, theme:'grid',
      margin:{top:M,left:M,right:M,bottom:M}, tableWidth:W,
      styles:{fontSize:7,cellPadding:1.4,valign:'middle',lineColor:[221,225,232],lineWidth:0.1,textColor:[26,34,51],overflow:'linebreak'},
      headStyles:{fillColor:[19,38,65],textColor:255,fontSize:7.5,fontStyle:'bold'},
      columnStyles:{0:{cellWidth:8,halign:'center'},1:{cellWidth:17,halign:'center'},2:{cellWidth:44},3:{cellWidth:31},4:{cellWidth:'auto'},5:{cellWidth:10,halign:'center',fontStyle:'bold'}},
      didParseCell:function(d){
        if(d.section==='body' && d.column.index===5){ const c=CAL_COL[d.cell.raw]; if(c){ d.cell.styles.fillColor=c.rgbF; d.cell.styles.textColor=c.rgbT; } }
      }
    });
  }
  const total=doc.getNumberOfPages();
  for(let i=1;i<=total;i++){
    doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(150,158,170);
    doc.text('AD = Logro destacado · A = Logro esperado · B = En proceso · C = En inicio',M,285);
    doc.text('Página '+i+' de '+total,M+W,285,{align:'right'});
  }
  doc.save('Calificaciones_'+(califFiltros.gs||'todos')+'_'+todayISO()+'.pdf');
  toast('PDF de calificaciones descargado.');
}

   6.7 MÓDULO: RIESGO ACADÉMICO (AUTOMATIZADO)

let riesgoFiltros = {grado:'', seccion:'', areaId:'', docenteId:'', q:'', nC:''};

/* Situación según la cantidad de competencias con C */
function situacionPorC(n){
  if(n>=8) return {n:3,cls:'grave',   label:'SITUACIÓN GRAVE',  msg:'Riesgo alto: requiere intervención inmediata, plan de recuperación y citación al padre de familia.', rgbF:[253,236,235], rgbT:[164,34,44], bg:'#fdeceb', fg:'#a4222c'};
  if(n>=4) return {n:2,cls:'dific',   label:'EN DIFICULTAD',    msg:'Dificultades en varias competencias: requiere plan de refuerzo y seguimiento del tutor.',             rgbF:[251,228,200], rgbT:[122,61,10],  bg:'#fbe4c8', fg:'#7a3d0a'};
  return                {n:1,cls:'inicio',  label:'EN INICIO',        msg:'Dificultades puntuales: requiere acompañamiento y refuerzo oportuno.',                                rgbF:[253,243,226], rgbT:[122,79,15],  bg:'#fdf3e2', fg:'#7a4f0f'};
}
/* Filas filtradas. ignorarC=true para calcular la distribución por cantidad de C */
function riesgoFiltrar(ignorarC){
  const f=riesgoFiltros;
  return estudiantesConC().filter(function(x){
    const e=x.estudiante, n=x.registros.length;
    if(f.grado && e.grado!=f.grado) return false;
    if(f.seccion && e.seccion!==f.seccion) return false;
    if(f.areaId && !x.areaIds.includes(f.areaId)) return false;
    if(f.docenteId && !x.registros.some(function(r){return r.docenteId===f.docenteId;})) return false;
    if(f.q && !(e.nombres+' '+e.apellidos).toLowerCase().includes(f.q)) return false;
    if(!ignorarC && f.nC){ if(f.nC==='11'){ if(n<11) return false; } else if(n!==Number(f.nC)) return false; }
    return true;
  }).sort(function(a,b){ return b.registros.length-a.registros.length || b.areasCount-a.areasCount; });
}
function getRiesgoRows(){ return riesgoFiltrar(false); }
function riesgoDescFiltros(){
  const f=riesgoFiltros, o=[];
  if(f.grado) o.push('Grado: '+f.grado+'.º');
  if(f.seccion) o.push('Sección: '+f.seccion);
  if(f.areaId) o.push('Área: '+areaNombre(f.areaId));
  if(f.nC) o.push('Cantidad de C: '+(f.nC==='11'?'11 o más':f.nC));
  if(f.q) o.push('Búsqueda: "'+f.q+'"');
  return o.length?o.join(' · '):'Sin filtros';
}

function paintRiesgoChips(){
  const box=$('#riesgoCChips'); if(!box) return;
  const base=riesgoFiltrar(true), cnt={};
  base.forEach(function(x){ const n=x.registros.length, k=n>=11?'11':String(n); cnt[k]=(cnt[k]||0)+1; });

      '<span class="rc-l">'+(i===11?'11 o más':i+(i===1?' C':' C'))+'</span><span class="rc-n">'+n+'</span></button>';

function descargarRiesgoPDF(){
  var rows = getRiesgoRows();
  var ov = document.createElement('div');
  ov.className = 'pdf-overlay';
  ov.innerHTML = '<div class="pdf-spinner"></div><p>Generando PDF…</p>';
  document.body.appendChild(ov);

  // A4 horizontal con márgenes de 2.5 cm en los 4 lados
  // Área útil: 247 mm × 160 mm
  // Nodo HTML renderizado al ancho del área útil a 96 dpi: 247mm × (96/25.4) ≈ 934 px
  var MARGIN_MM   = 25;          // 2.5 cm
  var PAGE_W_MM   = 297;         // A4 landscape ancho
  var PAGE_H_MM   = 210;         // A4 landscape alto
  var CONTENT_W_MM = PAGE_W_MM - 2 * MARGIN_MM;   // 247 mm
  var CONTENT_H_MM = PAGE_H_MM - 2 * MARGIN_MM;   // 160 mm
  var NODE_W_PX   = Math.round(CONTENT_W_MM * 96 / 25.4);  // 934 px a 96 dpi

  var node = document.createElement('div');
  node.style.cssText = 'position:fixed;left:-9999px;top:0;width:'+NODE_W_PX+'px;background:#fff;box-sizing:border-box;';
  node.innerHTML = buildRiesgoHTML(rows);
  document.body.appendChild(node);

  html2canvas(node, {scale:2, useCORS:true, backgroundColor:'#ffffff', logging:false}).then(function(canvas){
    var jsPDFLib = window.jspdf.jsPDF;
    var pdf = new jsPDFLib({orientation:'landscape', unit:'mm', format:'a4'});

    // Relación px-canvas → mm en el área útil
    // canvas.width = NODE_W_PX * scale = 934 * 2 = 1868 px → CONTENT_W_MM mm
    var pxPerMm = canvas.width / CONTENT_W_MM;

    // Alto del área útil en píxeles de canvas
    var contentH_px = Math.round(CONTENT_H_MM * pxPerMm);

    var totalPages = Math.ceil(canvas.height / contentH_px);
    var imgData = canvas.toDataURL('image/png');

    for(var page = 0; page < totalPages; page++){
      if(page > 0) pdf.addPage();

      // Recortar la franja vertical correspondiente a esta página
      var srcY  = page * contentH_px;
      var srcH  = Math.min(contentH_px, canvas.height - srcY);

      var sc = document.createElement('canvas');
      sc.width  = canvas.width;
      sc.height = srcH;
      sc.getContext('2d').drawImage(
        canvas,
        0, srcY, canvas.width, srcH,
        0, 0,    canvas.width, srcH
      );

      // Alto de la franja en mm (proporcional a lo que ocupa del área útil)
      var sliceH_mm = srcH / pxPerMm;

      pdf.addImage(
        sc.toDataURL('image/png'), 'PNG',
        MARGIN_MM, MARGIN_MM,          // x, y con margen exacto de 2.5 cm
        CONTENT_W_MM, sliceH_mm        // ancho y alto dentro del área útil
      );

      // Número de página centrado en el margen inferior
      pdf.setFontSize(8);
      pdf.setTextColor(156, 163, 175);
      pdf.text(
        'Página ' + (page + 1) + ' / ' + totalPages,
        PAGE_W_MM / 2,
        PAGE_H_MM - MARGIN_MM / 2,
        {align: 'center'}
      );
    }

    var ts = new Date().toISOString().slice(0,16).replace('T','_').replace(':','-');
    pdf.save('riesgo_academico_'+ts+'.pdf');
    document.body.removeChild(node);
    document.body.removeChild(ov);
    toast('PDF descargado correctamente.');
  }).catch(function(err){
    console.error('Error PDF riesgo:', err);
    document.body.removeChild(node);
    document.body.removeChild(ov);
    toast('Error al generar el PDF.', 'err');
  });
}

/* ─────────────────────────────────────────────────────────────────────────────
   REPORTE CONSOLIDADO — estado interno
   lastReport   : datos base (título, dataset completo sin filtro de nivel)
   _repFiltroNivel : filtro activo ('todos' | 'alto' | 'moderado' | 'leve')
   ───────────────────────────────────────────────────────────────────────────── */
let lastReport = null;
let _repFiltroNivel = 'todos';

/* Utilidad: calcula nivel a partir del conteo de competencias */
function _nivelCompNum(compCount){ return compCount >= 8 ? 3 : compCount >= 4 ? 2 : compCount >= 1 ? 1 : 0; }
function _nivelPillClass(label){
  if(label==='Riesgo alto') return 'alto';
  if(label==='Riesgo moderado') return 'moderado';
  if(label==='Riesgo leve') return 'leve';
  return 'sin';
}

/* Aplica el filtro de nivel activo sobre el dataset del reporte y devuelve el subconjunto */
function _datasetFiltrado(){
  if(!lastReport || !lastReport.esConsolidadoGeneral) return lastReport ? lastReport.dataset : [];
  const d = lastReport.dataset || [];
  if(_repFiltroNivel === 'todos') return d;
  const labelMap = {alto:'Riesgo alto', moderado:'Riesgo moderado', leve:'Riesgo leve'};
  const target = labelMap[_repFiltroNivel] || '';
  return d.filter(function(x){
    return riskLabel(_nivelCompNum(x.registros.length)) === target;
  });
}

/* ── generarReporte ───────────────────────────────────────────────────────── */
function generarReporte(){
  const t = $('#repTipo').value;
  const esConsolidadoGeneral = (t === 'general' || (!t));
  _repFiltroNivel = 'todos'; // resetear filtro al generar nuevo reporte
  let title = '', rows = [], cols = esConsolidadoGeneral
    ? ['N.°','Estudiante','Grado/Sec.','Competencias con C','Nivel de riesgo']
    : ['N.°','Estudiante','Grado/Sec.','Áreas con C','Nivel de riesgo'];
  let dataset = estudiantesConC();
  if(t==='grado'){
    const g = $('#repGrado').value, s = $('#repSeccion').value;
    dataset = dataset.filter(x=>x.estudiante.grado==g && x.estudiante.seccion===s);
    title = `Reporte de riesgo — ${g}.º "${s}"`;
  } else if(t==='area'){
    const a = $('#repArea').value;
    dataset = dataset.filter(x=>x.areaIds.includes(a));
    title = `Reporte de riesgo — Área: ${areaNombre(a)}`;
  } else if(t==='estudiante'){
    const eid = $('#repEst').value;
    dataset = dataset.filter(x=>x.estudiante.id===eid);
    title = `Ficha individual — ${dataset[0]? dataset[0].estudiante.apellidos+', '+dataset[0].estudiante.nombres : ''}`;
  } else {
    title = 'Consolidado general de estudiantes en riesgo (calificación C)';
  }
  if(esConsolidadoGeneral){
    dataset = [...dataset].sort((a,b)=>(b.registros.length - a.registros.length));
    rows = dataset.map(function(x, i){
      const compCount = x.registros.length;
      const compNombres = x.registros.map(r=>compNombre(r.areaId, r.competenciaId)).join(', ');
      const nivelComp = _nivelCompNum(compCount);
      return [String(i+1), `${x.estudiante.apellidos}, ${x.estudiante.nombres}`,
        `${x.estudiante.grado}.º "${x.estudiante.seccion}"`,
        compCount + ' competencia(s): ' + compNombres, riskLabel(nivelComp)];
    });
  } else {
    rows = dataset.map(function(x, i){
      return [String(i+1), `${x.estudiante.apellidos}, ${x.estudiante.nombres}`,
        `${x.estudiante.grado}.º "${x.estudiante.seccion}"`,
        x.areasCount + ' área(s): ' + x.areaIds.map(areaNombre).join(', '),
        riskLabel(riskLevel(x.areasCount))];
    });
  }
  lastReport = {title, cols, rows, esConsolidadoGeneral, dataset};
  $('#repPreviewCard').style.display = '';
  _paintRepPreview();
}

/* ── Pintar la vista previa (se llama al generar y al cambiar filtro) ──────── */
function _paintRepPreview(){
  if(!lastReport) return;
  if(lastReport.esConsolidadoGeneral){
    $('#repPreview').innerHTML = _renderConsolidadoCompetenciasHTML(lastReport, false, _repFiltroNivel);
  } else {
    const rows = lastReport.rows;
    const cols = lastReport.cols;
    $('#repPreview').innerHTML = `<h4 style="margin-bottom:10px;">${esc(lastReport.title)}</h4>
      <div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${rows.length ? rows.map(r=>`<tr>${r.map(c=>`<td>${esc(String(c))}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="small-muted">Sin resultados.</td></tr>`}</tbody></table></div>`;
  }
}

/* ── Cambiar filtro de nivel (llamado desde botones en la vista previa) ────── */
function _repCambiarFiltro(nivel){
  _repFiltroNivel = nivel;
  // Actualizar estado visual de botones
  $$('.rep-filtro-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.filtro === nivel); });
  // Re-pintar tabla y badge sin regenerar
  const ds = _datasetFiltrado();
  const badge = $('#repTotalBadge');
  if(badge) badge.querySelector('span').textContent = ds.length;
  _repActualizarTablaPorFiltro(ds);
}

function _repActualizarTablaPorFiltro(ds){
  const tbody = $('#repConsolidadoTbody');
  if(!tbody) return;
  tbody.innerHTML = _buildConsolidadoTbodyHtml(ds, false);
}

/* ── Construir solo el tbody (reutilizable para preview y print) ─────────── */
function _buildConsolidadoTbodyHtml(ds, forPrint){
  if(!ds.length){
    const cols = 7;
    return `<tr><td colspan="${cols}" style="padding:20px;text-align:center;color:#6b7280;">Sin estudiantes con el nivel seleccionado.</td></tr>`;
  }
  let html = '';
  ds.forEach(function(x, idx){
    const compCount = x.registros.length;
    const nivelComp = _nivelCompNum(compCount);
    const nivelLabel = riskLabel(nivelComp);
    const pillClass = _nivelPillClass(nivelLabel);
    const num = idx + 1;

    let compBlock;
    if(forPrint){
      const compListTxt = x.registros.map(function(r){ return compNombre(r.areaId, r.competenciaId); }).join(' · ');
      compBlock = `<div style="font-weight:700;color:#a4222c;font-size:9px;margin-bottom:3px;font-family:monospace;">${compCount} competencia(s) con calificación C</div>`
        + `<div style="font-size:9.5px;line-height:1.55;color:#1a1f2b;">${esc(compListTxt)}</div>`;
    } else {
      const chips = x.registros.map(function(r){ return `<span>${esc(compNombre(r.areaId, r.competenciaId))}</span>`; }).join('');
      compBlock = `<div class="comp-count">${compCount} competencia(s) con calificación C</div><div class="comp-list">${chips}</div>`;
    }

    if(forPrint){
      const rowBg = idx%2===0?'#ffffff':'#faf9f5';
      const tdBase = 'padding:7px 10px;border-bottom:1px solid #e6e1d3;vertical-align:top;font-family:Inter,Arial,sans-serif;';
      const pillColors = {alto:'background:#fdeceb;color:#a4222c;', moderado:'background:#fbe4c8;color:#7a3d0a;', leve:'background:#fdf3e2;color:#7a4f0f;', sin:'background:#e6f6f2;color:#1c6f61;'};
      const pillStyle = `display:inline-block;padding:3px 9px;border-radius:20px;font-size:9px;font-weight:700;white-space:nowrap;font-family:monospace;${pillColors[pillClass]||''}`;
      html += `<tr style="background:${rowBg};">
        <td style="${tdBase}text-align:center;font-weight:700;font-family:monospace;font-size:10px;color:#6b7280;white-space:nowrap;vertical-align:middle;">${num}</td>
        <td style="${tdBase}font-weight:700;color:#152238;font-size:10px;">${esc(x.estudiante.apellidos)}, ${esc(x.estudiante.nombres)}</td>
        <td style="${tdBase}text-align:center;font-weight:700;font-size:10px;white-space:nowrap;vertical-align:middle;">${x.estudiante.grado}.&ordm; &ldquo;${esc(x.estudiante.seccion)}&rdquo;</td>
        <td style="${tdBase}">${compBlock}</td>
        <td style="${tdBase}text-align:center;vertical-align:middle;"><span style="${pillStyle}">${esc(nivelLabel)}</span></td>
      </tr>`;
    } else {
      html += `<tr>
        <td class="col-num">${num}</td>
        <td><div class="nombre-est">${esc(x.estudiante.apellidos)}, ${esc(x.estudiante.nombres)}</div></td>
        <td class="col-grado">${x.estudiante.grado}.&ordm; &ldquo;${esc(x.estudiante.seccion)}&rdquo;</td>
        <td>${compBlock}</td>
        <td class="col-nivel"><span class="nivel-pill ${pillClass}">${esc(nivelLabel)}</span></td>
        <td style="font-size:11.5px;color:#a4222c;font-weight:600;min-width:160px;">${esc((function(){const a=consAreasDesaprobadas(x.estudiante);return a.length?a.join(', '):'Ninguna';})())}</td>
        <td style="text-align:center;">${(function(){const s=consSitFinal(x.estudiante);return s?'<span class="nivel-pill" style="background:'+s.bg+';color:'+s.fg+';" title="'+s.n+'">'+s.t+'</span>':'–';})()}</td>
      </tr>`;
    }
  });
  return html;
}

/* ── Render HTML completo del reporte consolidado ─────────────────────────── */
function _renderConsolidadoCompetenciasHTML(report, forPrint, filtroNivel){
  filtroNivel = filtroNivel || 'todos';
  const fecha = new Date().toLocaleDateString('es-PE',{year:'numeric',month:'long',day:'numeric'});
  const h1Style = forPrint
    ? 'font-size:15px;color:#152238;margin:0;font-family:Inter,Arial,sans-serif;font-weight:800;'
    : 'font-size:16px;color:var(--navy);margin:0;font-family:var(--font-display);font-weight:800;';

  // Dataset con filtro aplicado
  const ds = (function(){
    const d = report.dataset || [];
    if(filtroNivel === 'todos') return d;
    const labelMap = {alto:'Riesgo alto', moderado:'Riesgo moderado', leve:'Riesgo leve'};
    const target = labelMap[filtroNivel] || '';
    return d.filter(function(x){ return riskLabel(_nivelCompNum(x.registros.length)) === target; });
  })();

  const total = ds.length;
  const filtroLabel = {todos:'Todos', alto:'Riesgo alto', moderado:'Riesgo moderado', leve:'Riesgo leve'}[filtroNivel] || 'Todos';

  /* ── Encabezado ── */
  let headerBlock;
  if(forPrint){
    const headStyle = 'font-family:Inter,Arial,sans-serif;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #152238;padding-bottom:10px;margin-bottom:12px;';
    const totalInfo = filtroNivel !== 'todos' ? `Filtro: ${filtroLabel} · ` : '';
    headerBlock = `<div style="${headStyle}">
      <div>
        <h1 style="${h1Style}">${esc(report.title)}</h1>
        <div style="font-size:9px;color:#6b7280;margin-top:3px;">Sistema de Seguimiento de Estudiantes con Calificación C · Nivel Secundaria</div>
      </div>
      <div style="font-size:9px;color:#6b7280;text-align:right;line-height:1.6;">
        Fecha de emisión: ${fecha}<br>${totalInfo}Total de estudiantes: <strong>${total}</strong>
      </div>
    </div>`;
  } else {
    /* Encabezado interactivo: título + filtros + badge total */
    const btnDefs = [
      {id:'todos', label:'Todos'},
      {id:'alto',  label:'Riesgo alto',     cls:'f-alto'},
      {id:'moderado', label:'Riesgo moderado', cls:'f-moderado'},
      {id:'leve',  label:'Riesgo leve',     cls:'f-leve'},
    ];
    const btnsHtml = btnDefs.map(function(b){
      const active = filtroNivel === b.id ? ' active' : '';
      const cls = b.cls ? ' '+b.cls : '';
      return `<button class="rep-filtro-btn${active}${cls}" data-filtro="${b.id}" onclick="_repCambiarFiltro('${b.id}')">${b.label}</button>`;

    headerBlock = `<div class="rp-head">
      <div>
        <h1 style="${h1Style}">${esc(report.title)}</h1>
        <div class="small-muted" style="margin-top:3px;">Sistema de Seguimiento de Estudiantes con Calificación C · Nivel Secundaria</div>
      </div>
      <div class="meta">Fecha de emisión: ${fecha}<br>Filtro activo: ${filtroLabel}</div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
      <div class="rep-filtros">
        <span class="rep-filtro-label">Filtrar por nivel:</span>${btnsHtml}
      </div>
      <div class="rep-total-badge" id="repTotalBadge">Total de estudiantes: <span>${total}</span></div>
    </div>`;
  }

  /* ── Tbody ── */
  const tbodyHtml = _buildConsolidadoTbodyHtml(ds, forPrint);

  /* ── Tabla ── */
  if(forPrint){
    const thStyle = 'background:#152238;color:#fff;padding:8px 10px;text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;white-space:nowrap;font-family:Inter,Arial,sans-serif;';
    return headerBlock
      + `<table style="width:100%;border-collapse:collapse;table-layout:fixed;">`
      + `<colgroup><col style="width:4%;"><col style="width:19%;"><col style="width:9%;"><col style="width:56%;"><col style="width:12%;"></colgroup>`
      + `<thead><tr>`
      + `<th style="${thStyle}text-align:center;">N.°</th>`
      + `<th style="${thStyle}">Estudiante</th>`
      + `<th style="${thStyle}text-align:center;">Grado / Secc.</th>`
      + `<th style="${thStyle}">Competencias con C</th>`
      + `<th style="${thStyle}text-align:center;">Nivel de riesgo</th>`
      + `</tr></thead>`
      + `<tbody id="repConsolidadoTbody">${tbodyHtml}</tbody></table>`
      + `<div style="margin-top:16px;font-size:8px;color:#9ca3af;">Reporte generado automáticamente por el Sistema de Seguimiento C · Nivel Secundaria</div>`;
  } else {
    return headerBlock
      + `<div class="rep-consolidado-wrap"><table class="rep-consolidado-table">`

      + `<th class="col-competencias">Competencias con C</th>`
      + `<th class="col-nivel">Nivel de riesgo</th>`

      + `</tr></thead>`

/* ── Reporte: PDF vectorial (ligero, texto real, encabezado repetido en cada hoja) ── */
function repBuildPDF(){
  if(!lastReport){ generarReporte(); }
  const r=lastReport;
  if(!window.jspdf||!window.jspdf.jsPDF){ toast('No se cargó la librería PDF. Verifica tu conexión a internet.','err'); return null; }
  const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  if(typeof doc.autoTable!=='function'){ toast('No se cargó el complemento de tablas PDF.','err'); return null; }
  const ML=12, PW=297, PH=210, USABLE=PW-2*ML;
  const inst=(DB.instituciones&&DB.instituciones.length)?DB.instituciones[0].nombre:'';
  const fecha=new Date().toLocaleDateString('es-PE',{year:'numeric',month:'long',day:'numeric'});
  let head,body,total,filtroTxt='';
  if(r.esConsolidadoGeneral){
    const ds=_datasetFiltrado(); total=ds.length;
    if(_repFiltroNivel!=='todos') filtroTxt=' · Filtro: '+({alto:'Riesgo alto',moderado:'Riesgo moderado',leve:'Riesgo leve'}[_repFiltroNivel]);
    head=[['N.°','ESTUDIANTE','GRADO / SECC.','N.° C','COMPETENCIAS CON C','ÁREAS DESAPROBADAS','NIVEL DE RIESGO','SITUACIÓN']];
    body=ds.map(function(x,i){
      const ad=consAreasDesaprobadas(x.estudiante), sf=consSitFinal(x.estudiante);
      return [i+1,(x.estudiante.apellidos+', '+x.estudiante.nombres).toUpperCase(),x.estudiante.grado+'.º "'+x.estudiante.seccion+'"',
        x.registros.length,x.registros.map(function(k){return compNombre(k.areaId,k.competenciaId);}).join('  ·  '),ad.length?ad.join(', '):'Ninguna',riskLabel(_nivelCompNum(x.registros.length)),sf?sf.t:'–'];
    });
  } else {
    total=r.rows.length;
    head=[['N.°','ESTUDIANTE','GRADO / SECC.','ÁREAS CON C','ÁREAS DESAPROBADAS','NIVEL DE RIESGO','SITUACIÓN']];
    body=r.rows.map(function(row,i){ const x=r.dataset[i], ad=x?consAreasDesaprobadas(x.estudiante):[], sf=x?consSitFinal(x.estudiante):null;
      return [String(row[0]),String(row[1]),String(row[2]),String(row[3]),ad.length?ad.join(', '):'Ninguna',String(row[4]),sf?sf.t:'–']; });
  }
  const gen=r.esConsolidadoGeneral;
  const encabezado=function(){
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(19,38,65);
    doc.text(r.title,ML,11);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(107,114,128);
    doc.text((inst?inst+' · ':'')+'Nivel Secundaria · Seguimiento de estudiantes con calificación C'+filtroTxt,ML,16);
    doc.text('Emitido: '+fecha+'  ·  Total de estudiantes: '+total,PW-ML,11,{align:'right'});
    doc.setDrawColor(19,38,65); doc.setLineWidth(0.6); doc.line(ML,18.5,PW-ML,18.5);
  };
  const colStyles=gen
    ? {0:{cellWidth:8,halign:'center',textColor:[107,114,128]},1:{cellWidth:42,fontStyle:'bold'},2:{cellWidth:15,halign:'center'},3:{cellWidth:10,halign:'center',fontStyle:'bold',textColor:[164,34,44]},4:{cellWidth:'auto',halign:'left'},5:{cellWidth:42,halign:'left',textColor:[164,34,44]},6:{cellWidth:20,halign:'center',fontStyle:'bold'},7:{cellWidth:23,halign:'center',fontStyle:'bold'}}
    : {0:{cellWidth:8,halign:'center'},1:{cellWidth:50,fontStyle:'bold'},2:{cellWidth:16,halign:'center'},3:{cellWidth:'auto',halign:'left'},4:{cellWidth:60,halign:'left',textColor:[164,34,44]},5:{cellWidth:22,halign:'center',fontStyle:'bold'},6:{cellWidth:23,halign:'center',fontStyle:'bold'}};
  const lastIdx=head[0].length-2, sitIdx=head[0].length-1;
  doc.autoTable({
    head:head, body:body.length?body:[[{content:'Sin estudiantes con los filtros seleccionados.',colSpan:head[0].length,styles:{halign:'center',textColor:[107,114,128]}}]],
    startY:22, theme:'grid', margin:{top:22,left:ML,right:ML,bottom:14}, tableWidth:USABLE,
    styles:{fontSize:8,cellPadding:{top:2.2,bottom:2.2,left:2,right:2},valign:'middle',halign:'left',lineColor:[221,225,232],lineWidth:0.15,textColor:[26,34,51],overflow:'linebreak'},
    headStyles:{fillColor:[19,38,65],textColor:255,fontSize:8,fontStyle:'bold',halign:'center',lineColor:[60,80,110]},
    alternateRowStyles:{fillColor:[248,249,252]},
    columnStyles:colStyles,
    rowPageBreak:'avoid',
    didParseCell:function(d){
      if(d.section==='head'&&(d.column.index===1||d.column.index===4||(gen&&d.column.index===5)||(!gen&&d.column.index===3))) d.cell.styles.halign='left';
      if(d.section==='body'&&d.column.index===lastIdx){
        const t=String(d.cell.raw);
        if(t==='Riesgo alto'){ d.cell.styles.fillColor=[251,217,214]; d.cell.styles.textColor=[164,34,44]; }
        else if(t==='Riesgo moderado'){ d.cell.styles.fillColor=[252,228,200]; d.cell.styles.textColor=[122,61,10]; }
        else if(t==='Riesgo leve'){ d.cell.styles.fillColor=[253,243,226]; d.cell.styles.textColor=[122,79,15]; }
      }
      if(d.section==='body'&&d.column.index===sitIdx){
        const t=String(d.cell.raw), S=CONS_SIT[t];
        if(S){ d.cell.styles.fillColor=S.f; d.cell.styles.textColor=S.c; }
      }
    },
    didDrawPage:encabezado
  });
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(150,158,170);
    doc.text('Reporte generado por el Sistema de Seguimiento C · Nivel Secundaria · Riesgo: leve 1–3 C · moderado 4–7 C · alto 8 o más C · PROM = Promovido · REC = Recuperación · PER = Permanece',ML,PH-7);
    doc.text('Hoja '+i+' de '+n,PW-ML,PH-7,{align:'right'});
  }
  return doc;
}
function imprimirReporte(){
  const doc=repBuildPDF(); if(!doc) return;
  const url=URL.createObjectURL(doc.output('blob'));
  const old=document.getElementById('repPrintFrame'); if(old) old.remove();
  const fr=document.createElement('iframe'); fr.id='repPrintFrame';
  fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;';
  fr.onload=function(){ setTimeout(function(){ try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){ window.open(url,'_blank'); } },400); };
  fr.src=url; document.body.appendChild(fr);
}
function exportarReportePDF(){
  const doc=repBuildPDF(); if(!doc) return;
  doc.save((lastReport.esConsolidadoGeneral?'reporte_consolidado_riesgo_':'reporte_seguimiento_c_')+todayISO()+'.pdf');
  toast('PDF exportado correctamente.');
}

var FICHA_PG = { pageW:210, pageH:297, mTop:10, mLeft:10, mRight:10, mBot:20 };

function _buildFichaHTML(estudianteId){
  var est = getEstMap().get(estudianteId);
  if(!est) return '';
  var seg      = getOrCreateSeguimiento(estudianteId);
  var cData    = getConCMap().get(estudianteId);
  var areasC    = cData ? cData.areaIds   : [];
  var compAfect = cData ? cData.registros : [];
  var fecha     = new Date().toLocaleDateString('es-PE',{year:'numeric',month:'long',day:'numeric'});
  var instNom   = institucionNombre(est.institucionId);

  /* Paleta institucional */
  var N1='#0d1b2e', N2='#152238', N3='#1d2e4d';
  var BG='#f4f1ea', BDR='#ddd9cf', GY='#6b7280', WH='#ffffff';
  var RED_BG='#fef2f2', RED_BDR='#fecaca', RED_TXT='#991b1b';

  /* Chips de áreas con C */
  var chipsHTML = areasC.length
    ? areasC.map(function(id){
        return '<span style="display:inline-block;background:'+N2+';color:#fff;'
          +'border-radius:20px;padding:2px 9px;font-size:8.5px;font-weight:700;'
          +'margin:2px 3px 2px 0;letter-spacing:.02em;white-space:nowrap;">'+esc(areaNombre(id))+'</span>';
      }).join('')
    : '<em style="color:'+GY+';font-size:9px;">Sin áreas en nivel C actualmente.</em>';

  /* Filas tabla competencias */
  var compRows = compAfect.length
    ? compAfect.map(function(r,i){
        var bg = i%2===0?WH:'#f9f8f5';
        return '<tr style="background:'+bg+';">'
          +'<td style="padding:5px 8px;font-size:9px;border:1px solid '+BDR+';color:'+N1+';vertical-align:top;width:30%;">'+esc(areaNombre(r.areaId))+'</td>'
          +'<td style="padding:5px 8px;font-size:9px;border:1px solid '+BDR+';color:'+N1+';vertical-align:top;">'+esc(compNombre(r.areaId,r.competenciaId))+'</td>'
          +'<td style="padding:5px 8px;font-size:9px;border:1px solid '+BDR+';color:'+N1+';text-align:center;white-space:nowrap;width:72px;">'+fmtDate(r.fecha)+'</td>'

      }).join('')
    : '<tr><td colspan="3" style="padding:8px;font-size:9px;color:'+GY+';text-align:center;border:1px solid '+BDR+';">Sin competencias con nivel C registradas.</td></tr>';

  /* Filas tabla historial */
  var histRows = seg.historial.length
    ? [].concat(seg.historial).reverse().map(function(h,i){
        var bg = i%2===0?WH:'#f9f8f5';
        return '<tr style="background:'+bg+';">'
          +'<td style="padding:5px 8px;font-size:9px;border:1px solid '+BDR+';white-space:nowrap;width:80px;">'+fmtDate(h.fecha)+'</td>'
          +'<td style="padding:5px 8px;font-size:9px;border:1px solid '+BDR+';">'+esc(h.texto)+'</td>'
          +'</tr>';

/* ── DESCARGAR PDF ───────────────────────────────────────────── */
function descargarFichaPDF(estudianteId){
  var est = DB.estudiantes.find(function(e){return e.id===estudianteId;});
  if(!est){ toast('Estudiante no encontrado.','err'); return; }

  var html = _buildFichaHTML(estudianteId);

  /* Contenedor off-screen con las mismas dimensiones que la página imprimible */
  var pg   = FICHA_PG;
  var cW   = pg.pageW - pg.mLeft - pg.mRight;   /* 190 mm */
  var cH   = pg.pageH - pg.mTop  - pg.mBot;     /* 267 mm */

  var wrap = document.createElement('div');
  /* Renderizamos a 192mm para que html2canvas tenga algo con lo que calcular */
  wrap.style.cssText = [
    'position:fixed','left:-9999px','top:0',
    'width:'+cW+'mm',
    'background:#fff',
    'padding:0',
    'box-sizing:border-box',
    'font-family:Inter,Arial,sans-serif',
  ].join(';')+';';
  wrap.innerHTML = html;
  document.body.appendChild(wrap);

  /* Overlay */
  var ov = document.createElement('div');
  ov.className = 'pdf-overlay';
  ov.innerHTML = '<div class="pdf-spinner"></div><p>Generando PDF…</p>';
  document.body.appendChild(ov);

  /* Escala x3 para alta resolución */
  var SCALE = 3;

  setTimeout(function(){
    html2canvas(wrap, {
      scale           : SCALE,
      useCORS         : true,
      backgroundColor : '#ffffff',
      logging         : false,
      width           : wrap.scrollWidth,
      height          : wrap.scrollHeight,
    }).then(function(canvas){
      var jsPDFLib = window.jspdf.jsPDF;
      var pdf = new jsPDFLib({orientation:'portrait', unit:'mm', format:'a4'});

      /* px por mm en el canvas renderizado */
      var pxPerMm = canvas.width / cW;

      /* altura de área imprimible por página en px */
      var pageHpx = cH * pxPerMm;

      var totalPages = Math.ceil(canvas.height / pageHpx);

      for(var p = 0; p < totalPages; p++){
        if(p > 0) pdf.addPage();
        var srcY = p * pageHpx;
        var srcH = Math.min(pageHpx, canvas.height - srcY);

        /* Slice de canvas para esta página */
        var slice = document.createElement('canvas');
        slice.width  = canvas.width;
        slice.height = Math.ceil(srcH);
        var ctx = slice.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,slice.width,slice.height);
        ctx.drawImage(canvas, 0, srcY, canvas.width, srcH, 0, 0, canvas.width, srcH);

        var sliceH_mm = srcH / pxPerMm;
        pdf.addImage(
          slice.toDataURL('image/png', 1.0),
          'PNG',
          pg.mLeft, pg.mTop,
          cW, sliceH_mm
        );
      }

      var ts     = new Date().toISOString().slice(0,10);
      var nombre = (est.apellidos+'_'+est.nombres)
                    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
                    .replace(/[^a-zA-Z0-9_]/g,'_').toUpperCase();
      pdf.save('ficha_'+nombre+'_'+ts+'.pdf');
      document.body.removeChild(wrap);
      document.body.removeChild(ov);
      toast('PDF descargado correctamente.');
    }).catch(function(err){
      console.error('PDF ficha error:',err);
      document.body.removeChild(wrap);
      document.body.removeChild(ov);
      toast('Error al generar el PDF.','err');
    });
  }, 250);
}

function pnCompute(){
  const est=pnAlcance(), ids=new Set(est.map(function(e){return e.id;}));
  const vig=getVigentesMap();
  const areas=consAreasOrdenadas();
  const D={est:est,nEst:est.length,nNotas:0,nC:0,niv:{AD:0,A:0,B:0,C:0}};
  const evalSet=new Set();
  const aStat=new Map(), cStat=new Map();
  areas.forEach(function(a){ aStat.set(a.id,{area:a,ev:new Set(),c:new Set(),cComp:0}); a.competencias.forEach(function(k){ cStat.set(a.id+'|'+k.id,{area:a,comp:k,ev:0,C:0,AD:0,A:0,B:0}); }); });
  vig.forEach(function(r){
    if(!ids.has(r.estudianteId)) return;
    const n=String(r.calificacion||'').toUpperCase(); if(!n) return;
    const as=aStat.get(r.areaId), cs=cStat.get(r.areaId+'|'+r.competenciaId); if(!as||!cs) return;
    D.nNotas++; evalSet.add(r.estudianteId); if(D.niv[n]!==undefined) D.niv[n]++;
    as.ev.add(r.estudianteId); cs.ev++; if(cs[n]!==undefined) cs[n]++;
    if(n==='C'){ D.nC++; as.c.add(r.estudianteId); as.cComp++; cs.C++; }
  });
  D.evalN=evalSet.size;
  D.areaStat=Array.from(aStat.values());
  D.comps=Array.from(cStat.values()).filter(function(x){return x.ev>0;}).sort(function(a,b){return b.C-a.C||(b.C/(b.ev||1))-(a.C/(a.ev||1));});
  D.conC=estudiantesConC().filter(function(x){return ids.has(x.estudiante.id);});
  D.sit={grave:[],dific:[],inicio:[]};
  D.conC.forEach(function(x){ const n=x.registros.length; (n>=8?D.sit.grave:n>=4?D.sit.dific:D.sit.inicio).push(x); });
  D.sinC=Math.max(0,D.evalN-D.conC.length);
  D.prom={PROMOVIDO:0,RECUPERACION:0,PERMANECE:0};
  const sitMap=new Map();
  est.forEach(function(e){ const r=calcularSituacionEstudiante(e); sitMap.set(e.id,r); if(D.prom[r.codigo]!==undefined) D.prom[r.codigo]++; });
  D.sitMap=sitMap;
  /* grupos por grado y sección */
  const g=new Map();
  est.forEach(function(e){ const k=e.grado+String(e.seccion||'').toUpperCase(); if(!g.has(k)) g.set(k,{k:k,grado:Number(e.grado),seccion:String(e.seccion||'').toUpperCase(),est:[],conC:0,totC:0,ini:0,dif:0,gra:0,PROM:0,REC:0,PER:0}); g.get(k).est.push(e); });
  const cm=getConCMap();
  g.forEach(function(x){
    x.est.forEach(function(e){
      const c=cm.get(e.id), n=c?c.registros.length:0;
      if(n){ x.conC++; x.totC+=n; if(n>=8)x.gra++; else if(n>=4)x.dif++; else x.ini++; }
      const r=sitMap.get(e.id); if(r){ if(r.codigo==='PROMOVIDO')x.PROM++; else if(r.codigo==='RECUPERACION')x.REC++; else if(r.codigo==='PERMANECE')x.PER++; }
    });
  });
  D.grupos=Array.from(g.values()).sort(function(a,b){return a.grado-b.grado||a.seccion.localeCompare(b.seccion);});
  /* comparativo: por grado (o por sección si hay un grado elegido) */
  const porSec=!!pnEstado.grado;

  D.grupos.forEach(function(x){ const k=porSec?x.k:String(x.grado); if(!cmp.has(k)) cmp.set(k,{label:porSec?(x.grado+'.º '+x.seccion):(x.grado+'.º'),n:0,c:0}); const o=cmp.get(k); o.n+=x.est.length; o.c+=x.conC; });
  D.cmp=Array.from(cmp.values()); D.cmpTitulo=porSec?'sección':'grado';
  D.top=D.conC.slice().sort(function(a,b){return b.registros.length-a.registros.length||a.estudiante.apellidos.localeCompare(b.estudiante.apellidos);}).slice(0,10);
  return D;
}

function confirmDelete(collection, id){
  DB[collection] = DB[collection].filter(x=>x.id!==id);
  if(collection==='estudiantes'){
    DB.calificaciones = DB.calificaciones.filter(c=>c.estudianteId!==id);

    DB.calificaciones = DB.calificaciones.filter(c=>c.areaId!==id);
  }
  saveDB(); closeModal(); toast('Eliminado correctamente.');
  renderCurrentView();
}

/* ============================================================
   MÓDULO: ADJUNTAR SIAGIE
   Importa el Excel del SIAGIE y guarda las notas en DB.calificaciones
   usando la misma estructura que usa el resto del sistema.
   El matching de estudiantes se hace por nombre normalizado (igual que
   importarConsolidado). Las áreas se emparejan por nombre normalizado
   contra DB.areas y sus competencias.
   ============================================================ */

// Mapeo hoja SIAGIE → nombre de área tal como está en AREAS_DEFAULT (Secundaria)
// SIAGIE_SHEET_MAP v24 — verificado contra exportacion real del SIAGIE Peru
// ESTRUCTURA REAL CONFIRMADA del Excel SIAGIE:
//   Fila 1: ID | Cod.Estudiante | Nombres | 01 | (vacia) | 02 | (vacia) | 03 | ...
//   Fila 2:    |               |         | NL | Conclusion desc. | NL | Conclusion desc. | ...
//   Fila 3+: datos de estudiantes
// Los encabezados son CODIGOS NUMERICOS (01,02,03,04), NO nombres de competencias.
// El mapeo es por POSICION ORDINAL: codigo 01 = competencia[0], 02 = competencia[1], etc.
const SIAGIE_SHEET_MAP = [
  {sheet:'063-MATE',         nombre:'Matemática'},
  {sheet:'017-COMU',         nombre:'Comunicación'},
  {sheet:'0002-CAST SEGNL',  nombre:'Comunicación'},
  {sheet:'0004-CIENC TEC',   nombre:'Ciencia y Tecnología'},
  {sheet:'057-INGL',         nombre:'Inglés'},
  {sheet:'031-EFIS',         nombre:'Educación Física'},
  {sheet:'014-CCSS',         nombre:'Ciencias Sociales'},
  {sheet:'014-PSOC',         nombre:'Ciencias Sociales'},
  {sheet:'0010-DESARR PCC',  nombre:'Desarrollo Personal, Ciudadanía y Cívica'},
  {sheet:'027-DPPYCC',       nombre:'Desarrollo Personal, Ciudadanía y Cívica'},
  {sheet:'0003-DESA PE',     nombre:'Desarrollo Personal, Ciudadanía y Cívica'},
  {sheet:'035-EREL',         nombre:'Educación Religiosa'},
  {sheet:'0001-ART Y CULT',  nombre:'Arte y Cultura'},
  {sheet:'0006-DESEN TIC',   nombre:'Temas Transversales TIC'},
  {sheet:'032-ETRA',         nombre:'Educación para el Trabajo'},
  {sheet:'0007-GEST AUTO',   nombre:'Temas Transversales Autonomia'},
  {sheet:'055-EDPA',         nombre:'Educación para el Trabajo'},
];

const normStr = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();

let siagieBuffer = null;   // datos parseados pendientes de confirmar
let siagieWB     = null;   // workbook activo para extracción de estudiantes
let _consolidadoGrado   = 0;   // grado del último archivo importado (para nombre de descarga)
let _consolidadoSeccion = '';  // sección del último archivo importado

/* --- Extraer estudiantes y grado/sección desde la hoja GENERALIDADES --- */
function siagieExtraerDatos(){
  if(!siagieWB){ toast('Primero carga un archivo SIAGIE.','err'); return; }

  // 1. Leer hoja GENERALIDADES
  const wsGen = siagieWB.Sheets['GENERALIDADES'];
  if(!wsGen){
    toast('El archivo no contiene la hoja GENERALIDADES. Verifica que sea un Excel exportado desde SIAGIE.','err');
    return;
  }

  // 2. Leer H10 (grado) y J10 (sección) por separado
  const ORDINAL_A_NUM = {
    'PRIMERO':1,'PRIMER':1,'1ER':1,'1RO':1,
    'SEGUNDO':2,'2DO':2,
    'TERCERO':3,'TERCER':3,'3RO':3,'3ER':3,
    'CUARTO':4,'4TO':4,
    'QUINTO':5,'5TO':5
  };

  const celdaH10 = wsGen['H10'];
  const valorH10 = celdaH10 ? String(celdaH10.v||'').trim().toUpperCase() : '';
  const celdaJ10 = wsGen['J10'];
  const valorJ10 = celdaJ10 ? String(celdaJ10.v||'').trim().toUpperCase() : '';

  if(!valorH10 && !valorJ10){
    toast('Las celdas H10 y J10 de la hoja GENERALIDADES están vacías. No se puede determinar grado y sección.','err');
    return;
  }

  // Parsear grado desde H10
  let gradoExtraido = 0;
  // Intentar número ordinal escrito ("PRIMERO", "SEGUNDO", etc.)
  for(const [palabra, num] of Object.entries(ORDINAL_A_NUM)){
    if(valorH10.includes(palabra)){ gradoExtraido = num; break; }
  }
  // Si no encontró ordinal, buscar dígito directo
  if(!gradoExtraido){
    const mG = valorH10.match(/(\d)/);
    if(mG) gradoExtraido = parseInt(mG[1]);
  }
  // Fallback: buscar en J10 si H10 no dio grado
  if(!gradoExtraido){
    for(const [palabra, num] of Object.entries(ORDINAL_A_NUM)){
      if(valorJ10.includes(palabra)){ gradoExtraido = num; break; }
    }
    if(!gradoExtraido){
      const mG2 = valorJ10.match(/(\d)/);
      if(mG2) gradoExtraido = parseInt(mG2[1]);
    }
  }

  // Parsear sección desde J10 (letra suelta como "A", "B", etc.)
  let seccionExtraida = '';
  const mS = valorJ10.match(/\b([A-Z])\b/);
  if(mS) seccionExtraida = mS[1].toUpperCase();
  // Si J10 tiene solo una letra directamente
  if(!seccionExtraida && valorJ10.length === 1 && valorJ10.match(/[A-Z]/)){
    seccionExtraida = valorJ10;
  }
  // Fallback: última letra en J10
  if(!seccionExtraida){
    const mSF = valorJ10.match(/([A-Z])(?!.*[A-Z])/);
    if(mSF) seccionExtraida = mSF[1];
  }
  // Último fallback: buscar sección en H10
  if(!seccionExtraida){
    const mSH = valorH10.match(/\b([A-F])\b/);
    if(mSH) seccionExtraida = mSH[1];
  }

  if(!GRADOS.includes(gradoExtraido) || !SECCION_LETRAS.includes(seccionExtraida)){
    toast(`No se pudo interpretar el grado/sección desde H10: "${valorH10}" / J10: "${valorJ10}". Revisa el archivo.`,'err');
    return;
  }

  // 3. Buscar nombres en cualquier hoja de área del mapeo
  const nombresExtraidos = [];
  const vistos = new Set();
  SIAGIE_SHEET_MAP.forEach(map => {
    const ws = siagieWB.Sheets[map.sheet];
    if(!ws) return;
    const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    for(let r=2; r<rows.length; r++){
      const nombreRaw = String(rows[r][2]||'').trim();
      if(!nombreRaw) continue;
      const key = normStr(nombreRaw);
      if(vistos.has(key)) continue;
      vistos.add(key);
      nombresExtraidos.push(nombreRaw);
    }
  });

  if(!nombresExtraidos.length){
    toast('No se encontraron estudiantes en el archivo. Verifica que contenga hojas de áreas con datos.','err');
    return;
  }

  // 4. Importar a DB.estudiantes evitando duplicados
  let nuevos = 0, duplicados = 0;
  nombresExtraidos.forEach(nombreRaw => {
    // Separar apellidos y nombres: el SIAGIE usa "APELLIDOS NOMBRES" (sin coma)
    // Intentamos separar por coma primero, si no, dividimos por palabras
    let ap = '', nm = '';
    if(nombreRaw.includes(',')){
      const partes = nombreRaw.split(',');
      ap = partes[0].trim();
      nm = partes.slice(1).join(',').trim();
    } else {
      // Sin coma: tomamos las 2 primeras palabras como apellidos, el resto nombres
      const palabras = nombreRaw.split(/\s+/);
      ap = palabras.slice(0,2).join(' ');
      nm = palabras.slice(2).join(' ');
    }
    if(!ap) return;

    const ya = DB.estudiantes.find(e =>
      normStr(e.apellidos) === normStr(ap) &&
      normStr(e.nombres)   === normStr(nm) &&
      e.grado    === gradoExtraido &&
      e.seccion  === seccionExtraida
    );
    if(ya){ duplicados++; return; }

    DB.estudiantes.push({
      id: uid('est'),
      apellidos: ap,
      nombres:   nm,
      dni: '', sexo: 'M', fechaNacimiento: '',
      grado:    gradoExtraido,
      seccion:  seccionExtraida,
      institucionId: ''
    });
    nuevos++;
  });

  saveDB();
  renderSidebarBadge();
  if(currentView==='estudiantes') renderEstudiantes();

  // Guardar grado/sección para nombre de archivo al exportar
  _consolidadoGrado   = gradoExtraido;
  _consolidadoSeccion = seccionExtraida;

  const msg = `Grado ${gradoExtraido}.° sección "${seccionExtraida}" — `+
    `${nuevos} estudiante(s) importado(s)${duplicados?` · ${duplicados} ya existían`:''}. `+
    `Ve a la pestaña Estudiantes para verificar.`;
  toast(msg, nuevos>0?'ok':'warn');
}

/* --- Buscar área en DB por nombre normalizado --- */
function siagieBuscarArea(nombre){
  const nNom = normStr(nombre);
  return DB.areas.find(a => normStr(a.nombre) === nNom) || null;
}

/* ================================================================
   SIAGIE PARSE v24 — Mapeo por posición ordinal (correcto)
   
   ESTRUCTURA REAL DEL EXCEL SIAGIE (verificada con archivo real):
     Fila 1: ID | Cód.Estudiante | Nombres | 01 | (vacía) | 02 | (vacía) | 03 | ...
     Fila 2:    |               |         | NL | Conclusión desc. | NL | Conclusión desc. | ...
     Fila 3+: datos de estudiantes
   
   Los encabezados son CÓDIGOS NUMÉRICOS (01, 02, 03, 04), NO nombres de competencias.
   → El mapeo es POR POSICIÓN ORDINAL: código 01 → competencia[0] del área,
     código 02 → competencia[1], etc.
   → No se hace matching por nombre. No puede haber advertencias de "sin coincidencia".
   ================================================================ */

function siagieParseWB(wb){
  const resultado = [];
  const nombresVistos = {};

  // ── Grado / sección desde H10 (grado) y J10 (sección) de hoja GENERALIDADES ──
  var gradoArch = 1, seccionArch = 'A';
  var ORDINAL_MAP_PW = {
    'PRIMERO':1,'PRIMER':1,'1ER':1,'1RO':1,
    'SEGUNDO':2,'2DO':2,
    'TERCERO':3,'TERCER':3,'3RO':3,'3ER':3,
    'CUARTO':4,'4TO':4,
    'QUINTO':5,'5TO':5
  };
  var wsGen = wb.Sheets['Generalidades'] || wb.Sheets['GENERALIDADES'];
  if(wsGen){
    // Leer H10 para el grado (fila 9, col 7 en base 0)
    var celH10 = wsGen[XLSX.utils.encode_cell({r:9,c:7})];
    var valH10 = celH10 ? String(celH10.v||'').trim().toUpperCase() : '';
    // Leer J10 para la sección (fila 9, col 9 en base 0)
    var celJ10 = wsGen[XLSX.utils.encode_cell({r:9,c:9})];
    var valJ10 = celJ10 ? String(celJ10.v||'').trim().toUpperCase() : '';

    // Extraer grado desde H10
    var gradoEncontrado = 0;
    for(var kk in ORDINAL_MAP_PW){
      if(valH10.indexOf(kk) !== -1){ gradoEncontrado = ORDINAL_MAP_PW[kk]; break; }
    }
    if(!gradoEncontrado){
      var mGH = valH10.match(/(\d)/);
      if(mGH) gradoEncontrado = parseInt(mGH[1]);
    }
    // Fallback: buscar grado en J10 si H10 no dio resultado
    if(!gradoEncontrado){
      for(var kk2 in ORDINAL_MAP_PW){
        if(valJ10.indexOf(kk2) !== -1){ gradoEncontrado = ORDINAL_MAP_PW[kk2]; break; }
      }
      if(!gradoEncontrado){
        var mGJ = valJ10.match(/(\d)/);
        if(mGJ) gradoEncontrado = parseInt(mGJ[1]);
      }
    }
    if(gradoEncontrado && gradoEncontrado >= 1 && gradoEncontrado <= 5){
      gradoArch = gradoEncontrado;
    }

    // Extraer sección desde J10
    var secEncontrada = '';
    var mSJ = valJ10.match(/\b([A-Z])\b/);
    if(mSJ) secEncontrada = mSJ[1];
    if(!secEncontrada && valJ10.length === 1 && /^[A-Z]$/.test(valJ10)){
      secEncontrada = valJ10;
    }
    if(!secEncontrada){
      var mSJF = valJ10.match(/([A-Z])(?!.*[A-Z])/);
      if(mSJF) secEncontrada = mSJF[1];
    }
    // Fallback: buscar sección en H10
    if(!secEncontrada){
      var mSH2 = valH10.match(/\b([A-F])\b/);
      if(mSH2) secEncontrada = mSH2[1];
    }
    if(secEncontrada) seccionArch = secEncontrada;
  }

  // ── Diagnóstico en consola ────────────────────────────────────
  var diagLines = [];
  var warnLines = [];

  // ── Set de áreas ya procesadas (stop-on-first-hit por área) ──────────
  // El SIAGIE_SHEET_MAP incluye hojas alternativas para el mismo área
  // (p.ej. '017-COMU' y '0002-CAST SEGNL' ambas apuntan a Comunicación;
  //  '014-CCSS' y '014-PSOC' a Ciencias Sociales).
  // Regla: la PRIMERA hoja encontrada en el workbook para cada área
  // es la que contiene los datos del grupo. Si esa hoja existe pero está
  // vacía (sin NL), el área queda sin notas — correcto. La segunda hoja
  // alternativa corresponde a un régimen distinto (p.ej. Castellano como
  // segunda lengua vs. Comunicación EBR) y NO debe rellenar los slots
  // vacíos de la primera.
  var areasYaProcesadas = {};  // { areaId: true }

  SIAGIE_SHEET_MAP.forEach(function(map){
    var ws = wb.Sheets[map.sheet];
    if(!ws) return;

    var rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    if(rows.length < 3) return;

    var area = siagieBuscarArea(map.nombre);
    if(!area) return;

    // Si este área ya fue procesada por una hoja anterior, omitir esta hoja
    if(areasYaProcesadas[area.id]){
      diagLines.push('  Hoja:'+map.sheet+' ['+area.nombre+'] — OMITIDA (área ya procesada por hoja anterior)');
      return;
    }
    // Marcar el área como procesada antes de continuar
    areasYaProcesadas[area.id] = true;

    // ── Detectar fila de NL (siempre fila 2 en SIAGIE, índice 1) ──
    // Verificar que fila 1 (índice 1) realmente tenga "NL" en col 3
    var nlRow = 1;
    var nlVal = String(rows[1] && rows[1][3] ? rows[1][3] : '').trim().toUpperCase();
    if(nlVal !== 'NL'){
      // buscar en filas 0..3 la que tenga NL
      for(var ri=0; ri<Math.min(4,rows.length); ri++){
        if(String(rows[ri][3]||'').trim().toUpperCase()==='NL'){ nlRow=ri; break; }
      }
    }

    // ── Construir colMap por posición ordinal ─────────────────────
    // Columna 3 = NL competencia 0, columna 5 = NL competencia 1, ...
    // Patrón fijo SIAGIE: col 3, 5, 7, 9, ... (cada 2 columnas)
    var colMap = []; // [{col, compIdx}]

    // Contar cuántos NL reales hay en la fila de NL para verificar
    var nlEncontrados = 0;
    var c = 3;
    while(c < 30){
      var celda = String(rows[nlRow] && rows[nlRow][c] ? rows[nlRow][c] : '').trim().toUpperCase();
      if(celda === 'NL'){
        var compIdx = colMap.length;
        if(compIdx < area.competencias.length){
          colMap.push({col:c, compIdx:compIdx});
          diagLines.push('  Hoja:'+map.sheet+' col'+c+' NL → ['+area.nombre+'] comp['+(compIdx+1)+']: '+area.competencias[compIdx].nombre);
          nlEncontrados++;
        }
        c += 2; // saltar columna de Conclusión
      } else {
        c++;
      }
      if(c > 25) break;
    }

    // Verificar cantidad de competencias
    if(nlEncontrados !== area.competencias.length){
      warnLines.push('  Hoja:'+map.sheet+' ['+area.nombre+']: '+nlEncontrados+' NL encontrados, '+area.competencias.length+' competencias en sistema.');
    }

    // Fallback: si no se detectó ningún NL, usar posición matemática fija
    if(colMap.length === 0){
      warnLines.push('  Hoja:'+map.sheet+': sin NL detectados en fila '+(nlRow+1)+', usando posición matemática fija.');
      area.competencias.forEach(function(comp,j){
        colMap.push({col:3+j*2, compIdx:j});
      });
    }

    // ── Leer filas de datos (desde fila después de NL) ────────────
    var dataStart = nlRow + 1;

    for(var r=dataStart; r<rows.length; r++){
      var row = rows[r];
      var nombreRaw = String(row[2]||'').trim();
      if(!nombreRaw) continue;
      // Saltar filas de totales, sub-cabeceras, firmas
      var nUp = nombreRaw.toUpperCase();
      if(nUp.includes('APELLIDO')||nUp.includes('TOTAL')||nUp.includes('FIRMA')||nUp==='NL'||nombreRaw.length<3) continue;

      var nKey = normStr(nombreRaw);

      if(!(nKey in nombresVistos)){
        nombresVistos[nKey] = resultado.length;
        // Buscar por ID estable, nunca por índice posicional
        var estEncontrado = DB.estudiantes.find(function(e){
          return normStr(e.apellidos+' '+e.nombres)===nKey ||
                 normStr(e.apellidos+', '+e.nombres)===nKey;
        });
        // FIX: el fallback por prefijo era fuente de falsos positivos entre
        // estudiantes de distinto grado/sección (apellidos comunes: García, Quispe,
        // Rojas, etc.). Se restringe el universo de búsqueda al grado/sección del
        // ARCHIVO actual (gradoArch/seccionArch) y se exige coincidencia de AMBOS
        // apellidos como palabras completas (no "includes" parcial en cualquier parte).
        // FIX 2: la coincidencia por "includes" ignoraba el orden de las palabras,
        // por lo que "LOPEZ OSORIO" y "OSORIO LOPEZ" (apellidos distintos, mismas
        // palabras invertidas) se confundían como el mismo estudiante. Ahora se
        // exige que el apellido paterno/materno coincida en su posición exacta.
        if(!estEncontrado){
          var partes = nKey.split(/[\s,]+/).filter(Boolean);
          var apPaterno = partes[0] || '';
          var apMaterno = partes[1] || '';
          var candidatosMismoGS = DB.estudiantes.filter(function(e){
            return e.grado === gradoArch && e.seccion === seccionArch;
          });
          estEncontrado = candidatosMismoGS.find(function(e){
            var enPartes = normStr(e.apellidos).split(/\s+/).filter(Boolean);
            return apPaterno && enPartes[0] === apPaterno &&
                   (!apMaterno || enPartes[1] === apMaterno);
          });
          // Si no hay coincidencia dentro del grado/sección del archivo, NO se
          // busca en toda la base de estudiantes (eso era lo que causaba notas
          // cruzadas entre secciones/grados distintos). Queda sin encontrar;
          // más abajo se crea el estudiante o se reporta como no encontrado.
        }
        // Guardar el ID del estudiante (string estable), no el índice posicional
        resultado.push({
          nombre: nombreRaw,
          nombreNorm: nKey,
          estId: estEncontrado ? estEncontrado.id : null,   // ID estable
          estIdx: estEncontrado ? DB.estudiantes.indexOf(estEncontrado) : -1, // solo para preview
          grado: gradoArch,
          seccion: seccionArch,
          areas: {}
        });
      }

      var ri2 = nombresVistos[nKey];
      if(!resultado[ri2].areas[area.id]) resultado[ri2].areas[area.id] = [];

      colMap.forEach(function(entry){
        var nlRaw = String(row[entry.col]||'').trim().toUpperCase();
        var conc  = String(row[entry.col+1]||'').trim();
        var nl    = ['AD','A','B','C'].includes(nlRaw) ? nlRaw : '';
        var comp  = area.competencias[entry.compIdx];
        if(!comp) return;
        var j = entry.compIdx;
        // Escribir solo si el slot aún no existe.
        // Las áreas alternativas del mismo área están bloqueadas por areasYaProcesadas,
        // por lo que este check protege únicamente contra filas duplicadas dentro
        // de la misma hoja (mismo estudiante en dos filas).
        if(!resultado[ri2].areas[area.id][j]){
          resultado[ri2].areas[area.id][j] = {compId:comp.id, nl:nl, conclusion:conc};
        }
      });
    }
  });

  // ── Diagnóstico en consola ────────────────────────────────────
  console.group('[SIAGIE v24] Diagnóstico de importación');
  console.log('Mapeo posicional (NL → competencia del sistema):');
  diagLines.forEach(function(l){ console.log(l); });
  if(warnLines.length){
    console.warn('Advertencias:');
    warnLines.forEach(function(l){ console.warn(l); });
  } else {
    console.log('Sin advertencias — todas las competencias mapeadas correctamente.');
  }
  console.groupEnd();

  // Guardar grado/sección para nombre de archivo al exportar
  if(gradoArch && seccionArch){
    _consolidadoGrado   = gradoArch;
    _consolidadoSeccion = seccionArch;
  }

  return resultado;
}

/* --- Aplicar resultado a DB.calificaciones --- */
function siagieAplicarResultado(resultado){
  const hoy = todayISO();
  let ok=0, noEnc=0, creados=0;
  resultado.forEach(function(r){
    // ── Resolver estudiante por ID estable ──────────────────────────
    var est = r.estId ? DB.estudiantes.find(function(e){ return e.id === r.estId; }) : null;

    // Si no se encontró por ID (puede ser null porque no había match en el parse),
    // intentar localizar el estudiante en DB por nombre normalizado.
    // Esto es crítico en el modo multi-archivo: un archivo anterior del mismo lote
    // puede haber creado el estudiante en DB.estudiantes durante esta misma sesión,
    // y siagieParseWB (que corrió antes del push a DB) no lo conocía todavía.
    if(!est){
      var nKeyR = r.nombreNorm || normStr(r.nombre || '');
      if(nKeyR){
        est = DB.estudiantes.find(function(e){
          return normStr(e.apellidos+' '+e.nombres) === nKeyR ||
                 normStr(e.apellidos+', '+e.nombres) === nKeyR;
        });
        // FIX: fallback por prefijo restringido al grado/sección del archivo
        // (r.grado / r.seccion) y con coincidencia de palabra completa en
        // ambos apellidos, igual que en siagieParseWB. Evita emparejar con
        // un estudiante de otra sección/grado que comparta apellido común.
        // FIX 2: coincidencia por posición exacta (paterno/materno), no por
        // membresía sin orden, para no confundir apellidos invertidos
        // (ej. "LOPEZ OSORIO" vs "OSORIO LOPEZ").
        if(!est){
          var partesR = nKeyR.split(/[\s,]+/).filter(Boolean);
          var apPaternoR = partesR[0] || '';
          var apMaternoR = partesR[1] || '';
          var candidatosMismoGSR = DB.estudiantes.filter(function(e){
            return e.grado === r.grado && e.seccion === r.seccion;
          });
          est = candidatosMismoGSR.find(function(e){
            var enPartesR = normStr(e.apellidos).split(/\s+/).filter(Boolean);
            return apPaternoR && enPartesR[0] === apPaternoR &&
                   (!apMaternoR || enPartesR[1] === apMaternoR);
          });
        }
        // Si ahora encontramos al estudiante, registrar su ID para uso posterior
        if(est) r.estId = est.id;
      }
    }

    // Si aún no existe, crearlo con los datos del archivo
    if(!est){
      var nombreRaw = r.nombre || '';
      var ap = '', nm = '';
      if(nombreRaw.includes(',')){
        var partes = nombreRaw.split(',');
        ap = partes[0].trim();
        nm = partes.slice(1).join(',').trim();
      } else {
        var palabras = nombreRaw.split(/\s+/);
        ap = palabras.slice(0,2).join(' ');
        nm = palabras.slice(2).join(' ');
      }
      if(!ap){ noEnc++; return; }
      var gradoNuevo   = (r.grado   && GRADOS.includes(r.grado))           ? r.grado   : 1;
      var seccionNueva = (r.seccion && SECCION_LETRAS.includes(r.seccion)) ? r.seccion : 'A';
      est = {
        id: uid('est'),
        apellidos: ap, nombres: nm,
        dni: '', sexo: 'M', fechaNacimiento: '',
        grado: gradoNuevo, seccion: seccionNueva,
        institucionId: ''
      };
      DB.estudiantes.push(est);
      // Registrar el ID estable en r para evitar duplicados dentro del mismo lote
      r.estId = est.id;
      creados++;
    }

    // ── Volcar calificaciones usando IDs estables ────────────────────
    Object.keys(r.areas).forEach(function(areaId){
      var comps = r.areas[areaId];
      comps.forEach(function(cd, j){
        if(!cd || !cd.nl) return;
        // Reemplazar o agregar: clave (estudianteId, areaId, competenciaId) — todo IDs estables
        var perS = periodoDestino('SIAGIE');
        var idx = DB.calificaciones.findIndex(function(c){
          return c.estudianteId === est.id &&
                 c.areaId       === areaId &&
                 c.competenciaId === cd.compId &&
                 (c.periodo||'') === perS;
        });
        var reg = {
          id: uid('cal'),
          estudianteId: est.id,
          areaId:       areaId,
          competenciaId: cd.compId,
          calificacion:  cd.nl,
          periodo: perS,
          fecha:   hoy,
          docenteId: ''
        };
        if(idx >= 0) DB.calificaciones[idx] = reg;
        else         DB.calificaciones.push(reg);
      });
    });
    ok++;
  });
  return {ok, noEnc, creados};
}

/* --- Renderizar previsualización de resultados --- */
function siagieRenderPreview(resultado, maxRows){
  // Recolectar áreas presentes
  const areasPresentes = [];
  const areasVistas = new Set();
  resultado.forEach(r=>{
    Object.keys(r.areas).forEach(areaId=>{
      if(!areasVistas.has(areaId)){
        areasVistas.add(areaId);
        const a = DB.areas.find(x=>x.id===areaId);
        if(a) areasPresentes.push(a);
      }
    });
  });

  // Usar areasOrdenadas() para que el preview del SIAGIE respete el orden oficial
  const _areasOrd = areasOrdenadas();
  // Filtrar solo las áreas que tienen datos en este archivo
  const _areasPreview = _areasOrd.filter(a => areasPresentes.find(x=>x.id===a.id));
  let th1 = '<th rowspan="2" style="min-width:180px;">Estudiante (SIAGIE)</th><th rowspan="2">Estado</th>';
  let th2 = '';
  _areasPreview.forEach(a=>{
    th1 += `<th colspan="${a.competencias.length}" style="background:var(--navy-3);">${esc(a.nombre)}</th>`;
    a.competencias.forEach(()=>{ th2 += '<th>NL</th>'; });
  });

  // Limitar filas para no congelar el DOM con listas muy grandes
  const limit = maxRows && maxRows > 0 ? maxRows : resultado.length;
  const filasMostradas = resultado.slice(0, limit);
  const filasSobrantes = resultado.length - filasMostradas.length;

  let tbody = '';
  filasMostradas.forEach(r=>{
    // Resolver estudiante por ID estable, no por índice posicional
    const est = r.estId ? DB.estudiantes.find(e=>e.id===r.estId) : null;
    const matched = !!est;
    const estadoTxt = matched
      ? `<span style="color:#1c6f61;">&#10003; ${esc((est.apellidos+', '+est.nombres).toUpperCase())}</span>`
      : '<span style="color:var(--red-strong);">&#10007; No encontrado</span>';
    const rowClass = matched ? 'match-row' : 'nomatch-row';
    let celdas = '';
    areasPresentes.forEach(a=>{
      const comps = r.areas[a.id] || [];
      a.competencias.forEach((_,j)=>{
        const cd = comps[j];
        const nl = cd?cd.nl:'';
        celdas += `<td class="nl-cell nl-${nl}">${nl||'—'}</td>`;
      });
    });
    tbody += `<tr class="${rowClass}"><td>${esc(r.nombre)}</td><td style="white-space:nowrap;">${estadoTxt}</td>${celdas}</tr>`;
  });

  const avisoExtra = filasSobrantes > 0
    ? `<div class="help-note" style="margin-top:8px;">Se muestran las primeras ${limit} filas. El archivo contiene ${resultado.length} estudiantes en total. Al confirmar la importación se procesarán todos.</div>`
    : '';

  return `<div class="siagie-preview-wrap">
    <table>
      <thead><tr>${th1}</tr><tr>${th2}</tr></thead>
      <tbody>${tbody||'<tr><td colspan="100" style="text-align:center;padding:12px;color:var(--muted);">Sin datos</td></tr>'}</tbody>
    </table>
  </div>${avisoExtra}`;
}

/* --- Carga simple (1 archivo, muestra preview) --- */
function siagieCargarSimple(event){
  const file = event.target.files[0];
  if(!file) return;
  siagieLimpiar();

  const progWrap  = $('#siagieProgress');
  const progLabel = $('#siagieProgressLabel');
  const progPct   = $('#siagieProgressPct');
  const progFill  = $('#siagieProgressFill');
  const progSub   = $('#siagieProgressSub');

  function setProgressSimple(pct, label, sub){
    var p = Math.min(100, Math.max(0, Math.round(pct)));
    console.log('[SIAGIE simple] setProgress:', p + '%', label || '');
    progFill.style.width = p + '%';
    progPct.textContent  = p + ' %';
    if(label !== undefined) progLabel.textContent = label;
    if(sub   !== undefined) progSub.textContent   = sub || '';
    if(p === 100) progFill.style.background = 'linear-gradient(90deg,var(--teal),#1c6f61)';
  }

  function showError(msg){
    progWrap.style.display = 'none';
    const res = $('#siagieResultado');
    res.style.display = 'block';
    res.innerHTML = '<div class="siagie-result-badge err">&#10007; ' + msg + '</div>';
  }

  progWrap.style.display = 'block';
  setProgressSimple(10, 'Leyendo archivo…', file.name);
  console.log('[SIAGIE simple] Inicio lectura —', file.name);

  const reader = new FileReader();

  reader.onload = function(e){
    console.log('[SIAGIE simple] FileReader.onload OK');
    setProgressSimple(40, 'Procesando hojas SIAGIE…', file.name);

    var wb;
    try{
      wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      console.log('[SIAGIE simple] XLSX.read OK — hojas:', wb.SheetNames.join(', '));
    }catch(err){
      console.error('[SIAGIE simple] Error XLSX.read:', err);
      showError('Error al leer el archivo. Verifica que sea un Excel (.xlsx) exportado desde SIAGIE.');
      return;
    }

    siagieWB = wb;
    const btnExtraer = $('#btnExtraerDatos');
    if(btnExtraer) btnExtraer.disabled = false;

    setProgressSimple(60, 'Extrayendo estudiantes y notas…', file.name);

    /* Separar parsing del render para no bloquear el hilo */
    setTimeout(function(){
      try{
        console.log('[SIAGIE simple] siagieParseWB iniciando…');
        const resultado = siagieParseWB(wb);
        siagieBuffer = resultado;
        console.log('[SIAGIE simple] siagieParseWB OK — estudiantes:', resultado.length);

        setProgressSimple(90, 'Construyendo previsualización…', file.name);

        const enc   = resultado.filter(function(r){ return !!r.estId; }).length;
        const noEnc = resultado.length - enc;

        /* Paso final al 100 % antes de mostrar el resultado */
        setProgressSimple(100, 'Archivo procesado correctamente', '');
        console.log('[SIAGIE simple] 100 % — mostrando resultado…');

        setTimeout(function(){
          progWrap.style.display = 'none';

          const res = $('#siagieResultado');

          res.innerHTML =
            '<div class="siagie-result-badge ' + cls + '">' +
              (cls==='ok' ? '&#10003;' : cls==='warn' ? '&#9888;' : '&#10007;') +
              ' <strong>' + enc + '</strong> estudiante(s) encontrado(s)' +
              (noEnc > 0 ? ' &nbsp;·&nbsp; <strong>' + noEnc + '</strong> sin coincidencia' : '') +
              ' &nbsp;·&nbsp; Archivo: <em>' + esc(file.name) + '</em>' +
            '</div>';
