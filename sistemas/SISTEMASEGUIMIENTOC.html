<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema C · Secundaria · Edición Profesional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ============================= TOKENS ============================= */
:root{
  --navy:#152238;
  --navy-2:#1d2e4d;
  --navy-3:#26406b;
  --gold:#e8a33d;
  --gold-ink:#7a4f0f;
  --red:#d64550;
  --red-bg:#fdeceb;
  --red-strong:#a4222c;
  --amber-bg:#fdf3e2;
  --teal:#3fa796;
  --teal-bg:#e6f6f2;
  --blue:#5b8def;
  --blue-bg:#eaf1ff;
  --bg:#f4f1ea;
  --surface:#ffffff;
  --ink:#1a1f2b;
  --muted:#6b7280;
  --border:#e6e1d3;
  --radius:14px;
  --shadow:0 2px 10px rgba(21,34,56,.06), 0 1px 2px rgba(21,34,56,.05);
  --font-display:'Sora',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.01em;}
button{font-family:var(--font-body);cursor:pointer;}
a{color:inherit;}
::selection{background:var(--gold);color:var(--navy);}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

/* ============================= LAYOUT ============================= */
.app{display:flex;min-height:100vh;}

/* --- SIDEBAR --- */
.sidebar{
  width:252px;flex-shrink:0;background:linear-gradient(185deg,var(--navy) 0%, var(--navy-2) 100%);
  color:#f2f4f8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand .mark{
  width:40px;height:40px;border-radius:10px;background:conic-gradient(from 220deg, var(--teal), var(--blue) 33%, var(--gold) 66%, var(--red) 100%);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;color:var(--navy);
  margin-bottom:10px;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.brand h1{font-size:15.5px;font-weight:700;line-height:1.25;}
.brand p{margin:4px 0 0;font-size:11.5px;color:#aab4c8;font-weight:500;letter-spacing:.02em;}
.nav{padding:14px 10px;flex:1;}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#7f8bab;padding:14px 12px 6px;font-weight:600;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#cfd6e6;
  font-size:13.5px;font-weight:500;margin-bottom:2px;border:none;background:transparent;width:100%;text-align:left;
  transition:background .15s, color .15s;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(232,163,61,.16);color:#ffd699;font-weight:600;}
.nav-item.active svg{opacity:1;}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;font-family:var(--font-mono);}
.sidebar-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7f8bab;}

/* --- MAIN --- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);padding:16px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:20;
}
.topbar h2{font-size:19px;}
.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:2px;font-weight:500;}
.btn.sm{padding:6px 12px;font-size:12px;}
.btn.sm svg{width:13px;height:13px;}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:8px 12px;width:280px;
}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;width:100%;font-family:var(--font-body);}
.search-box svg{width:15px;height:15px;color:var(--muted);flex-shrink:0;}
.view{padding:26px 28px 60px;max-width:1400px;}
.view-hidden{display:none;}

/* ============================= COMPONENTS ============================= */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:1fr 1fr;}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}}

.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.kpi .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;}
.kpi .num{font-family:var(--font-display);font-size:32px;font-weight:800;margin-top:6px;line-height:1;}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:8px;}
.kpi.accent-red{border-color:#f3cfd1;} .kpi.accent-red .num{color:var(--red-strong);}
.kpi.accent-gold .num{color:var(--gold-ink);}
.kpi.accent-teal .num{color:#1c6f61;}
.kpi.accent-navy .num{color:var(--navy);}
.kpi .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;}
.kpi.accent-red .stripe{background:var(--red);} .kpi.accent-gold .stripe{background:var(--gold);}
.kpi.accent-teal .stripe{background:var(--teal);} .kpi.accent-navy .stripe{background:var(--navy-3);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px;}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.card-head h3{font-size:15.5px;}
.card-head .hint{font-size:12px;color:var(--muted);margin-top:3px;font-weight:500;}

.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:9px;
  padding:9px 15px;font-size:13px;font-weight:600;background:var(--navy);color:#fff;transition:.15s;
}
.btn svg{width:14px;height:14px;}
.btn:hover{background:var(--navy-3);}
.btn.secondary{background:var(--surface);color:var(--navy);border-color:var(--border);}
.btn.secondary:hover{background:var(--bg);}
.btn.gold{background:var(--gold);color:#4a2e05;}
.btn.gold:hover{filter:brightness(.95);}
.btn.danger{background:var(--red-bg);color:var(--red-strong);}
.btn.danger:hover{background:#f9dcdd;}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:7px;}
.btn.icon-only{padding:7px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;font-family:var(--font-mono);letter-spacing:.02em;}
.pill.C{background:var(--red-bg);color:var(--red-strong);}
.pill.B{background:var(--amber-bg);color:var(--gold-ink);}
.pill.A{background:var(--blue-bg);color:#2452a8;}
.pill.AD{background:var(--teal-bg);color:#1c6f61;}
.pill.Pendiente{background:var(--red-bg);color:var(--red-strong);}
.pill.Enproceso{background:var(--amber-bg);color:var(--gold-ink);}
.pill.Superado{background:var(--teal-bg);color:#1c6f61;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot.C{background:var(--red);} .dot.B{background:var(--gold);} .dot.A{background:var(--blue);} .dot.AD{background:var(--teal);}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:700;padding:9px 10px;border-bottom:2px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;
}
thead th:hover{color:var(--navy);}
thead th .arrow{font-size:9px;margin-left:3px;opacity:.5;}
tbody td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:hover{background:#faf9f5;}
.table-wrap{overflow-x:auto;}
.row-risk-1{background:var(--amber-bg);}
.row-risk-2{background:#fbe4c8;}
.row-risk-3{background:#f6cfd1;}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted);}
.empty-state svg{width:34px;height:34px;color:var(--border);margin-bottom:10px;}
.empty-state p{font-size:13px;font-weight:500;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.toolbar select, .toolbar input[type=text], .toolbar input[type=search]{
  border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:12.5px;font-family:var(--font-body);background:var(--surface);color:var(--ink);
}
.toolbar .sep{width:1px;background:var(--border);height:24px;}

form .field{margin-bottom:14px;}
form label{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:5px;}
form label .req{color:var(--red);}
form input, form select, form textarea{
  width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;
  font-family:var(--font-body);background:#fff;color:var(--ink);
}
form input:focus, form select:focus, form textarea:focus{border-color:var(--blue);}
form textarea{resize:vertical;min-height:70px;}
.field-error{color:var(--red-strong);font-size:11.5px;margin-top:4px;font-weight:600;display:none;}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--red);}
.field.invalid .field-error{display:block;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}

/* --- MODAL --- */
.overlay{position:fixed;inset:0;background:rgba(21,34,56,.5);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .16s ease;}
.modal.wide{max-width:900px;}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px;}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;padding:4px;}
.modal-close:hover{color:var(--ink);}
.modal-body{padding:20px 22px;max-height:72vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tab-btn{background:none;border:none;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab-btn.active{color:var(--navy);border-color:var(--gold);}
.tab-panel{display:none;} .tab-panel.active{display:block;}

.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:9px;animation:slidein .18s ease;}
.toast.err{background:var(--red-strong);}
.toast.ok{background:#1c6f61;}
@keyframes slidein{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:none;}}

.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.chip{background:var(--bg);border:1px solid var(--border);padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}

.avatar{width:38px;height:38px;border-radius:9px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;flex-shrink:0;}
.person-cell{display:flex;align-items:center;gap:10px;}
.person-cell .nm{font-weight:600;font-size:13px;} .person-cell .sb{font-size:11.5px;color:var(--muted);}

.hist-item{border-left:2px solid var(--gold);padding:4px 0 12px 14px;position:relative;margin-left:4px;}
.hist-item::before{content:'';position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--gold);}
.hist-item .d{font-size:11px;color:var(--muted);font-weight:700;font-family:var(--font-mono);}
.hist-item .t{font-size:12.5px;margin-top:2px;}

.status-select{border-radius:20px;font-weight:700;font-size:11.5px;padding:5px 10px;border:1px solid var(--border);font-family:var(--font-mono);}

/* --- print report --- */
.print-sheet{display:none;}
@media print{
  body *{visibility:hidden;}
  .print-sheet,.print-sheet *{visibility:visible;}
  .print-sheet{display:block;position:absolute;top:0;left:0;width:100%;padding:14mm;}
  /* Dashboard print mode */
  body.printing-dashboard *{visibility:hidden;}
  body.printing-dashboard #dashPrintZone,
  body.printing-dashboard #dashPrintZone *{visibility:visible;}
  body.printing-dashboard #dashPrintZone{
    display:block!important;position:fixed;top:0;left:0;
    width:100%;padding:14mm;background:#fff;z-index:9999;
  }
  @page{size:A4 portrait;margin:10mm;}
  @page .riesgo-print{size:A4 landscape;margin:10mm;}
}
@media print{
  body.printing-riesgo *{visibility:hidden;}
  body.printing-riesgo #riesgoPrintZone,
  body.printing-riesgo #riesgoPrintZone *{visibility:visible;}
  body.printing-riesgo #riesgoPrintZone{
    display:block!important;position:fixed;top:0;left:0;
    width:100%;padding:12mm;background:#fff;z-index:9999;
  }
  body.printing-riesgo{size:A4 landscape;}
}

/* PDF/Print overlay */
.pdf-overlay{
  position:fixed;inset:0;background:rgba(21,34,56,.72);z-index:500;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.pdf-overlay p{color:#fff;font-size:14px;font-weight:600;font-family:var(--font-body);}
.pdf-spinner{
  width:42px;height:42px;border:4px solid rgba(255,255,255,.25);
  border-top-color:#e8a33d;border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.rp-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--navy);padding-bottom:10px;margin-bottom:14px;}
.rp-head h1{font-size:17px;color:var(--navy);}
.rp-head .meta{font-size:10.5px;color:var(--muted);text-align:right;line-height:1.5;}
.rp-table{width:100%;border-collapse:collapse;font-size:11px;}
.rp-table th{background:var(--navy);color:#fff;padding:6px 8px;text-align:left;}
.rp-table td{padding:6px 8px;border-bottom:1px solid #ddd;}

/* === REPORTE CONSOLIDADO COMPETENCIAS === */
.rep-consolidado-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.rep-consolidado-table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed;}
.rep-consolidado-table thead th{
  background:var(--navy);color:#fff;padding:9px 12px;text-align:left;
  font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;
  white-space:nowrap;border-bottom:none;
}
.rep-consolidado-table thead th.col-num{width:4%;text-align:center;}
.rep-consolidado-table thead th.col-estudiante{width:19%;}
.rep-consolidado-table thead th.col-grado{width:9%;text-align:center;}
.rep-consolidado-table thead th.col-competencias{width:56%;}
.rep-consolidado-table thead th.col-nivel{width:12%;text-align:center;}
.rep-consolidado-table tbody td{
  padding:9px 12px;border-bottom:1px solid #e6e1d3;vertical-align:top;
  font-size:12px;line-height:1.45;
}
.rep-consolidado-table tbody td.col-grado{text-align:center;font-weight:700;white-space:nowrap;vertical-align:middle;}
.rep-consolidado-table tbody td.col-nivel{text-align:center;vertical-align:middle;}
.rep-consolidado-table tbody tr:nth-child(even){background:#faf9f5;}
.rep-consolidado-table tbody tr:hover{background:var(--blue-bg);}
.rep-consolidado-table .nombre-est{font-weight:700;color:var(--navy);}
.rep-consolidado-table .comp-count{font-weight:700;color:var(--red-strong);font-size:11px;margin-bottom:4px;font-family:var(--font-mono);}
.rep-consolidado-table .comp-list{color:var(--ink);font-size:11.5px;line-height:1.5;}
.rep-consolidado-table .comp-list span{
  display:inline-block;background:var(--red-bg);color:var(--red-strong);
  border:1px solid #f3cfd1;border-radius:6px;padding:2px 7px;
  font-size:10.5px;font-weight:600;margin:2px 3px 2px 0;line-height:1.4;
}
.nivel-pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;font-family:var(--font-mono);white-space:nowrap;}
.nivel-pill.alto{background:var(--red-bg);color:var(--red-strong);}
.nivel-pill.moderado{background:#fbe4c8;color:#7a3d0a;}
.nivel-pill.leve{background:var(--amber-bg);color:var(--gold-ink);}
.nivel-pill.sin{background:var(--teal-bg);color:#1c6f61;}
/* --- Filtros de nivel de riesgo --- */
.rep-filtros{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.rep-filtros .rep-filtro-label{font-size:12px;font-weight:700;color:var(--muted);margin-right:4px;text-transform:uppercase;letter-spacing:.05em;}
.rep-filtro-btn{border:1px solid var(--border);background:var(--surface);color:var(--navy);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-body);transition:background .12s,color .12s,border-color .12s;}
.rep-filtro-btn:hover{background:var(--bg);}
.rep-filtro-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.rep-filtro-btn.active.f-alto{background:var(--red-strong);border-color:var(--red-strong);}
.rep-filtro-btn.active.f-moderado{background:#b35a00;border-color:#b35a00;}
.rep-filtro-btn.active.f-leve{background:var(--gold-ink);border-color:var(--gold-ink);}
/* --- Badge total --- */
.rep-total-badge{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:10px;padding:7px 14px;font-size:13px;font-weight:700;font-family:var(--font-display);margin-bottom:14px;}
.rep-total-badge span{font-family:var(--font-mono);font-size:16px;font-weight:800;}
/* --- Columna N.° --- */
.rep-consolidado-table thead th.col-num{width:4%;text-align:center;}
.rep-consolidado-table tbody td.col-num{text-align:center;font-weight:700;font-family:var(--font-mono);font-size:12px;color:var(--muted);vertical-align:middle;white-space:nowrap;}

/* Print landscape para el reporte consolidado */
@media print{
  body.printing-reporte-consolidado *{visibility:hidden;}
  body.printing-reporte-consolidado #reporteConsolidadoPrintZone,
  body.printing-reporte-consolidado #reporteConsolidadoPrintZone *{visibility:visible;}
  body.printing-reporte-consolidado #reporteConsolidadoPrintZone{
    display:block!important;position:fixed;top:0;left:0;
    width:100%;padding:10mm 12mm;background:#fff;z-index:9999;
  }
  body.printing-reporte-consolidado .rep-consolidado-table thead{display:table-header-group;}
  body.printing-reporte-consolidado .rep-consolidado-table tr{page-break-inside:avoid;}
  @page reporte-consolidado{size:A4 landscape;margin:10mm 12mm;}
}

.scrollx{overflow-x:auto;}
.small-muted{font-size:11.5px;color:var(--muted);}
hr.sep{border:none;border-top:1px solid var(--border);margin:16px 0;}
.help-note{background:var(--blue-bg);border:1px solid #cfe0ff;color:#264a8c;font-size:12px;padding:10px 13px;border-radius:10px;margin-bottom:14px;}

/* === MÓDULO SIAGIE === */
.siagie-drop-zone{border:2.5px dashed var(--border);border-radius:var(--radius);padding:2rem 1.5rem;text-align:center;cursor:pointer;transition:.2s;background:var(--surface);}
.siagie-drop-zone:hover{border-color:var(--blue);background:var(--blue-bg);}
.siagie-drop-zone.multi{border-color:#8e44ad;background:#f8f4ff;}
.siagie-drop-zone.multi:hover{background:#f0e8ff;}
.siagie-drop-zone h4{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.siagie-drop-zone p{font-size:12px;color:var(--muted);margin:0;}
.siagie-result-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:700;margin-bottom:12px;}
.siagie-result-badge.ok{background:var(--teal-bg);color:#1c6f61;border:1px solid #b2dfd7;}
.siagie-result-badge.warn{background:var(--amber-bg);color:var(--gold-ink);border:1px solid #f5d9a0;}
.siagie-result-badge.err{background:var(--red-bg);color:var(--red-strong);border:1px solid #f3cfd1;}
.siagie-preview-wrap{overflow:auto;max-height:340px;border:1px solid var(--border);border-radius:10px;margin-top:12px;}
.siagie-preview-wrap table{font-size:11px;min-width:900px;}
.siagie-preview-wrap th{background:var(--navy);color:#fff;padding:5px 6px;border:1px solid var(--navy-3);white-space:nowrap;font-size:10px;position:sticky;top:0;}
.siagie-preview-wrap td{padding:4px 6px;border:1px solid var(--border);}
.siagie-preview-wrap .match-row td:first-child{background:var(--teal-bg);color:#1c6f61;font-weight:700;}
.siagie-preview-wrap .nomatch-row td:first-child{background:var(--red-bg);color:var(--red-strong);font-weight:700;}
.siagie-preview-wrap .nl-cell{text-align:center;font-weight:700;font-family:var(--font-mono);font-size:10px;}
.siagie-preview-wrap .nl-AD{color:#1c6f61;} .siagie-preview-wrap .nl-A{color:#2452a8;}
.siagie-preview-wrap .nl-B{color:var(--gold-ink);} .siagie-preview-wrap .nl-C{color:var(--red-strong);}
.siagie-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:900px){.siagie-grid-2{grid-template-columns:1fr;}}
/* --- file-label: botón con input real encima, sin JS, funciona en Chrome file:// --- */
.file-label-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:7px;}
.file-label-btn input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0;}

/* ============================= EXPERIENCIA OFFICE ============================= */
.office-titlebar{
  min-height:42px;background:#10213c;color:#fff;display:flex;align-items:center;
  justify-content:space-between;padding:0 22px;gap:18px;border-bottom:1px solid rgba(255,255,255,.1);
}
.office-titlebar .file-name{font:600 12.5px var(--font-body);display:flex;align-items:center;gap:9px;min-width:0;}
.office-titlebar .file-name svg{width:16px;height:16px;color:#75d4c2;flex:0 0 auto;}
.office-titlebar .file-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.office-status{display:flex;align-items:center;gap:8px;color:#c9d4e7;font-size:11.5px;white-space:nowrap;}
.office-status-dot{width:7px;height:7px;border-radius:50%;background:#75d4c2;box-shadow:0 0 0 3px rgba(117,212,194,.13);}
.office-status.saving .office-status-dot{background:#e8a33d;box-shadow:0 0 0 3px rgba(232,163,61,.14);}
.office-status.error .office-status-dot{background:#ff747c;box-shadow:0 0 0 3px rgba(255,116,124,.14);}
.office-ribbon{
  background:#fff;border-bottom:1px solid #dfe4ec;min-height:64px;padding:8px 24px;
  display:flex;align-items:stretch;gap:8px;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(15,34,61,.045);
}
.ribbon-group{display:flex;align-items:center;gap:5px;padding-right:12px;margin-right:4px;border-right:1px solid #e6eaf0;}
.ribbon-group:last-child{border-right:0;margin-left:auto;padding-right:0;}
.ribbon-btn{
  border:1px solid transparent;background:transparent;color:#243754;border-radius:7px;min-width:58px;padding:6px 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;line-height:1;
}
.ribbon-btn svg{width:20px;height:20px;stroke-width:1.8;}
.ribbon-btn:hover{background:#f0f5fb;border-color:#dce5f0;}
.ribbon-btn.primary{background:#1f5c99;color:#fff;box-shadow:0 2px 5px rgba(31,92,153,.2);}
.ribbon-btn.primary:hover{background:#184d82;border-color:#184d82;}
.autosave-control{display:flex;align-items:center;gap:9px;padding:0 10px;color:#43516a;font-size:11.5px;font-weight:600;}
.switch{position:relative;width:38px;height:21px;display:inline-flex;flex:0 0 auto;}
.switch input{position:absolute;opacity:0;pointer-events:none;}
.switch-track{position:absolute;inset:0;background:#aeb8c7;border-radius:20px;transition:.2s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
.switch-track:after{content:"";position:absolute;width:15px;height:15px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch input:checked + .switch-track{background:#267761;}
.switch input:checked + .switch-track:after{transform:translateX(17px);}
.save-meta{display:flex;flex-direction:column;gap:2px;min-width:132px;}
.save-meta strong{font-size:11.5px;color:#243754;}.save-meta span{font-size:10.5px;color:#778398;}
.topbar{position:relative;top:auto;padding:13px 28px;background:#f8fafc;}
.sidebar{background:linear-gradient(180deg,#132641 0%,#0d1d34 100%);}
.brand{padding-top:20px}.brand .mark{background:#fff;color:#174d7f;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.sidebar-foot{color:#aab8cf;line-height:1.45;}
body{background:#eef2f7;}.view{padding-top:22px;}.card,.kpi{border-color:#dde3eb;box-shadow:0 2px 9px rgba(23,43,77,.055);}
@media(max-width:900px){
  .office-ribbon{overflow-x:auto;padding-left:12px}.ribbon-group{flex:0 0 auto}.save-meta{display:none}
  .office-titlebar{padding:0 14px}.office-titlebar .file-name span{max-width:45vw}.topbar{padding:12px 18px}
}

/* ============================= SITUACIÓN DEL ESTUDIANTE ============================= */
.situation-hero{background:linear-gradient(125deg,#132641,#1f5c99);color:#fff;border-radius:16px;padding:22px 24px;margin-bottom:18px;box-shadow:0 8px 24px rgba(19,38,65,.16);}
.situation-hero h3{font-size:18px;margin-bottom:6px}.situation-hero p{margin:0;color:#dbe7f6;font-size:12.5px;line-height:1.55;max-width:920px;}
.rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
.rule-box{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:11px;padding:12px 14px;}
.rule-box strong{display:block;font-size:12.5px;margin-bottom:4px}.rule-box span{font-size:11.5px;color:#dbe7f6;line-height:1.45;display:block;}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.03em;white-space:nowrap;}
.status-pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
.status-PROMOVIDO{background:#e5f6ef;color:#176b55}.status-RECUPERACION{background:#fff3d9;color:#8a5a00}.status-PERMANECE{background:#fde8e9;color:#a52431}.status-SIN_EVALUAR{background:#edf0f5;color:#657086;}.status-TRASLADADO{background:#fff4be;color:#6e5a00;}
.situation-detail{font-size:11.5px;color:var(--muted);line-height:1.45;max-width:390px;}.situation-detail strong{color:var(--ink);}
.situation-count{font:700 12px var(--font-mono);color:var(--navy);}
.sit-table{table-layout:auto;border-collapse:separate;border-spacing:0;font-size:12px;}
.sit-table th.sit-h{color:#fff;background:#132641;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:8px 6px;text-transform:uppercase;vertical-align:middle;line-height:1.2;}
.sit-table th.sit-h small{display:block;font-size:8.5px;font-weight:600;text-transform:none;letter-spacing:0;opacity:.9;}
.sit-table td{padding:6px 8px;border-bottom:1px solid #eceff4;vertical-align:middle;}
.sit-num{text-align:center;color:#7b8698;font:700 11px var(--font-mono);}
.sit-name{font-weight:700;font-size:12px;color:#132641;white-space:nowrap;min-width:290px;}
.sit-cob{font-weight:500;font-size:10px;color:var(--gold-ink);}
.sit-gs{text-align:center;font-weight:700;white-space:nowrap;}
.sit-n{text-align:center;white-space:nowrap;}.sit-n b{font:800 13px var(--font-mono);display:block;line-height:1.1;}.sit-n span{font-size:10px;color:#6b7280;font-weight:600;}
.sit-ab{display:inline-block;background:#fdeceb;color:#a4222c;border-radius:5px;padding:2px 6px;margin:1px 3px 1px 0;font:800 10.5px var(--font-mono);}
.sit-fin{text-align:center;white-space:nowrap;}.sit-fin div{margin-top:4px;font-size:9.5px;font-weight:700;color:#4a5670;letter-spacing:.02em;}
@media(max-width:800px){.rule-grid{grid-template-columns:1fr}.situation-hero{padding:18px}.status-pill{font-size:10px}}

/* ============================= PULIDO PROFESIONAL v2 ============================= */
body{font-size:14px;line-height:1.45;color:#1a2233;}
h1,h2,h3,h4{letter-spacing:-.015em;}
.sidebar{transition:width .22s ease;overflow-x:hidden;scrollbar-width:thin;}
.nav-item{position:relative;white-space:nowrap;}
.nav-item .lbl{overflow:hidden;text-overflow:ellipsis;}
.nav-item.active::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--gold);}
.sb-toggle-row{padding:10px;border-top:1px solid rgba(255,255,255,.08);}
.sb-toggle-btn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;border:none;background:rgba(255,255,255,.05);color:#cfd6e6;font-size:12.5px;font-weight:600;white-space:nowrap;}
.sb-toggle-btn:hover{background:rgba(255,255,255,.11);color:#fff;}
.sb-toggle-btn svg{width:17px;height:17px;flex-shrink:0;transition:transform .22s;}
.app.sb-collapsed .sidebar{width:72px;}
.app.sb-collapsed .brand{padding:18px 0 14px;text-align:center;}
.app.sb-collapsed .brand .mark{margin:0 auto;}
.app.sb-collapsed .brand h1,.app.sb-collapsed .brand p,.app.sb-collapsed .sidebar-foot,.app.sb-collapsed .nav-item .lbl,.app.sb-collapsed .sb-toggle-btn .lbl{display:none;}
.app.sb-collapsed .nav{padding:10px 8px;}
.app.sb-collapsed .nav-group-label{font-size:0;height:1px;padding:0;margin:10px 10px;background:rgba(255,255,255,.12);}
.app.sb-collapsed .nav-item{justify-content:center;padding:12px 0;}
.app.sb-collapsed .nav-item svg{width:21px;height:21px;}
.app.sb-collapsed .nav-item .badge{position:absolute;top:3px;right:6px;margin:0;font-size:9px;padding:0 5px;}
.app.sb-collapsed .sb-toggle-btn{justify-content:center;padding:10px 0;}
.app.sb-collapsed .sb-toggle-btn svg{transform:rotate(180deg);}
.tb-left{display:flex;align-items:center;gap:14px;min-width:0;}
.tb-menu{width:38px;height:38px;border:1px solid #dde3eb;background:#fff;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:#243754;flex-shrink:0;padding:0;}
.tb-menu:hover{background:#f0f5fb;}
.tb-menu svg{width:19px;height:19px;}
.topbar{border-bottom:1px solid #dde3eb;}
.topbar h2{font-size:20px;font-weight:700;color:#132641;}
.card{border-radius:12px;padding:22px 24px;}
.btn{border-radius:8px;}
thead th{background:#f6f8fb;color:#4a5670;border-bottom:1px solid #dde3eb;}
tbody tr:hover{background:#f6f9fd;}
#viewConsolidado{max-width:none;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#c5cdd9;border-radius:8px;border:2px solid #eef2f7;}
::-webkit-scrollbar-thumb:hover{background:#a9b4c4;}

/* ---- Consolidado profesional ---- */
.cons-head-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cons-head-tools select{border:1px solid #dde3eb;border-radius:8px;padding:8px 11px;font-size:12.5px;font-family:var(--font-body);background:#fff;color:var(--ink);}
.cons-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:0 0 12px;font-size:11.5px;color:#4a5670;font-weight:600;}
.cons-legend span.lg{display:inline-flex;align-items:center;gap:6px;}
.cons-legend i{width:18px;height:18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font:700 10px var(--font-mono);}
.cons-scroll{overflow:auto;max-height:calc(100vh - 290px);border:1px solid #dde3eb;border-radius:10px;background:#fff;}
.cons-table{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12px;width:max-content;min-width:100%;}
.cons-table th,.cons-table td{box-sizing:border-box;}
.cons-corner{position:sticky;top:0;z-index:6;background:#132641;color:#fff;font-size:11px;font-weight:700;letter-spacing:.05em;text-align:center;padding:8px;border-right:1px solid rgba(255,255,255,.12);cursor:default;}
.cons-c0{left:0;}
.cons-c1{left:44px;}
th.cons-c0,th.cons-c1{z-index:7;}
.cons-area{position:sticky;top:0;z-index:4;height:34px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.06em;padding:0 6px;border-right:1px solid rgba(255,255,255,.28);cursor:default;text-transform:none;}
.cons-table thead th.cons-comp{position:sticky;top:34px;z-index:4;background:#f3f5f9;color:#2b3852;font-size:10px;font-weight:600;line-height:1.28;text-align:center;vertical-align:middle;padding:8px 4px;height:104px;border-bottom:3px solid #999;border-right:1px solid #e3e7ee;hyphens:auto;-webkit-hyphens:auto;word-break:break-word;text-transform:none;letter-spacing:0;cursor:default;}
.cons-sticky{position:sticky;background:#fff;z-index:2;}
.cons-num{text-align:center;font:700 11px var(--font-mono);color:#7b8698;border-right:1px solid #eceff4;border-bottom:1px solid #eceff4;}
.cons-nombre{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 10px;border-right:1px solid #dde3eb;border-bottom:1px solid #eceff4;color:#132641;}
.cons-gys{text-align:center;font-weight:700;font-size:11.5px;border-right:1px solid #eceff4;border-bottom:1px solid #eceff4;color:#132641;background:#fafbfd;}
.cons-nota{text-align:center;font:700 11px var(--font-mono);padding:7px 0;border-right:1px solid #f0f2f6;border-bottom:1px solid #eceff4;}
.cons-nota.n-AD{background:#e6f6f2;color:#1c6f61;}
.cons-nota.n-A{background:#eaf1ff;color:#2452a8;}
.cons-nota.n-B{background:#fdf3e2;color:#7a4f0f;}
.cons-nota.n-C{background:#fdeceb;color:#a4222c;}
.cons-nota.n-vacio{color:#c2c9d4;font-weight:400;}
.cons-row-c .cons-sticky{background:#fdf1f0;}
.cons-row-c .cons-num{box-shadow:inset 3px 0 0 var(--red);}
.cons-table tbody tr:hover td.cons-sticky{background:#eef3fb;}

/* ---- Calificaciones: contadores ---- */
.cal-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:0 0 18px;}
@media(max-width:900px){.cal-stats{grid-template-columns:repeat(2,1fr);}}
.cal-stat{--cbg:#eef2f7;--cfg:#132641;--cbd:#dde3eb;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:12px 16px;border-radius:12px;border:1.5px solid var(--cbd);background:var(--cbg);color:var(--cfg);transition:transform .12s,box-shadow .12s;font-family:var(--font-body);}
.cal-stat:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(19,38,65,.1);}
.cal-stat.on{box-shadow:0 0 0 2.5px var(--cfg);}
.cal-stat .cs-k{font:800 12px var(--font-mono);letter-spacing:.06em;}
.cal-stat .cs-n{font:800 28px var(--font-display);line-height:1.1;}
.cal-stat .cs-p{font:700 13px var(--font-mono);}
.cal-stat .cs-d{font-size:11px;font-weight:600;opacity:.8;}
.toolbar select{max-width:100%;}

/* ---- Riesgo: cantidad de C y situación ---- */
.rc-title{font:700 11px var(--font-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:2px 0 8px;}
.rc-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.rc-chip{--cbg:#eef2f7;--cfg:#132641;display:inline-flex;align-items:center;gap:8px;padding:7px 8px 7px 13px;border-radius:999px;border:1.5px solid transparent;background:var(--cbg);color:var(--cfg);font:700 12.5px var(--font-body);transition:box-shadow .12s,transform .12s;}
.rc-chip:hover{transform:translateY(-1px);box-shadow:0 3px 9px rgba(19,38,65,.12);}
.rc-chip.on{box-shadow:0 0 0 2.5px var(--cfg);}
.rc-chip.zero{opacity:.5;}
.rc-chip .rc-n{min-width:24px;height:24px;border-radius:999px;background:#fff;color:var(--cfg);display:inline-flex;align-items:center;justify-content:center;font:800 12px var(--font-mono);padding:0 6px;}
.rc-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:#4a5670;margin-bottom:14px;}
.rc-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px;border:1px solid rgba(0,0,0,.08);}
.rc-total{font-size:12px;font-weight:600;color:#4a5670;margin-bottom:8px;}
.rc-num{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border-radius:10px;font:800 15px var(--font-mono);}
.rc-sit{display:inline-block;padding:4px 11px;border-radius:999px;font:800 10.5px var(--font-body);letter-spacing:.04em;}
.rc-msg{font-size:11.5px;color:#4a5670;margin-top:5px;max-width:300px;line-height:1.4;}
.rc-ficha{border-radius:10px;padding:11px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:3px;font-size:12px;}
.rc-ficha strong{font-size:12.5px;letter-spacing:.02em;}

/* ---- Análisis por áreas ---- */
.ad-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 22px;}
.ad-bar-l{flex:1;min-width:260px;}
.ad-lbl{font:700 11px var(--font-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:7px;}
.ad-sel{display:flex;gap:8px;flex-wrap:wrap;}
.ad-sel select{border:1px solid #dde3eb;border-radius:9px;padding:9px 12px;font:600 13px var(--font-body);background:#fff;color:var(--ink);min-width:170px;}
.ad-scope{text-align:right;display:flex;flex-direction:column;gap:2px;}
.ad-scope strong{font:700 15px var(--font-display);color:#132641;}.ad-scope span{font-size:12px;color:var(--muted);font-weight:500;}
.ad-chart{position:relative;height:340px;}.ad-chart-s{height:300px;}
.ad-row .card{margin-bottom:18px;}
.ad-tag{display:inline-block;padding:3px 9px;border-radius:6px;font:800 10.5px var(--font-body);letter-spacing:.04em;white-space:nowrap;}
.ad-bar-bg{position:relative;height:22px;background:#f0f2f6;border-radius:6px;overflow:hidden;}
.ad-bar-fg{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#f0a1a7,#d64550);border-radius:6px;}
.ad-bar-bg span{position:relative;z-index:1;display:block;text-align:center;font:800 11px/22px var(--font-mono);color:#132641;}
.ad-list{margin-top:6px;}
.ad-config summary{cursor:pointer;font:700 14px var(--font-display);color:#132641;padding:2px 0;}
.ad-config[open] summary{margin-bottom:14px;}
@media(max-width:1100px){.ad-chart{height:300px;}}

/* ---- Consolidado: encabezado ajustado tipo Excel ---- */
.cons-table{table-layout:fixed;width:auto;min-width:0;}
.cons-table .cons-area{height:46px;white-space:normal;line-height:1.2;font-size:10px;padding:4px 6px;text-transform:none;}
.cons-table thead th.cons-comp{top:46px;height:auto;min-height:96px;white-space:normal;word-break:normal;overflow-wrap:break-word;hyphens:manual;-webkit-hyphens:manual;font-size:10.5px;font-weight:600;line-height:1.3;padding:8px 6px;color:#1a2233;border-bottom-width:3px;border-bottom-style:solid;vertical-align:middle;}
.cons-table .cons-corner{white-space:normal;}
.cons-tc{text-align:center;border-right:1px solid #eceff4;border-bottom:1px solid #eceff4;background:#fafbfd;}

<script>
/* =========================================================================
   SISTEMA DE SEGUIMIENTO DE ESTUDIANTES CON CALIFICACIÓN C — SECUNDARIA
   Arquitectura: SPA de archivo único · localStorage · Chart.js · SheetJS · jsPDF
   Estructura del código:
     1. Utilidades y estado global
     2. Modelo de datos y semilla inicial
     3. Persistencia (localStorage)
     4. Motor de automatización (detección de calificación C, riesgo)
     5. Componentes UI genéricos (modal, toast, tablas ordenables, validación)
     6. Módulos por entidad (Instituciones, Docentes, Secciones, Áreas,
        Estudiantes, Calificaciones, Riesgo, Seguimiento, Reportes)
     7. Dashboard con gráficos
     8. Router / navegación lateral
   ========================================================================= */

/* ---------------------------- 1. UTILIDADES ---------------------------- */
const uid = (p='id') => p + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const $ = (sel, ctx=document) => ctx.querySelector(sel);
const $$ = (sel, ctx=document) => Array.from(ctx.querySelectorAll(sel));
const esc = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => { if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const initials = (a='',b='') => ((a[0]||'')+(b[0]||'')).toUpperCase() || '·';
const GRADOS = [1,2,3,4,5];
const SECCION_LETRAS = ['A','B','C','D','E','F'];
const NOTAS = ['AD','A','B','C'];
const NOTA_LABEL = {AD:'Logro destacado', A:'Logro esperado', B:'En proceso', C:'En inicio'};
const ESTADOS_SEG = ['Pendiente','En proceso','Superado'];

/* ======================== CACHÉ DE CÓMPUTO PESADO ========================
   Todas las funciones derivadas costosas usan este caché.
   Se invalida con invalidateCache() cada vez que DB cambia.
   ========================================================================= */
const _cache = {};
function invalidateCache(){
  _cache.vigentes        = null;
  _cache.estudiantesConC = null;
  _cache.areasOrdenadas  = null;
  _cache.estMap          = null;
  _cache.areaMap         = null;
  _cache.compMap         = null;
  _cache.vigentesMap     = null;   // Map key=estId|areaId|compId → calificacion
  _cache.conCMap         = null;   // Map estId → {registros, areasCount, areaIds}
}
invalidateCache();

/* Maps de lookup O(1) para estudiantes, áreas y competencias */
function getEstMap(){
  if(_cache.estMap) return _cache.estMap;
  _cache.estMap = new Map(DB.estudiantes.map(e=>[e.id, e]));
  return _cache.estMap;
}
function getAreaMap(){
  if(_cache.areaMap) return _cache.areaMap;
  _cache.areaMap = new Map(DB.areas.map(a=>[a.id, a]));
  return _cache.areaMap;
}
function getCompMap(){
  if(_cache.compMap) return _cache.compMap;
  _cache.compMap = new Map();
  DB.areas.forEach(a => a.competencias.forEach(c => _cache.compMap.set(a.id+'|'+c.id, c)));
  return _cache.compMap;
}
/* Map vigentes: estId|areaId|compId → calificacion (string) */
function periodoVista(){
  var v=(DB.config&&DB.config.vista)||'';
  if(!v) return '';
  var ev=DB.config.evaluacion;
  return (ev&&ev.nombres.indexOf(v)>=0)?v:'';
}
function periodoRank(p){ var ev=DB.config&&DB.config.evaluacion; return ev?ev.nombres.indexOf(p||''):-1; }
function periodoDestino(def){ return periodoVista()||def; }
function getVigentesMap(){
  if(_cache.vigentesMap) return _cache.vigentesMap;
  const map = new Map(), vista = periodoVista();
  DB.calificaciones.forEach(c => {
    if(vista && c.periodo!==vista) return;
    const k = c.estudianteId+'|'+c.areaId+'|'+c.competenciaId;
    const prev = map.get(k);
    if(!prev){ map.set(k, c); return; }
    const rc=periodoRank(c.periodo), rp=periodoRank(prev.periodo);
    if(rc>rp || (rc===rp && c.fecha >= prev.fecha)) map.set(k, c);
  });
  _cache.vigentesMap = map;
  return map;
}
/* Map conC: estId → {registros:[], areasCount, areaIds:[]} */
function getConCMap(){
  if(_cache.conCMap) return _cache.conCMap;
  const estMap = getEstMap();
  const byStudent = new Map();
  getVigentesMap().forEach(c => {
    if(c.calificacion !== 'C') return;
    if(!byStudent.has(c.estudianteId)) byStudent.set(c.estudianteId, []);
    byStudent.get(c.estudianteId).push(c);
  });
  const result = new Map();
  byStudent.forEach((regs, estudianteId) => {
    const est = estMap.get(estudianteId);
    if(!est) return;
    const areasSet = new Set(regs.map(r=>r.areaId));
    result.set(estudianteId, { estudiante: est, registros: regs, areasCount: areasSet.size, areaIds:[...areasSet] });
  });
  _cache.conCMap = result;
  return result;
}

let DB = loadDB();
var _idbPendiente;
function idbAbrir(){
  return new Promise(function(res,rej){
    var r=indexedDB.open('sst_c_secundaria_idb',1);
    r.onupgradeneeded=function(){ r.result.createObjectStore('kv'); };
    r.onsuccess=function(){ res(r.result); };
    r.onerror=function(){ rej(r.error); };
  });
}
function idbPut(k,v){
  return idbAbrir().then(function(db){ return new Promise(function(res,rej){
    var t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k);
    t.oncomplete=function(){ db.close(); res(); };
    t.onerror=t.onabort=function(){ db.close(); rej(t.error); };
  }); });
}
function idbGet(k){
  return idbAbrir().then(function(db){ return new Promise(function(res,rej){
    var q=db.transaction('kv','readonly').objectStore('kv').get(k);
    q.onsuccess=function(){ db.close(); res(q.result); };
    q.onerror=function(){ db.close(); rej(q.error); };
  }); });
}
function loadDB(rawOverride){
  try{
    var raw = (rawOverride!==undefined) ? rawOverride : localStorage.getItem(DB_KEY);
    if(!raw) return seedDB();
    var parsed = JSON.parse(raw);
    if(rawOverride===undefined && parsed && parsed.idb){ _idbPendiente=true; return seedDB(); }
    var base = seedDB();
    var db = Object.assign(base, parsed, { areas: parsed.areas && parsed.areas.length ? parsed.areas : base.areas });
    db.config = cfgMerge(parsed.config);

    // Migrar nombres de area v24->v25
    var ALIAS_V25 = {'Temas Transversales (TIC)':'Temas Transversales TIC','Quechua':'Temas Transversales Autonomia'};
    db.areas.forEach(function(a){ if(ALIAS_V25[a.nombre]) a.nombre=ALIAS_V25[a.nombre]; });
    // Agregar areas transversales si no existen
    ['Temas Transversales TIC','Temas Transversales Autonomia'].forEach(function(nt){
      if(!db.areas.find(function(a){return a.nombre===nt;})){
        var def=AREAS_DEFAULT.find(function(x){return x.nombre===nt;});
        if(def) db.areas.push({id:uid('area'),nombre:def.nombre,competencias:def.competencias.map(function(c){return {id:uid('comp'),nombre:c};})});
      }
    });

    // Corrección curricular: esta competencia pertenece a Arte y Cultura,
    // no a Comunicación. También limpia configuraciones guardadas previamente.
    db.areas.forEach(function(area){
      var nombreArea=String(area.nombre||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
      if(nombreArea==='comunicacion' && Array.isArray(area.competencias)){
        area.competencias=area.competencias.filter(function(comp){
          var nombreComp=String(comp.nombre||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
          return nombreComp.indexOf('crea proyectos desde los lenguajes del arte')===-1 &&
                 nombreComp.indexOf('crea proyectos desde los lenguajes artisticos')===-1;
        });
      }
    });

    // Migrar formato compacto de calificaciones si existe
    if(parsed.calificaciones_v2 && Array.isArray(parsed.calificaciones_v2.r)){
      db.calificaciones = desempaquetarCalificaciones(parsed.calificaciones_v2);
    } else if(parsed.calificaciones_c && Array.isArray(parsed.calificaciones_c)){
      db.calificaciones = parsed.calificaciones_c.map(function(r){
        return {id: uid('cal'), estudianteId:r[0], areaId:r[1], competenciaId:r[2], calificacion:r[3], fecha:r[4]||'', periodo:(r[5]===undefined?'Consolidado':r[5]), docenteId:''};
      });
    }
    var competenciasValidas=new Set();
    db.areas.forEach(function(area){(area.competencias||[]).forEach(function(comp){competenciasValidas.add(comp.id);});});
    db.calificaciones=(db.calificaciones||[]).filter(function(cal){return competenciasValidas.has(cal.competenciaId);});
    return db;
  }catch(e){ console.error('Error cargando DB', e); return seedDB(); }
}
function purgarDuplicados(){
  // Solo actúa si hay duplicados reales (tamaño > claves únicas)
  var seen = {};
  var hayDup = false;
  for(var i = 0; i < DB.calificaciones.length; i++){
    var c = DB.calificaciones[i];
    var k = c.estudianteId+'|'+c.areaId+'|'+c.competenciaId+'|'+(c.periodo||'');
    if(seen[k]){ hayDup = true; break; }
    seen[k] = true;
  }
  if(!hayDup) return;
  // Conservar solo el más reciente por clave
  var seen2 = {};
  var limpia = [];
  for(var j = DB.calificaciones.length - 1; j >= 0; j--){
    var d = DB.calificaciones[j];
    var k2 = d.estudianteId+'|'+d.areaId+'|'+d.competenciaId+'|'+(d.periodo||'');
    if(!seen2[k2]){ seen2[k2] = true; limpia.push(d); }
  }
  DB.calificaciones = limpia.reverse();
}
/* Formato compacto v2: tablas de ids + filas numéricas (≈6 veces más liviano) */
function empaquetarCalificaciones(){
  var E=[],K=[],P=[],Fh=[],mE={},mK={},mP={},mF={};
  function ix(arr,map,v){ if(map[v]===undefined){ map[v]=arr.length; arr.push(v); } return map[v]; }
  var r=DB.calificaciones.map(function(c){
    return [ix(E,mE,c.estudianteId), ix(K,mK,c.areaId+'|'+c.competenciaId), c.calificacion, ix(P,mP,c.periodo||''), ix(Fh,mF,c.fecha||'')];
  });
  return {e:E,k:K,p:P,f:Fh,r:r};
}
function desempaquetarCalificaciones(v){
  return (v.r||[]).map(function(x){
    var k=String(v.k[x[1]]||'').split('|');
    return {id:uid('cal'), estudianteId:v.e[x[0]], areaId:k[0], competenciaId:k[1], calificacion:x[2], periodo:v.p[x[3]], fecha:v.f[x[4]], docenteId:''};
  });
}
function buildStoragePayload(){
  invalidateCache();
  purgarDuplicados();
  // Guardar calificaciones en formato compacto para ahorrar espacio:
  // [estudianteId, areaId, competenciaId, calificacion, fecha] — sin claves largas
  return {
    instituciones: DB.instituciones,
    docentes: DB.docentes,
    secciones: DB.secciones,
    areas: DB.areas,
    estudiantes: DB.estudiantes,
    seguimientos: DB.seguimientos,
    config: DB.config,
    calificaciones_v2: empaquetarCalificaciones()
  };
}
function persistDBNow(){
  var dbGuardar = buildStoragePayload();
  var str = JSON.stringify(dbGuardar);
  var okLS = true;
  try{ localStorage.setItem(DB_KEY, str); }catch(e){ okLS = false; }
  if(!okLS){
    // localStorage lleno (se comparte con otros archivos locales): usar IndexedDB, que tiene mucha más capacidad
    try{ localStorage.setItem(DB_KEY, '{"idb":1}'); }catch(e2){}
    idbPut('db', str).catch(function(err){
      console.error('No se pudo guardar en IndexedDB', err);
      actualizarEstadoOffice('error');
      toast('No se pudo guardar en el navegador. Usa Guardar (archivo .ssc) para proteger tus datos.','err');
    });
  }
  officeDirty = false;
  officeLastSavedAt = new Date();
  actualizarEstadoOffice('saved');
  return dbGuardar;
}
function saveDB(){
  invalidateCache();
  purgarDuplicados();
  officeDirty = true;
  if(autoSaveEnabled){
    actualizarEstadoOffice('saving');
    persistDBNow();
  }else{
    actualizarEstadoOffice('pending');
  }
}

/* ── areasOrdenadas() ─────────────────────────────────────────────────────────
   SIEMPRE devuelve DB.areas en el orden oficial fijo de AREAS_DEFAULT.
   Usar esta función en lugar de DB.areas en TODOS los procesos de:
     - Exportación de plantilla / consolidado actual
     - Vista del Consolidado (tabla + cabeceras)
     - Preview del SIAGIE
   Esto garantiza que el orden no dependa de cómo se almacenaron los datos.
   ──────────────────────────────────────────────────────────────────────────── */
function areasOrdenadas(){
  if(_cache.areasOrdenadas) return _cache.areasOrdenadas;
  // Índice por nombre para O(1) en lugar de find() repetido
  const byNombre = new Map(DB.areas.map(a=>[a.nombre.trim(), a]));
  _cache.areasOrdenadas = AREAS_DEFAULT.map(function(def){
    var a = byNombre.get(def.nombre.trim());
    if(!a) return null;
    // Ordenar competencias según orden oficial con índice
    const compByNombre = new Map(a.competencias.map(c=>[c.nombre.trim(), c]));
    const compIds = new Set();
    var compsOrdenadas = def.competencias.map(function(cn){
      const c = compByNombre.get(cn.trim());
      if(c) compIds.add(c.id);
      return c;
    }).filter(Boolean);
    // Competencias extra no definidas en el default
    a.competencias.forEach(function(c){
      if(!compIds.has(c.id)) compsOrdenadas.push(c);
    });
    return { id:a.id, nombre:a.nombre, competencias:compsOrdenadas };
  }).filter(Boolean);
  return _cache.areasOrdenadas;
}

// Tabla ordenable genérica
function sortableTable(containerId, columns, rows, opts={}){
  const state = sortableTable._state[containerId] = sortableTable._state[containerId] || {col:opts.defaultSort||columns[0].key, dir:1};
  let data = [...rows];
  data.sort((a,b)=>{
    let va = columns.find(c=>c.key===state.col).sortVal ? columns.find(c=>c.key===state.col).sortVal(a) : a[state.col];
    let vb = columns.find(c=>c.key===state.col).sortVal ? columns.find(c=>c.key===state.col).sortVal(b) : b[state.col];
    if(typeof va === 'string') va = va.toLowerCase();
    if(typeof vb === 'string') vb = vb.toLowerCase();
    if(va<vb) return -1*state.dir; if(va>vb) return 1*state.dir; return 0;
  });
  const theadHtml = '<thead><tr>' + columns.map(c=>`<th data-col="${c.key}">${c.label}${state.col===c.key?`<span class="arrow">${state.dir===1?'▲':'▼'}</span>`:''}</th>`).join('') + '</tr></thead>';
  const bodyRows = data.length ? data.map(r => opts.rowRenderer(r)).join('') :
    `<tr><td colspan="${columns.length}"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/><path d="M13 3h8v8"/><path d="m21 3-9.5 9.5"/></svg><p>${opts.emptyText||'Sin registros todavía.'}</p></div></td></tr>`;
  const el = document.getElementById(containerId);
  el.innerHTML = `<div class="table-wrap"><table>${theadHtml}<tbody>${bodyRows}</tbody></table></div>`;
  $$('th', el).forEach(th => th.addEventListener('click', () => {
    if(state.col===th.dataset.col) state.dir*=-1; else { state.col=th.dataset.col; state.dir=1; }
    sortableTable(containerId, columns, rows, opts);
  }));
}
sortableTable._state = {};

function selectOptions(items, valueKey, labelFn, selected){
  return items.map(i => `<option value="${i[valueKey]}" ${selected===i[valueKey]?'selected':''}>${esc(labelFn(i))}</option>`).join('');
}

/* ============================================================
   ANÁLISIS POR ÁREAS Y COMPETENCIAS (dashboard)
   ============================================================ */
let areaDash={modo:'ie',valor:'',sit:'',cfgOpen:false};
let _adCharts={};
function adDestroy(){ Object.keys(_adCharts).forEach(function(k){ try{_adCharts[k].destroy();}catch(e){} }); _adCharts={}; }
const SIT_COL={grave:'#c0392b',dific:'#e67e22',inicio:'#f1c40f',sinc:'#3fa796'};
const SIT_TXT={grave:'Situación grave',dific:'En dificultad',inicio:'En inicio',sinc:'Sin C'};
const SIT_RANGO={grave:'8 o más C',dific:'4 a 7 C',inicio:'1 a 3 C',sinc:'Ninguna C'};

function adGradosPresentes(){ return [...new Set(DB.estudiantes.map(function(e){return String(e.grado);}))].sort(); }
function adSeccionesPresentes(){ return [...new Set(DB.estudiantes.map(function(e){return (e.seccion||'').toUpperCase();}))].sort(); }
function adGSPresentes(){ return [...new Set(DB.estudiantes.map(califGS))].sort(); }
function adValores(){
  if(areaDash.modo==='grado') return adGradosPresentes().map(function(g){return {v:g,l:g+'.º grado'};});
  if(areaDash.modo==='seccion') return adSeccionesPresentes().map(function(s){return {v:s,l:'Sección '+s};});
  if(areaDash.modo==='gs') return adGSPresentes().map(function(g){return {v:g,l:g};});
  return [];
}
function adEstudiantes(){
  const d=areaDash;
  return DB.estudiantes.filter(function(e){
    return d.modo==='ie' || (d.modo==='grado' && String(e.grado)===d.valor) ||
      (d.modo==='seccion' && (e.seccion||'').toUpperCase()===d.valor) || (d.modo==='gs' && califGS(e)===d.valor);
  });
}
function adAmbitoTxt(){
  const d=areaDash;
  if(d.modo==='grado') return d.valor+'.º grado (todas las secciones)';
  if(d.modo==='seccion') return 'Sección '+d.valor+' (todos los grados)';
  if(d.modo==='gs') return 'Grado y sección '+d.valor;
  return 'Toda la institución educativa';
}
function adCambiarModo(m){ areaDash.modo=m; areaDash.valor=''; areaDash.sit=''; renderAreas(); }
function adCambiarValor(v){ areaDash.valor=v; areaDash.sit=''; renderAreas(); }
function adSetSit(k){ areaDash.sit=(areaDash.sit===k)?'':k; renderAreas(); }

function adCompute(){
  const est=adEstudiantes(), ids=new Set(est.map(function(e){return e.id;}));
  const areas=areasOrdenadas();
  const compStat=new Map(), areaStat=new Map();
  areas.forEach(function(a){
    areaStat.set(a.id,{area:a,conC:new Set(),ev:new Set()});
    a.competencias.forEach(function(c){ compStat.set(a.id+'|'+c.id,{area:a,comp:c,AD:0,A:0,B:0,C:0,ev:0}); });
  });
  const evalSet=new Set(), niveles={AD:0,A:0,B:0,C:0};
  getVigentesMap().forEach(function(r){
    if(!ids.has(r.estudianteId)) return;
    const cs=compStat.get(r.areaId+'|'+r.competenciaId); if(!cs) return;
    const n=r.calificacion; if(!(n in niveles)) return;
    cs[n]++; cs.ev++; niveles[n]++; evalSet.add(r.estudianteId);
    const as=areaStat.get(r.areaId); as.ev.add(r.estudianteId); if(n==='C') as.conC.add(r.estudianteId);
  });
  const conCMap=getConCMap();
  const sit={grave:[],dific:[],inicio:[],sinc:[]};
  est.forEach(function(e){
    if(!evalSet.has(e.id)) return;
    const m=conCMap.get(e.id), n=m?m.registros.length:0, it={e:e,n:n};
    if(!n) sit.sinc.push(it);
    else { const s=situacionPorC(n); (s.n===3?sit.grave:s.n===2?sit.dific:sit.inicio).push(it); }
  });
  Object.keys(sit).forEach(function(k){ sit[k].sort(function(a,b){ return b.n-a.n || (a.e.apellidos+a.e.nombres).localeCompare(b.e.apellidos+b.e.nombres); }); });
  const grupos=new Map();
  Object.keys(sit).forEach(function(k){
    sit[k].forEach(function(it){
      const e=it.e; let g;
      if(areaDash.modo==='ie') g=e.grado+'.º grado';
      else if(areaDash.modo==='grado') g='Sec. '+(e.seccion||'').toUpperCase();
      else if(areaDash.modo==='seccion') g=e.grado+'.º "'+(e.seccion||'').toUpperCase()+'"';
      else g=califGS(e);
      if(!grupos.has(g)) grupos.set(g,{grave:0,dific:0,inicio:0,sinc:0});
      grupos.get(g)[k]++;
    });
  });
  const comps=Array.from(compStat.values()).filter(function(x){return x.ev>0;})
    .sort(function(a,b){ return b.C-a.C || (b.C/b.ev)-(a.C/a.ev); });
  return {est:est,evalN:evalSet.size,areaStat:Array.from(areaStat.values()),comps:comps,niveles:niveles,sit:sit,
    grupos:Array.from(grupos.entries()).sort(function(a,b){return a[0].localeCompare(b[0],'es',{numeric:true});})};
}
function adPct(n,t){ return t? Math.round(n*1000/t)/10 : 0; }
function adFmtPct(n,t){ return adPct(n,t).toString().replace('.',',')+' %'; }

function renderAreas(){ renderDashboard(); }

      '</div></div>'+
    '<div class="ad-scope"><strong>'+esc(adAmbitoTxt())+'</strong><span>'+D.evalN+' estudiante(s) con notas · '+totN+' calificaciones</span></div>'+
    (D.evalN?'<div class="btn-row"><button class="btn secondary" onclick="adImprimir()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>Imprimir</button>'+
      '<button class="btn gold" onclick="adDescargarPDF()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15l3 3 3-3"/></svg>Descargar PDF</button></div>':'')+
  '</div>';

  if(!D.evalN){
    html+='<div class="card"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg><p>No hay calificaciones registradas en este ámbito. Importa el SIAGIE o el Consolidado para ver el análisis.</p></div></div>';
  } else {
    html+='<div class="grid grid-4" style="margin-bottom:18px;">'+
      '<div class="kpi accent-navy"><div class="stripe"></div><div class="eyebrow">Estudiantes evaluados</div><div class="num">'+D.evalN+'</div><div class="foot">'+esc(adAmbitoTxt())+'</div></div>'+
      '<div class="kpi accent-red"><div class="stripe"></div><div class="eyebrow">Estudiantes con C</div><div class="num">'+conC+'</div><div class="foot">'+adFmtPct(conC,D.evalN)+' de los evaluados</div></div>'+
      '<div class="kpi accent-gold"><div class="stripe"></div><div class="eyebrow">Calificaciones C</div><div class="num">'+totC+'</div><div class="foot">'+adFmtPct(totC,totN)+' de todas las notas</div></div>'+
      '<div class="kpi accent-teal"><div class="stripe"></div><div class="eyebrow">Competencia más crítica</div><div class="num" style="font-size:20px;line-height:1.25;">'+(topComp?adFmtPct(topComp.C,topComp.ev):'—')+'</div><div class="foot">'+(topComp?esc(consAreaAbrev(topComp.area.nombre)+' · '+topComp.comp.nombre):'')+'</div></div>'+
    '</div>';

function adDibujar(D){
  const baseFont={family:'JetBrains Mono, monospace',weight:'700',size:11};
  /* 1. Columnas por área */
  const ar=D.areaStat.map(function(a){return {n:a.area.nombre,c:a.conC.size,e:a.ev.size};}).sort(function(x,y){return y.c-x.c;});
  _adCharts.area=new Chart($('#adChArea'),{type:'bar',
    data:{labels:ar.map(function(x){return consAreaAbrev(x.n);}),datasets:[{data:ar.map(function(x){return x.c;}),backgroundColor:ar.map(function(x){return consAreaColor(x.n).bg;}),borderRadius:6,maxBarThickness:42}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:26}},
      plugins:{legend:{display:false},
        tooltip:{callbacks:{title:function(c){return ar[c[0].dataIndex].n;},label:function(c){const x=ar[c.dataIndex];return ' '+x.c+' de '+x.e+' evaluados — '+adFmtPct(x.c,x.e);}}},
        datalabels:{anchor:'end',align:'end',color:'#152238',font:baseFont,formatter:function(v,c){const x=ar[c.dataIndex];return v?v+'\n'+adFmtPct(v,x.e):'0';},textAlign:'center'}},
      scales:{y:{beginAtZero:true,ticks:{precision:0},grid:{color:'#eee6d8'},border:{display:false}},x:{grid:{display:false},ticks:{font:{size:11,weight:'600'}}}}}});

  /* 2. Situación (circular) */
  const sk=['grave','dific','inicio','sinc'];
  _adCharts.sit=new Chart($('#adChSit'),{type:'doughnut',
    data:{labels:sk.map(function(k){return SIT_TXT[k];}),datasets:[{data:sk.map(function(k){return D.sit[k].length;}),backgroundColor:sk.map(function(k){return SIT_COL[k];}),borderColor:'#fff',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'55%',
      plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},padding:12}},
        tooltip:{callbacks:{label:function(c){return ' '+c.label+': '+c.parsed+' est. — '+adFmtPct(c.parsed,D.evalN);}}},
        datalabels:{color:'#fff',font:{family:'JetBrains Mono, monospace',weight:'800',size:12},display:function(c){return c.dataset.data[c.dataIndex]>0;},
          formatter:function(v){const p=adPct(v,D.evalN);return p<4?'':v+'\n'+p+' %';},textAlign:'center'}}}});

  /* 3. Top 10 competencias (barras horizontales) */
  const top=D.comps.slice(0,10);
  const corto=function(s){return s.length>46?s.slice(0,45)+'…':s;};
  _adCharts.comp=new Chart($('#adChComp'),{type:'bar',
    data:{labels:top.map(function(x){return corto(consAreaAbrev(x.area.nombre)+' · '+x.comp.nombre);}),datasets:[{data:top.map(function(x){return x.C;}),backgroundColor:top.map(function(x){return consAreaColor(x.area.nombre).bg;}),borderRadius:5,maxBarThickness:22}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,layout:{padding:{right:60}},
      plugins:{legend:{display:false},
        tooltip:{callbacks:{title:function(c){const x=top[c[0].dataIndex];return x.area.nombre+' — '+x.comp.nombre;},label:function(c){const x=top[c.dataIndex];return ' '+x.C+' de '+x.ev+' — '+adFmtPct(x.C,x.ev);}}},
        datalabels:{anchor:'end',align:'end',color:'#152238',font:baseFont,formatter:function(v,c){const x=top[c.dataIndex];return v+'  ('+adFmtPct(v,x.ev)+')';}}},
      scales:{x:{beginAtZero:true,ticks:{precision:0},grid:{color:'#eee6d8'},border:{display:false}},y:{grid:{display:false},ticks:{font:{size:10.5}}}}}});

  /* 4. Niveles de logro (circular) */
  const nk=['AD','A','B','C'], tot=nk.reduce(function(s,k){return s+D.niveles[k];},0);
  const NC={AD:'#3fa796',A:'#5b8def',B:'#e8a33d',C:'#d64550'};
  _adCharts.niv=new Chart($('#adChNiv'),{type:'doughnut',
    data:{labels:nk.map(function(k){return k+' — '+CAL_COL[k].txt;}),datasets:[{data:nk.map(function(k){return D.niveles[k];}),backgroundColor:nk.map(function(k){return NC[k];}),borderColor:'#fff',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'55%',
      plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},padding:12}},
        tooltip:{callbacks:{label:function(c){return ' '+c.label+': '+c.parsed+' — '+adFmtPct(c.parsed,tot);}}},
        datalabels:{color:'#fff',font:{family:'JetBrains Mono, monospace',weight:'800',size:12},display:function(c){return c.dataset.data[c.dataIndex]>0;},
          formatter:function(v){const p=adPct(v,tot);return p<4?'':p+' %';}}}}});

  /* 5. Comparativo por grupo (columnas separadas, una por situación) */
  _adCharts.grp=new Chart($('#adChGrp'),{type:'bar',
    data:{labels:D.grupos.map(function(g){return g[0];}),datasets:sk.map(function(k){return {label:SIT_TXT[k],data:D.grupos.map(function(g){return g[1][k];}),backgroundColor:SIT_COL[k],borderRadius:5,maxBarThickness:46};})},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:24}},
      datasets:{bar:{categoryPercentage:0.78,barPercentage:0.92}},
      plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},padding:14}},
        tooltip:{callbacks:{label:function(c){const tot=D.grupos[c.dataIndex][1];const t=tot.grave+tot.dific+tot.inicio+tot.sinc;return ' '+c.dataset.label+': '+c.parsed.y+' est. — '+adFmtPct(c.parsed.y,t);}}},
        datalabels:{anchor:'end',align:'end',color:'#152238',font:baseFont,formatter:function(v,c){const tot=D.grupos[c.dataIndex][1];const t=tot.grave+tot.dific+tot.inicio+tot.sinc;return v+'\n'+adFmtPct(v,t);},textAlign:'center'}},
      scales:{x:{grid:{display:false},ticks:{font:{size:12,weight:'700'}}},y:{beginAtZero:true,ticks:{precision:0},grid:{color:'#eee6d8'},border:{display:false},grace:'12%'}}}});
}

function adImprimir(){
  const D=adCompute(); if(!D.evalN){ toast('No hay datos para imprimir en este ámbito.','err'); return; }
  const sheet=$('#printSheet'); sheet.innerHTML=adBuildPrintHTML(D);
  const st=document.createElement('style'); st.id='adPageStyle';
  st.textContent='@page{size:A4 portrait;margin:20mm;}@media print{.app,.overlay,.toast-wrap{display:none!important;}.print-sheet{position:static!important;padding:0!important;}}';
  document.head.appendChild(st);
  const limpiar=function(){ const s=document.getElementById('adPageStyle'); if(s) s.remove(); sheet.innerHTML=''; window.removeEventListener('afterprint',limpiar); };
  window.addEventListener('afterprint',limpiar);
  setTimeout(function(){ window.print(); },250);
}
function adDescargarPDF(){

  if(!window.jspdf||!window.jspdf.jsPDF){ toast('No se cargó la librería PDF. Verifica tu conexión a internet.','err'); return; }
  const doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  if(typeof doc.autoTable!=='function'){ toast('No se cargó el complemento de tablas PDF. Verifica tu conexión a internet.','err'); return; }
  const M=20, W=170, BOT=277, R=adResumen(D);
  const inst=DB.instituciones.length?DB.instituciones[0].nombre:'';
  const fecha=new Date().toLocaleDateString('es-PE',{year:'numeric',month:'long',day:'numeric'});
  let y=M;

  const encabezado=function(){
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(19,38,65);
    doc.text('Análisis por áreas y competencias',M,M+4);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(107,114,128);
    doc.text((inst?inst+' · ':'')+'Nivel Secundaria · '+adAmbitoTxt(),M,M+9);
    doc.text('Emitido: '+fecha,M+W,M+4,{align:'right'});
    doc.text(D.evalN+' estudiante(s) · '+R.totN+' calificaciones',M+W,M+9,{align:'right'});
    doc.setDrawColor(19,38,65); doc.setLineWidth(0.6); doc.line(M,M+12,M+W,M+12);
  };
  const nueva=function(){ doc.addPage(); y=M; };
  const asegurar=function(h){ if(y+h>BOT) nueva(); };
  const seccion=function(t){
    asegurar(14); doc.setFillColor(232,163,61); doc.rect(M,y,1.2,5,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(19,38,65); doc.text(t,M+3.5,y+3.9); y+=8;
  };
  const imagen=function(k,x,w,maxH){
    const im=adImg(k); if(!im) return 0;
    let ww=w, hh=w*im.h/im.w; if(maxH && hh>maxH){ hh=maxH; ww=hh*im.w/im.h; }
    doc.setDrawColor(227,231,238); doc.setLineWidth(0.2); doc.roundedRect(x,y,w,hh+4,1.5,1.5,'S');
    doc.addImage(im.data,'PNG',x+(w-ww)/2,y+2,ww,hh);
    return hh+4;
  };

  encabezado(); y=M+16;

  // KPIs
  const kp=[['ESTUDIANTES EVALUADOS',String(D.evalN),adAmbitoTxt(),[19,38,65]],['ESTUDIANTES CON C',String(R.conC),adFmtPct(R.conC,D.evalN)+' de los evaluados',[164,34,44]],
    ['CALIFICACIONES C',String(R.totC),adFmtPct(R.totC,R.totN)+' de todas las notas',[122,79,15]],['COMPETENCIA MÁS CRÍTICA',R.topComp?adFmtPct(R.topComp.C,R.topComp.ev):'—',R.topComp?consAreaAbrev(R.topComp.area.nombre)+' · '+R.topComp.comp.nombre:'',[28,111,97]]];
  const kw=(W-3*3)/4;
  kp.forEach(function(k,i){
    const x=M+i*(kw+3);
    doc.setDrawColor(221,227,235); doc.setLineWidth(0.2); doc.roundedRect(x,y,kw,20,1.5,1.5,'S');
    doc.setFont('helvetica','bold'); doc.setFontSize(6); doc.setTextColor(107,114,128); doc.text(k[0],x+2.5,y+4.5);
    doc.setFontSize(15); doc.setTextColor(k[3][0],k[3][1],k[3][2]); doc.text(k[1],x+2.5,y+12);
    doc.setFont('helvetica','normal'); doc.setFontSize(5.8); doc.setTextColor(107,114,128);
    doc.text(doc.splitTextToSize(k[2],kw-4).slice(0,2),x+2.5,y+16);
  });
  y+=25;

  // Gráfico por área
  seccion('Estudiantes con C por área curricular');
  let hh=imagen('area',M,W,72); y+=hh+5;

  // Situación + niveles (lado a lado)
  seccion('Situación de los estudiantes y niveles de logro');
  const half=(W-4)/2;
  const i1=adImg('sit'), i2=adImg('niv');
  const hs=Math.max(i1?half*i1.h/i1.w:0, i2?half*i2.h/i2.w:0);
  asegurar(Math.min(hs,70)+6);
  const capH=Math.min(hs,68);
  const a1=imagen('sit',M,half,capH), a2=imagen('niv',M+half+4,half,capH);
  y+=Math.max(a1,a2)+5;

  // Tarjetas de situación
  seccion('Estudiantes según situación');
  asegurar(24);
  const sk=['grave','dific','inicio','sinc'], sw=(W-3*3)/4;
  sk.forEach(function(k,i){
    const x=M+i*(sw+3), n=D.sit[k].length, bg=AD_SIT_BG[k], fg=AD_SIT_FG[k], c=SIT_COL[k];
    doc.setFillColor(bg[0],bg[1],bg[2]); doc.roundedRect(x,y,sw,20,1.5,1.5,'F');
    doc.setFillColor(parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)); doc.rect(x+1.5,y,sw-3,0.9,'F');
    doc.setTextColor(fg[0],fg[1],fg[2]); doc.setFont('helvetica','bold');
    doc.setFontSize(6.5); doc.text(SIT_TXT[k].toUpperCase(),x+sw/2,y+5,{align:'center'});
    doc.setFontSize(14); doc.text(String(n),x+sw/2,y+11.5,{align:'center'});
    doc.setFontSize(8); doc.text(adFmtPct(n,D.evalN),x+sw/2,y+15.5,{align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(6); doc.text(SIT_RANGO[k],x+sw/2,y+18.5,{align:'center'});
  });
  y+=25;

  // Top competencias
  const it=adImg('comp');
  if(it){ const need=Math.min(W*it.h/it.w,72)+14; asegurar(need); }
  seccion('10 competencias con más C');
  hh=imagen('comp',M,W,72); y+=hh+5;

  // Comparativo
  const ig=adImg('grp');
  if(ig){ asegurar(Math.min(W*ig.h/ig.w,66)+14); }
  seccion('Comparativo por '+(areaDash.modo==='ie'?'grado':areaDash.modo==='grado'?'sección':areaDash.modo==='seccion'?'grado':'grado y sección'));
  hh=imagen('grp',M,W,66); y+=hh+5;

  // Tabla de competencias
  if(y>BOT-40) nueva();
  seccion('Detalle por competencia (de mayor a menor cantidad de C)');
  const NOTAT={AD:[28,111,97],A:[36,82,168],B:[122,79,15],C:[164,34,44]};
  doc.autoTable({
    startY:y, margin:{top:M,left:M,right:M,bottom:M}, tableWidth:W, theme:'grid',
    head:[['N°','Área','Competencia','Evaluados','AD','A','B','C','% con C']],
    body:D.comps.map(function(x,i){ return [i+1,consAreaAbrev(x.area.nombre),x.comp.nombre,x.ev,x.AD,x.A,x.B,x.C,adFmtPct(x.C,x.ev)]; }),
    styles:{fontSize:6.8,cellPadding:1.3,valign:'middle',lineColor:[221,225,232],lineWidth:0.1,textColor:[26,34,51],overflow:'linebreak'},
    headStyles:{fillColor:[19,38,65],textColor:255,fontSize:7,fontStyle:'bold',halign:'center'},
    columnStyles:{0:{cellWidth:8,halign:'center'},1:{cellWidth:14,halign:'center',fontStyle:'bold'},2:{cellWidth:'auto'},3:{cellWidth:15,halign:'center'},4:{cellWidth:9,halign:'center'},5:{cellWidth:9,halign:'center'},6:{cellWidth:9,halign:'center'},7:{cellWidth:9,halign:'center'},8:{cellWidth:16,halign:'center',fontStyle:'bold'}},
    didParseCell:function(d){
      if(d.section!=='body') return;
      const ci=d.column.index;
      if(ci===1){ const x=D.comps[d.row.index], col=consAreaColor(x.area.nombre); const rgb=function(s){return [parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];}; d.cell.styles.fillColor=rgb(col.bg); d.cell.styles.textColor=rgb(col.fg); }
      if(ci>=4&&ci<=7){ const k=['AD','A','B','C'][ci-4]; d.cell.styles.textColor=NOTAT[k]; d.cell.styles.fontStyle='bold'; }
      if(ci===8){ const p=adPct(D.comps[d.row.index].C,D.comps[d.row.index].ev); if(p>=50){d.cell.styles.fillColor=[253,236,235];d.cell.styles.textColor=[164,34,44];} else if(p>=25){d.cell.styles.fillColor=[253,243,226];d.cell.styles.textColor=[122,79,15];} }
    }
  });
  y=doc.lastAutoTable.finalY+7;

  // Lista de la situación elegida
  if(areaDash.sit){
    const l=D.sit[areaDash.sit];
    if(y>BOT-30) nueva();
    seccion('Estudiantes — '+SIT_TXT[areaDash.sit]+' ('+l.length+')');
    doc.autoTable({
      startY:y, margin:{top:M,left:M,right:M,bottom:M}, tableWidth:W, theme:'grid',
      head:[['N°','Estudiante','Grado/Sec.','N.° de C']],
      body:l.map(function(x,i){ return [i+1,(x.e.apellidos+', '+x.e.nombres).toUpperCase(),califGS(x.e),x.n]; }),
      styles:{fontSize:7,cellPadding:1.4,lineColor:[221,225,232],lineWidth:0.1,textColor:[26,34,51]},
      headStyles:{fillColor:[19,38,65],textColor:255,fontSize:7.5,fontStyle:'bold',halign:'center'},
      columnStyles:{0:{cellWidth:9,halign:'center'},1:{cellWidth:'auto'},2:{cellWidth:24,halign:'center'},3:{cellWidth:20,halign:'center',fontStyle:'bold'}}
    });
  }

  const total=doc.getNumberOfPages();
  for(let i=1;i<=total;i++){
    doc.setPage(i);
    if(i>1){ doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(150,158,170); doc.text('Análisis por áreas y competencias · '+adAmbitoTxt(),M,M-6); }
    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(150,158,170);
    doc.text('AD = Logro destacado · A = Logro esperado · B = En proceso · C = En inicio · 1-3 C: En inicio · 4-7 C: En dificultad · 8+ C: Situación grave',M,285);
    doc.text('Página '+i+' de '+total,M+W,285,{align:'right'});
  }
  const sufijo=areaDash.modo==='ie'?'IE':(areaDash.modo+'_'+areaDash.valor);
  doc.save('Analisis_areas_'+sufijo+'_'+todayISO()+'.pdf');
  toast('PDF del análisis descargado.');
}

function estSetGS(k){ estFiltros=Object.assign({}, estFiltros, {gs:k}); paintEstudiantesTable(); }
function paintEstudiantesTable(){
  const f=estFiltros;
  $$('#estChips .rc-chip').forEach(b=>b.classList.toggle('on', (b.dataset.gs||'')===(f.gs||'')));
  const cm=getConCMap(), sitCache=new Map();
  const sitOf=e=>{ if(!sitCache.has(e.id)) sitCache.set(e.id, calcularSituacionEstudiante(e)); return sitCache.get(e.id); };
  let rows = DB.estudiantes.filter(e => {
    const esF=String(e.sexo||'M').toUpperCase().startsWith('F');
    const nc=cm.has(e.id)?cm.get(e.id).registros.length:0;
    if(f.gs && e.grado+String(e.seccion||'').toUpperCase()!==f.gs) return false;
    if(f.sexo==='H' && esF) return false;
    if(f.sexo==='M' && !esF) return false;
    if(f.sit==='C' && !nc) return false;
    if(f.sit==='SIN' && nc) return false;
    if(f.sit==='TRAS' && e.traslado!=='SI') return false;
    if(f.q && !(e.apellidos+' '+e.nombres+' '+(e.dni||'')).toLowerCase().includes(f.q)) return false;
    return true;
  });
  const cnt=$('#estCount'); if(cnt) cnt.textContent=rows.length+' de '+DB.estudiantes.length+' estudiante(s)';
  const DEF={PROMOVIDO:['PROM','#dff3e6','#17693a'],RECUPERACION:['REC','#fdefd0','#8a5a00'],PERMANECE:['PER','#fbd9d6','#a4222c'],TRASLADADO:['TRAS','#fff4be','#6e5a00'],SIN_EVALUAR:['S/E','#edf0f5','#657086']};
  sortableTable('tblEstudiantes',
    [{key:'apellidos',label:'Apellidos y nombres'},{key:'dni',label:'DNI'},{key:'sexo',label:'Sexo',sortVal:r=>String(r.sexo||'M')},{key:'grado',label:'Grado y secc.',sortVal:r=>r.grado+String(r.seccion||'')},
     {key:'c',label:'N.º C',sortVal:r=>cm.has(r.id)?cm.get(r.id).registros.length:0},{key:'sit',label:'Situación final',sortVal:r=>sitOf(r).codigo},{key:'acciones',label:''}],
    rows,
    { emptyText:'No se encontraron estudiantes con los filtros actuales.',
      rowRenderer: r => {
        const n=cm.has(r.id)?cm.get(r.id).registros.length:0, s=n?situacionPorC(n):null, st=sitOf(r), d=DEF[st.codigo]||DEF.SIN_EVALUAR;
        const sx=String(r.sexo||'M').toUpperCase().startsWith('F')?'M':'H';
        return `<tr>
        <td class="est-name"><span class="est-ini">${initials(r.nombres,r.apellidos)}</span><strong>${esc((r.apellidos+', '+r.nombres).toUpperCase())}</strong></td>
        <td class="est-mono">${esc(r.dni||'—')}</td>
        <td style="text-align:center;font-weight:700;">${sx}</td>
        <td style="text-align:center;font-weight:700;white-space:nowrap;">${r.grado}.º ${esc(r.seccion)}</td>
        <td style="text-align:center;">${n?`<span class="pill" style="background:${s.bg};color:${s.fg};font-weight:800;" title="${s.label}">${n}</span>`:'<span class="small-muted">0</span>'}</td>
        <td style="text-align:center;"><span class="pill" style="background:${d[1]};color:${d[2]};font-weight:800;" title="${esc(st.motivo)}">${d[0]}</span></td>
        <td><div class="btn-row" style="flex-wrap:nowrap;justify-content:flex-end;">
          <button class="btn secondary sm" onclick="formEstudiante('${r.id}')">Editar</button>
          <button class="btn gold sm" onclick="openFicha('${r.id}')">Ficha</button>
          <button class="btn danger sm" onclick="deleteEntity('estudiantes','${r.id}','estudiante')">Eliminar</button>
        </div></td></tr>`; }});
}
